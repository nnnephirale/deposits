<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- black-translucent is the ONLY value that lets the page paint under the status bar. Every
     other value (default / black) makes iOS reserve an opaque strip and fill it, which reads
     as a hard grey band across the top no matter what colour it is put — and theme-color does
     not update that strip at runtime in an installed web app, so chasing the colour can't work
     either. The cost is that the clock and battery go white and are not controllable from CSS.
     Accepted deliberately (30 Jul 2026): full bleed at all times matters more here.
     Everything below the meta assumes env(safe-area-inset-top) is now REAL (~59px), not 0. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#F0F0F1" />
<title>deposits</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Lexend Exa Medium: the day letter in the badge. one weight, one use. -->
<link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@500&display=swap" rel="stylesheet">
<!-- Redacted Script: ||redact|| content drawn as scribbles until tapped. -->
<link href="https://fonts.googleapis.com/css2?family=Redacted+Script&display=block" rel="stylesheet">
<!-- one stylesheet per part of the app. ORDER MATTERS: these are the old styles.css cut at
     top-level boundaries, so the cascade is exactly what it was. A rule that overrides another
     at equal specificity has to stay in a later file (desktop.css and dark.css depend on it). -->
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/bloom.css" />
<link rel="stylesheet" href="css/tuner.css" />
<link rel="stylesheet" href="css/settings.css" />
<link rel="stylesheet" href="css/list.css" />
<link rel="stylesheet" href="css/richtext.css" />
<link rel="stylesheet" href="css/format-bar.css" />
<link rel="stylesheet" href="css/summary.css" />
<link rel="stylesheet" href="css/composer.css" />
<link rel="stylesheet" href="css/recap.css" />
<link rel="stylesheet" href="css/desktop.css" />
<link rel="stylesheet" href="css/dark.css" />
<!-- the theme is resolved here, before the stylesheet paints anything, so a dark-mode open never
     flashes the light canvas first. applyTheme() in the module keeps it current after that. -->
<script>
  (function () {
    var m = "system";
    try { m = localStorage.getItem("weekly-deposits-theme") || "system"; } catch (e) {}
    var dark = m === "dark" || (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
</head>
<body>
<!-- the deck is `display: contents` below the desktop breakpoint, so on a phone this markup
     lays out exactly as it did when .wrap, .bottom-frost and .compose-dock were body children.
     At >=1080px it becomes the floating window: rail / entries / rail. -->
<div class="deck">
  <aside class="rail rail-l" id="railL" aria-label="Periods"></aside>

  <div class="deck-main">
    <div class="wrap">
      <div class="header">
        <div class="header-top">
          <div class="stepper-center" id="periodLabel"></div>
        </div>
        <div class="period-row">
          <button class="stepper-btn" id="prevBtn">&lsaquo;</button>
          <div class="period-nav">
            <button class="period-tab" id="navWeek" aria-label="Week view"></button>
            <span class="period-sep">/</span>
            <button class="period-tab" id="navMonth" aria-label="Month view"></button>
          </div>
          <button class="stepper-btn" id="nextBtn">&rsaquo;</button>
        </div>
      </div>

      <!-- the door to the wrapped. Deliberately OUTSIDE .header: the header is sticky and
           this must not be — it scrolls away with the list and fades as it goes. -->
      <div class="wrapped-cue" id="wrappedCue" hidden>
        <button class="wc-chev" id="wcChev" aria-label="Open the wrapped">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>
      </div>

      <div id="entriesRoot"></div>
    </div>

    <div class="bottom-frost"></div>
    <div class="compose-dock" id="dock">
      <div class="compose-bar" id="fab" role="button" tabindex="0" aria-label="New entry">
        <span class="compose-hint shimmer">Start typing&#8230;</span>
        <span class="compose-actions">
          <button class="compose-icon" id="composeAdd" aria-label="New entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
          <span class="compose-divider"></span>
          <button class="compose-lozenge" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
        </span>
      </div>
    </div>
  </div>

  <aside class="rail rail-r" id="railR" aria-label="Topics"></aside>
</div>
<!-- the heat bloom: the transition INTO the wrapped, scrubbed by the chevron's drag.
     One element, one --p from 0 to 1; the fields are built per period from her topics. -->
<div class="heat" id="heat" aria-hidden="true"><div class="heat-wash"></div></div>
<div id="satProbe" aria-hidden="true"></div>
<div id="sheetRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
