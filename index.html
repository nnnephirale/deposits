const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';

// which bucket the current summary falls in: MINE (hand-written), or V1/V2… (AI takes).
// legacy records predate origin/version — treat them as the first AI take.
function summaryPill(rec) {
  if (!rec) return "";
  return rec.origin === "mine" ? "MINE" : "V" + (rec.version || 1);
}

// the hand-write invite only wakes at the week's own sunday 10:00 (local time) — a
// sunday-morning reflection ritual. (the AI path no longer waits for sunday: the wand
// shows as soon as 3 days are filled, and generates only on an explicit tap+confirm.)
function weekSummaryUnlocked(year, week) {
  const mon = mondayOfISOWeek(year, week);
  const sun = new Date(mon);
  sun.setUTCDate(mon.getUTCDate() + 6); // Mon + 6 = Sun (last day of the ISO week)
  const unlockAt = new Date(sun.getUTCFullYear(), sun.getUTCMonth(), sun.getUTCDate(), 10, 0, 0, 0);
  return new Date() >= unlockAt;
}

function weekSummaryBlock(list) {
  const k = weekKey(wk.year, wk.week);
  const rec = weekSummaries[k];
  const filledDays = new Set(list.map(entryDay).filter(d => d != null)).size;

  if (!rec) {
    // a requested summary is on its way — hold the pending line
    if (weekSumInFlight.has(k)) {
      const wrap = el("div", { class: "wsum" });
      wrap.appendChild(el("p", { class: "wsum-text pending" }, "Summarizing the week…"));
      return wrap;
    }
    // 3+ days filled and a key set → this week can be read back, and the chevron under the
    // period is the door to it (see syncWrappedCue). The wand that used to sit here is gone:
    // it hung over the first card's top-right corner and read as a smudge on the entry.
    if (filledDays >= 3 && apiKey) return null;
    // no reading available (no key / fewer than 3 days) → offer to hand-write one (saves as MINE),
    // but only once the week has reached its sunday 10am. before that the whole surface
    // stays dormant (no invite, no eye). suppressed when hidden too.
    if (!showWeekSummary || !weekSummaryUnlocked(wk.year, wk.week)) return null;
    const wrap = el("div", { class: "wsum" });
    wrap.appendChild(el("button", {
      class: "wsum-add",
      onclick: () => openWeekSummaryEditor(wk.year, wk.week, list)
    }, "+ write a summary"));
    return wrap;
  }

  const wrap = el("div", { class: "wsum" + (showWeekSummary ? "" : " collapsed") });
  const eye = el("button", { class: "wsum-eye", "aria-label": "Toggle week summary" });
  eye.innerHTML = showWeekSummary ? EYE_ON : EYE_OFF;
  eye.addEventListener("click", () => {
    showWeekSummary = !showWeekSummary;
    try { localStorage.setItem(SHOW_WSUM_KEY, showWeekSummary ? "1" : "0"); } catch (e) {}
    render();
  });
  wrap.appendChild(eye);

  if (showWeekSummary) {
    // the replay wand that lived here is gone too — the chevron under the period replays
    // the reveal now, so there is one door instead of two in different corners.
    const open = () => openWeekSummaryEditor(wk.year, wk.week, list);
    // every take the week has: V1…Vn then MINE. active pill opens the editor,
    // any other pill switches the week to that take (and the choice persists/syncs).
    const slots = { ...(weekSummaryVersions[k] || {}) };
    slots[summarySlot(rec)] = rec;
    const ids = Object.keys(slots).sort((a, b) =>
      ((a === "mine") - (b === "mine")) || (parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10)));
    const cur = summarySlot(rec);
    for (const id of ids) {
      const on = id === cur;
      wrap.appendChild(el("span", {
        class: "wsum-pill" + (on && ids.length > 1 ? " on" : ""),
        onclick: on ? open : () => switchWeekSummary(k, slots[id])
      }, id === "mine" ? "MINE" : id.toUpperCase()));
    }
    wrap.appendChild(el("p", { class: "wsum-text", onclick: open }, sentenceCase(rec.text)));
  }
  return wrap;
}

// bring an earlier take back: it becomes the week's current record with a fresh
// updatedAt, so the choice both survives reloads and wins last-write-wins in sync
function switchWeekSummary(k, target) {
  const cur = weekSummaries[k];
  if (cur) (weekSummaryVersions[k] = weekSummaryVersions[k] || {})[summarySlot(cur)] = cur;
  weekSummaries[k] = { ...target, updatedAt: new Date().toISOString() };
  saveWeekSummaries();
  render();
}

function openWeekSummaryEditor(year, week, list) {
  const k = weekKey(year, week);
  sheetRoot.innerHTML = "";
  const overlay = el("div", { class: "overlay", onclick: () => sheetRoot.innerHTML = "" });
  const sheet = el("div", { class: "sheet", onclick: e => e.stopPropagation() });
  overlay.appendChild(sheet);

  sheet.appendChild(el("div", { class: "grabber" }));
  const pill = el("span", { class: "wsum-pill", style: { cursor: "default", margin: "0" } });
  const refreshPill = () => {
    const p = summaryPill(weekSummaries[k]);
    pill.textContent = p;
    pill.style.display = p ? "inline-block" : "none";
  };
  const saveBtn = el("button", {
    class: "save",
    onclick: () => {
      const v = ta.value.trim();
      if (v) {
        const prev = weekSummaries[k];
        const nowIso = new Date().toISOString();
        // editing an existing take keeps its bucket (V1 stays V1); a fresh write is MINE
        weekSummaries[k] = prev
          ? { ...prev, text: v, edited: true, updatedAt: nowIso }
          : { text: v, createdAt: nowIso, updatedAt: nowIso, edited: true, origin: "mine" };
      } else {
        tombstoneSummary(k);     // sync the clear, not just locally
        delete weekSummaries[k]; // cleared = forget it; a fresh one generates on next render
        delete weekSummaryVersions[k]; // start over means the back-catalogue goes too
        saveWeekSummaryVersions();
      }
      saveWeekSummaries();
      sheetRoot.innerHTML = "";
      render();
    }
  }, "Save");
  sheet.appendChild(el("div", { class: "sheet-head" },
    pill, el("span", { class: "title" }, "Week summary"), saveBtn));

  const ta = el("textarea", { rows: "5", placeholder: "this week, in your words…" });
  ta.value = sentenceCase((weekSummaries[k] || {}).text || "");
  sheet.appendChild(ta);
  refreshPill();

  if (apiKey) {
    const resum = el("button", {
      class: "lock-btn",
      onclick: async () => {
        resum.disabled = true;
        resum.textContent = "summarizing…";
        await generateWeekSummary(year, week, list); // increments the version off the prior take
        resum.disabled = false;
        resum.textContent = "re-summarize";
        // a fresh take isn't just a new line — replay it Wrapped-style, the same reveal the
        // week's first reading gets. close the editor first so the deck isn't behind it.
        if (weekSummaries[k]) {
          sheetRoot.innerHTML = "";
          render();
          setTimeout(() => openWeekReveal(year, week, list), 80); // let the render settle first
        }
      }
    }, "re-summarize");
    sheet.appendChild(resum);
  }

  // explicit authorship: plain Save keeps the current take's provenance (a light edit of
  // V3 stays V3), so claiming a hand-written take is its own deliberate action. archives
  // the current AI take into the pill row and makes a distinct MINE the current one.
  const curRec = weekSummaries[k];
  if (curRec && curRec.origin !== "mine") {
    sheet.appendChild(el("button", {
      class: "lock-btn",
      onclick: () => {
        const v = ta.value.trim();
        if (!v) return;
        const nowIso = new Date().toISOString();
        (weekSummaryVersions[k] = weekSummaryVersions[k] || {})[summarySlot(curRec)] = curRec; // keep the AI take
        weekSummaries[k] = { text: v, createdAt: nowIso, updatedAt: nowIso, edited: true, origin: "mine" };
        saveWeekSummaries();
        sheetRoot.innerHTML = "";
        render();
      }
    }, "save as my own"));
  }

  sheetRoot.appendChild(overlay);
}

// ---------- monthly recap: the month, read back ----------
// one sonnet call reads the whole month and returns observation cards, each citing
// the entry ids it grew from. cards that can't cite don't survive — the app drops
// them before she ever sees one. verdicts (keep / let it go) are stored and fed to
// the next month's reading, so the AI learns what rings true. device-local for now
// (a recap is regenerable, so losing it costs one api call, not data).
const RECAP_KEY = "weekly-deposits-month-recaps";
const RECAP_MIN_ENTRIES = 5;
let monthRecaps = {};
try { monthRecaps = JSON.parse(localStorage.getItem(RECAP_KEY)) || {}; } catch (e) {}
// a month now holds TAKES (V1, V2… like the weekly pills) — normalize any recap
// saved under the original flat single-take shape
for (const [mk_, r_] of Object.entries(monthRecaps)) {
  if (r_ && r_.cards) monthRecaps[mk_] = {
    cur: 0,
    takes: [{ version: 1, cards: r_.cards, title: r_.title, verdicts: r_.verdicts || {}, createdAt: r_.createdAt }]
  };
}
function saveMonthRecaps() {
  try { localStorage.setItem(RECAP_KEY, JSON.stringify(monthRecaps)); } catch (e) {}
}
function currentRecapTake(rec) { return (rec && rec.takes && rec.takes[rec.cur]) || null; }
function monthKey(year, month) { return year + "-M" + pad2(month + 1); }
function monthNameOf(year, month) {
  return new Date(year, month, 1).toLocaleDateString("en-SG", { month: "long" });
}

// loading verbs, claude-code style — one at random while the month is being read
const LOADING_VERBS = ["Accomplishing","Actioning","Actualizing","Architecting","Baking","Beaming","Beboppin'","Befuddling","Billowing","Blanching","Bloviating","Boogieing","Boondoggling","Booping","Bootstrapping","Brewing","Burrowing","Calculating","Canoodling","Caramelizing","Cascading","Catapulting","Cerebrating","Channelling","Choreographing","Churning","Clauding","Coalescing","Cogitating","Composing","Computing","Concocting","Considering","Contemplating","Cooking","Crafting","Creating","Crystallizing","Cultivating","Crunching","Deciphering","Deliberating","Dilly-dallying","Discombobulating","Doodling","Drizzling","Ebbing","Effecting","Elucidating","Embellishing","Enchanting","Envisioning","Evaporating","Fermenting","Fiddle-faddling","Finagling","Flambéing","Flibbertigibbeting","Flowing","Flummoxing","Fluttering","Forging","Forming","Frosting","Frolicking","Gallivanting","Galloping","Garnishing","Generating","Germinating","Gitifying","Grooving","Gusting","Harmonizing","Hashing","Hatching","Herding","Hibernating","Honking","Hullaballooing","Hyperspacing","Ideating","Imagining","Improvising","Incubating","Inferring","Infusing","Ionizing","Jitterbugging","Julienning","Kneading","Leavening","Levitating","Lollygagging","Manifesting","Marinating","Meandering","Metamorphosing","Misting","Moonwalking","Moseying","Mulling","Mustering","Musing","Nebulizing","Nesting","Noodling","Nucleating","Orbiting","Orchestrating","Osmosing","Perambulating","Percolating","Perusing","Philosophising","Photosynthesizing","Pollinating","Pontificating","Pondering","Pouncing","Precipitating","Prestidigitating","Processing","Proofing","Propagating","Puttering","Puzzling","Quantumizing","Razzle-dazzling","Razzmatazzing","Recombobulating","Reticulating","Roosting","Ruminating","Sautéing","Scampering","Scheming","Schlepping","Scurrying","Seasoning","Shenaniganing","Shimmying","Simmering","Skedaddling","Sketching","Slithering","Smooshing","Sock-hopping","Spelunking","Spinning","Sprouting","Stewing","Sublimating","Sussing","Swirling","Swooping","Symbioting","Synthesizing","Tempering","Thinking","Thundering","Tinkering","Tomfoolering","Topsy-turvying","Transfiguring","Transmuting","Twisting","Undulating","Unfurling","Unravelling","Vibing","Waddling","Wandering","Warping","Whatchamacalliting","Whirlpooling","Whirring","Whisking","Wibbling","Working","Wrangling","Zesting","Zigzagging"];

// strict schema — the api guarantees the reply parses; grounding is still checked app-side
const RECAP_SCHEMA = {
  type: "object",
  properties: {
    cards: {
      type: "array",
      items: {
        type: "object",
        properties: {
          headline: { type: "string" },
          support: { type: "string" },
          evidence: { type: "array", items: { type: "string" } },
          earned: { type: "boolean" }
        },
        required: ["headline", "support", "evidence", "earned"],
        additionalProperties: false
      }
    },
    title: { type: "string" }
  },
  required: ["cards", "title"],
  additionalProperties: false
};

const RECAP_SYSTEM = "You are reading one month of Marilyn's personal journal entries to write her monthly recap: a handful of observations that show her the month's patterns — things she might not have noticed herself. Rules: 3 to 8 cards; a thin or scattered month earns fewer, and when no single thread runs through the month it is fine for the cards to be small specific moments instead of themes. Every card must be grounded in specific entries and cite 1-4 of their ids in evidence — an observation you cannot cite must not be written. headline is one short sentence, an observation rather than a statistic. support is 1-3 short lines expanding it; borrowing her own words is good. earned is true on at most 2 cards that deserve a moment of weight — a real shift, a milestone, something worth sitting with — and false on everything else. title is what the month would be called if it had a title: a short phrase (2-6 words) only this month could produce, defensible from the entries. Voice: plain, concrete, warm but dry, written in sentence case with normal capitalization. Never use: quietly, gently, softly, simply, truly, journey, chapter, embrace, whirlwind. No exclamation marks, no horoscope vagueness — name the actual things. When her past reactions are provided (kept, let go, rewrote, notes), her rewordings and notes are the standard to write toward — never repeat an observation she let go or rewrote.";

// one line per card she reacted to — verdicts, rewrites, and notes teach the next reading
function recapTakeLines(take, onlyReacted) {
  const out = [];
  (take.cards || []).forEach((cd, i) => {
    const v = (take.verdicts || {})[i];
    if (onlyReacted && !v && !cd.original && !cd.feedback) return;
    let line = cd.original
      ? '- "' + cd.original.headline + '" — she rewrote it to: "' + cd.headline + '"'
      : '- "' + cd.headline + '"';
    const notes = [];
    if (v === "keep") notes.push("kept");
    if (v === "letgo") notes.push("let go — this one missed");
    if (cd.feedback) notes.push("her note: " + cd.feedback);
    if (notes.length) line += " (" + notes.join("; ") + ")";
    out.push(line);
  });
  return out;
}

const recapInFlight = new Set();
async function startMonthRecap(year, month) {
  const k = monthKey(year, month);
  if (!apiKey || recapInFlight.has(k)) return;
  recapInFlight.add(k);
  if (view === "month") render(); // the "reading…" line appears
  try {
    const list = entriesForMonth(year, month);
    const lines = list.map(e => {
      const labels = e.tags.map(tg => (topicById[tg] || modeById[tg] || {}).label).filter(Boolean).join(", ");
      const when = e.week == null ? "month-wide"
        : (entryDay(e) != null && entryDateStr(e)) ? entryDateStr(e) : "W" + pad2(e.week);
      return e.id + " | " + when + " | " + (labels || "untagged") + " | " + plainText(e.text, "[…]");
    });
    // her hand-written week summaries are the purest voice reference available
    const mine = Object.values(weekSummaries)
      .filter(r => r.origin === "mine" && r.text).slice(-5).map(r => "- " + r.text);
    // her reactions teach the reading: last month's take, and — on a re-read —
    // every earlier take of this same month
    const pm = month === 0 ? { year: year - 1, month: 11 } : { year, month: month - 1 };
    const prevTake = currentRecapTake(monthRecaps[monthKey(pm.year, pm.month)]);
    let feedback = "";
    if (prevTake) {
      const pl = recapTakeLines(prevTake, true);
      if (pl.length) feedback += "\n\nLAST MONTH'S READING — HER REACTIONS:\n" + pl.join("\n");
    }
    const thisRec = monthRecaps[k];
    if (thisRec && thisRec.takes.length) {
      feedback += "\n\nTHIS IS A RE-READ. EARLIER READINGS OF THIS SAME MONTH:";
      thisRec.takes.forEach(t => {
        feedback += "\nV" + t.version + ":\n" + recapTakeLines(t, false).join("\n");
      });
      feedback += "\nWrite a genuinely fresh take — different angles, not the same cards reworded.";
    }
    const input = "THE MONTH: " + monthNameOf(year, month) + " " + year
      + "\n\nENTRIES (id | when | topics | text):\n" + lines.join("\n")
      + (mine.length ? "\n\nHER OWN WORDS, FOR VOICE (week summaries she wrote herself):\n" + mine.join("\n") : "")
      + feedback;

    const parsed = await anthropicJSON({
      model: "claude-sonnet-5", // reads a month better than haiku; one call a month, a few cents
      max_tokens: 6000, // headroom: sonnet 5 thinks before writing, and thinking counts against this
      output_config: { format: { type: "json_schema", schema: RECAP_SCHEMA } },
      system: RECAP_SYSTEM,
      messages: [{ role: "user", content: input }]
    });

    // grounding pass: evidence ids must resolve to real entries; snapshots of her words
    // are stored on the card so a later edit/delete never breaks a saved recap
    const byId = new Map(list.map(e => [e.id, e]));
    const cards = (parsed.cards || []).map(cd => ({
      headline: String(cd.headline || "").trim(),
      support: String(cd.support || "").trim(),
      earned: !!cd.earned,
      evidence: [...new Set(cd.evidence || [])].map(id => byId.get(id)).filter(Boolean)
        .map(e => ({ id: e.id, text: truncateWords(plainText(e.text, "▓▓▓"), 28) }))
    })).filter(cd => cd.headline && cd.evidence.length); // can't cite it → she never sees it
    let earnedCount = 0; // spectacle budget enforced here, not left to the model's enthusiasm
    for (const cd of cards) if (cd.earned && ++earnedCount > 2) cd.earned = false;
    if (!cards.length) throw new Error("no grounded cards");

    // a new reading never replaces an old one — it lands as the next take (V2, V3…)
    const rec = monthRecaps[k];
    const version = rec ? Math.max(...rec.takes.map(t => t.version || 1)) + 1 : 1;
    const take = { version, cards, title: String(parsed.title || "").trim(), createdAt: new Date().toISOString(), verdicts: {} };
    if (rec) { rec.takes.push(take); rec.cur = rec.takes.length - 1; }
    else monthRecaps[k] = { cur: 0, takes: [take] };
    saveMonthRecaps();
    if (view === "month" && mo.year === year && mo.month === month) openRecap(year, month);
  } catch (err) {
    console.warn("month recap failed", err); // wand returns on re-render; tap to retry
  } finally {
    recapInFlight.delete(k);
    if (view === "month" && mo.year === year && mo.month === month) render();
  }
}

// month view: nothing but the "still reading…" line while one is being written. The control
// itself moved out to the chevron under the period — see syncWrappedCue.
function monthRecapBlock(list) {
  const k = monthKey(mo.year, mo.month);
  if (recapInFlight.has(k)) {
    // claude-code style: a random loading verb, swapped every couple of seconds
    const wrap = el("div", { class: "wsum" });
    const p = el("p", { class: "wsum-text pending" });
    const tick = () => { p.textContent = LOADING_VERBS[Math.floor(Math.random() * LOADING_VERBS.length)] + "…"; };
    tick();
    const t = setInterval(() => { if (!p.isConnected) { clearInterval(t); return; } tick(); }, 2200);
    wrap.appendChild(p);
    return wrap;
  }
  // the month's wand lived here; the chevron under the period is the door now. Nothing
  // else in this block was ever visible, so in the settled case it renders nothing at all.
  return null;
}

// A reveal's body type steps down with its length, so a rambling summary still lands on one
// screen instead of running off both edges. Keyed off the available height as well as the
// character count — the same 900-character summary is a wall on a phone and comfortable in a
// desktop window. Bounded at both ends: never bigger than the 27px the short ones were tuned
// at, never below 15px, where the serif stops being a voice and starts being fine print.
function revealTextSize(text) {
  const chars = (text || "").length;
  if (!chars) return "27px";
  const w = Math.min(460, window.innerWidth - 60);      // .recap-card's real measure
  // the stage minus its own padding — and the status bar, which innerHeight now includes
  const room = Math.max(360, window.innerHeight - safeTop() - 190);
  // this serif averages ~0.5em a character and .recap-head sets 1.22 line-height, so
  //   height ≈ (chars · 0.5f / w) · 1.22f   →   f = √(w · room / (0.61 · chars))
  const fit = Math.sqrt((w * room) / (0.61 * chars));
  return Math.round(Math.max(15, Math.min(27, fit))) + "px";
}

// ---------- the story deck ----------
// the chrome both reveals share: blobs/veil/grain, the dash progress row with its label and
// close ×, the stage, and the stories tap grammar (left 22% steps back, anywhere else
// forward). the caller owns what a card looks like and what its timers are.
//   opts: { rootClass, blobs, label, total, buildCard(i), stopTimers(), tapGuard() }
// tapGuard returns true to swallow a tap (a long-press that opened an editor, a count-up
// that a tap should settle instead of advancing). the deck is NOT shown until show(0).
function storyDeck(opts) {
  const root = el("div", { class: opts.rootClass });
  for (let i = 1; i <= opts.blobs; i++) root.appendChild(el("div", { class: "recap-blob b" + i }));
  root.appendChild(el("div", { class: "recap-veil" }));
  root.appendChild(el("div", { class: "recap-grain" }));

  const dashes = el("div", { class: "recap-dashes" });
  for (let i = 0; i < opts.total; i++) dashes.appendChild(el("span"));
  root.appendChild(el("div", { class: "recap-top" },
    el("span", { class: "recap-month" }, opts.label),
    dashes,
    el("button", { class: "recap-x", "aria-label": "Close", onclick: ev => { ev.stopPropagation(); close(); } }, "×")
  ));

  const stage = el("div", { class: "recap-stage" });
  root.appendChild(stage);

  let idx = 0, card = null;
  const stopTimers = () => { if (opts.stopTimers) opts.stopTimers(); };

  function close() { stopTimers(); root.remove(); unlockPageScroll(); }
  function setDashes() { Array.from(dashes.children).forEach((d, i) => d.classList.toggle("on", i <= idx)); }
  function show(i) {
    idx = Math.max(0, Math.min(opts.total - 1, i));
    setDashes();
    stopTimers();
    root.classList.remove("lit");
    if (card) {
      const old = card;
      old.classList.add("out"); // recedes while the next one arrives — nothing teleports
      setTimeout(() => old.remove(), 380);
    }
    card = opts.buildCard(idx);
    stage.appendChild(card);
  }

  // now that the stage scrolls, a swipe to read a long card must not also turn the page.
  // Same 4px rule the photo row already uses: past that it was a drag, not a tap.
  // the scrim under the top row is only earned once something is actually behind it
  stage.addEventListener("scroll", () => root.classList.toggle("scrolled", stage.scrollTop > 8),
    { passive: true });
  let tapX = 0, tapY = 0, tapDrag = false;
  stage.addEventListener("pointerdown", ev => { tapX = ev.clientX; tapY = ev.clientY; tapDrag = false; });
  stage.addEventListener("pointermove", ev => {
    if (Math.abs(ev.clientY - tapY) > 4 || Math.abs(ev.clientX - tapX) > 4) tapDrag = true;
  });
  stage.addEventListener("click", ev => {
    if (tapDrag) { tapDrag = false; return; }
    if (opts.tapGuard && opts.tapGuard()) return;
    const r = stage.getBoundingClientRect();
    if (ev.clientX - r.left < r.width * 0.22) { if (idx > 0) show(idx - 1); }
    else if (idx < opts.total - 1) show(idx + 1);
  });

  const deck = { root, stage, show, close, get idx() { return idx; } };
  // motes drifting off a card. the month bursts, the week whispers — same emitter,
  // different dose. anchor is resolved by the caller so each keeps its own fallback.
  deck.dust = (anchor, { count, dx, dyMin, dyVar, minH = 0 }) => {
    const r = anchor.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const d = el("span", { class: "recap-dust" });
      d.style.left = (r.left + Math.random() * r.width) + "px";
      d.style.top = (r.top + Math.random() * Math.max(minH, r.height)) + "px";
      d.style.setProperty("--dx", (Math.random() * dx * 2 - dx) + "px");
      d.style.setProperty("--dy", (dyMin - Math.random() * dyVar) + "px");
      d.style.animationDelay = (Math.random() * 0.5) + "s";
      root.appendChild(d);
      setTimeout(() => d.remove(), 2700);
    }
  };
  return deck;
}

// ---------- the reveal itself ----------
function openRecap(year, month) {
  const k = monthKey(year, month);
  const rec = monthRecaps[k];
  const take = currentRecapTake(rec); // the deck shows the current take (V1, V2…)
  if (!take || !take.cards || !take.cards.length) return;
  take.verdicts = take.verdicts || {};
  const monthName = monthNameOf(year, month);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  lockPageScroll();
  const total = take.cards.length + 3; // intro + cards + title + end
  let titleTimer = null, editHeld = false;
  const deck = storyDeck({
    rootClass: "recap", blobs: 3, label: monthName + " " + year, total,
    buildCard: i => buildCard(i),
    stopTimers: () => clearInterval(titleTimer),
    tapGuard: () => { // the tap that ended a long-press isn't a step
      if (!editHeld) return false;
      editHeld = false;
      return true;
    }
  });
  const { root, stage, show, close } = deck;
  stage.addEventListener("contextmenu", ev => ev.preventDefault()); // long-press belongs to the editor, not iOS

  function dustBurst(c) {
    const head = c.querySelector(".recap-head");
    if (!head) return;
    deck.dust(head, { count: 14, dx: 30, dyMin: -30, dyVar: 50 });
  }

  // long-press an observation card to reword it — with a field for telling claude
  // what didn't land. rewrites keep the original for teaching, notes feed the next reading.
  function holdToEdit(node, ci) {
    let t = null;
    node.addEventListener("pointerdown", () => {
      clearTimeout(t);
      t = setTimeout(() => { editHeld = true; openCardEditor(ci); }, 500);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(evt =>
      node.addEventListener(evt, () => clearTimeout(t)));
  }
  function openCardEditor(ci) {
    const cd = take.cards[ci];
    const ov = el("div", { class: "overlay", style: { zIndex: "80" }, onclick: () => ov.remove() });
    const sheet = el("div", { class: "sheet", onclick: ev => ev.stopPropagation() });
    ov.appendChild(sheet);
    sheet.appendChild(el("div", { class: "grabber" }));
    sheet.appendChild(el("div", { class: "sheet-head" },
      el("span"),
      el("span", { class: "title" }, "Edit card"),
      el("button", {
        class: "save",
        onclick: () => {
          const h = taH.value.trim(), s = taS.value.trim(), f = taF.value.trim();
          if (h && (h !== cd.headline || s !== (cd.support || ""))) {
            cd.original = cd.original || { headline: cd.headline, support: cd.support }; // the AI's take, kept for teaching
            cd.headline = h;
            cd.support = s;
            cd.edited = true;
          }
          if (f) cd.feedback = f; else delete cd.feedback;
          saveMonthRecaps();
          ov.remove();
          show(deck.idx); // re-render the card in her wording
        }
      }, "Save")));
    sheet.appendChild(el("p", { class: "field-label", style: { marginTop: "6px" } }, "the observation"));
    const taH = el("textarea", { rows: "2", style: { minHeight: "56px" } });
    taH.value = cd.headline;
    sheet.appendChild(taH);
    sheet.appendChild(el("p", { class: "field-label" }, "supporting lines"));
    const taS = el("textarea", { rows: "3", style: { minHeight: "72px" } });
    taS.value = cd.support || "";
    sheet.appendChild(taS);
    sheet.appendChild(el("p", { class: "field-label" }, "tell claude"));
    const taF = el("textarea", { rows: "3", style: { minHeight: "72px" }, placeholder: "what didn't land about the original? this note teaches the next reading…" });
    taF.value = cd.feedback || "";
    sheet.appendChild(taF);
    if (cd.original) sheet.appendChild(el("p", { class: "settings-note" }, "originally: " + cd.original.headline));
    root.appendChild(ov);
  }

  function buildCard(i) {
    const c = el("div", { class: "recap-card" });
    if (i === 0) {
      // intro: nothing arrives immediately
      c.appendChild(el("p", { class: "recap-head", style: { fontSize: "44px" } }, monthName + ","));
      c.appendChild(el("p", { class: "recap-sub" }, "read back."));
      c.appendChild(el("p", { class: "recap-meta recap-ev-btn", style: { cursor: "pointer" } }, "tap to begin"));
    } else if (i <= take.cards.length) {
      const cd = take.cards[i - 1], ci = i - 1;
      holdToEdit(c, ci); // long-press = reword + tell claude why
      c.appendChild(el("p", { class: "recap-head" }, cd.headline));
      if (cd.support) c.appendChild(el("p", { class: "recap-sub" }, cd.support));
      const meta = el("div", { class: "recap-meta" });
      // progressive disclosure: the receipts unfold only when asked for
      const evWrap = el("div", { class: "recap-ev", style: { display: "none" } });
      cd.evidence.forEach(sv => evWrap.appendChild(el("p", null, sv.text + "…")));
      meta.appendChild(el("button", {
        class: "recap-ev-btn",
        onclick: ev => {
          ev.stopPropagation();
          evWrap.style.display = evWrap.style.display === "none" ? "" : "none";
        }
      }, "from your words"));
      meta.appendChild(evWrap);
      const verdicts = el("div", { class: "recap-verdicts" });
      [["keep", "keep"], ["letgo", "let it go"]].forEach(([id, label]) => {
        verdicts.appendChild(el("button", {
          class: take.verdicts[ci] === id ? "on" : "",
          onclick: ev => {
            ev.stopPropagation();
            if (take.verdicts[ci] === id) delete take.verdicts[ci]; // tap again = undecided
            else take.verdicts[ci] = id;
            saveMonthRecaps();
            Array.from(verdicts.children).forEach((b, j) =>
              b.classList.toggle("on", take.verdicts[ci] === (j === 0 ? "keep" : "letgo")));
          }
        }, label));
      });
      meta.appendChild(verdicts);
      c.appendChild(meta);
      if (cd.earned) {
        // one second of silence first — then the world brightens and dust catches the light
        setTimeout(() => {
          if (!c.isConnected) return;
          root.classList.add("lit");
          if (!reduceMotion) dustBurst(c);
        }, 1000);
      }
    } else if (i === take.cards.length + 1 && take.title) {
      c.appendChild(el("p", { class: "recap-sub", style: { margin: "0 0 14px" } }, "If " + monthName + " had a title…"));
      const t = el("p", { class: "recap-head" }, " ");
      c.appendChild(t);
      if (reduceMotion) t.textContent = take.title;
      else {
        // a beat of silence, then the title types itself out. clearInterval works on
        // timeout ids too, so show()/close() cancel whichever phase is live; the
        // isConnected guard covers a card swapped out mid-race.
        let pos = 0;
        titleTimer = setTimeout(() => {
          titleTimer = setInterval(() => {
            if (!t.isConnected) { clearInterval(titleTimer); return; }
            pos++;
            t.textContent = take.title.slice(0, pos);
            if (pos >= take.title.length) clearInterval(titleTimer);
          }, 60);
        }, 900);
      }
    } else if (i === take.cards.length + 1) {
      // no title came back — jump the pacing straight to the end card's content
      return buildCard(i + 1);
    } else {
      const kept = Object.values(take.verdicts).filter(v => v === "keep").length;
      c.appendChild(el("p", { class: "recap-head" }, "That's " + monthName + "."));
      c.appendChild(el("p", { class: "recap-sub" },
        take.cards.length + " observations" + (kept ? " · " + kept + " kept" : "")
        + "\nWhat you keep, let go, and reword shapes the next reading."));
      const meta = el("div", { class: "recap-meta" });
      if (rec.takes.length > 1) {
        // every take the month has had, like the weekly V1/V2 pills — tap to revisit one
        const pills = el("div", { style: { marginBottom: "14px" } });
        rec.takes.forEach((t, ti) => {
          pills.appendChild(el("span", {
            class: "wsum-pill" + (ti === rec.cur ? " on" : ""),
            onclick: ev => {
              ev.stopPropagation();
              if (ti === rec.cur) return;
              rec.cur = ti; // the choice persists — the wand replays this take from now on
              saveMonthRecaps();
              close();
              openRecap(year, month);
            }
          }, "V" + (t.version || ti + 1)));
        });
        meta.appendChild(pills);
      }
      meta.appendChild(el("button", { class: "recap-ev-btn", style: { marginBottom: "8px" }, onclick: ev => { ev.stopPropagation(); close(); } }, "done"));
      meta.appendChild(el("button", {
        class: "recap-ev-btn",
        onclick: ev => {
          ev.stopPropagation();
          close();
          startMonthRecap(year, month); // arrives as the next take — this one stays in the pills
        }
      }, "read it again, fresh"));
      c.appendChild(meta);
    }
    return c;
  }

  document.body.appendChild(root);
  show(0);
}

// ---------- the weekly reveal: openRecap's lighter sibling ----------
// a first reading of the week arrives here — four slow breaths, then it collapses to the
// quiet wsum line. same stories grammar (tap forward, tap the left edge to step back),
// fewer panels than the month, one crescendo, and no keep/let-go verdicts.
function openWeekReveal(year, week, list, take) {
  const k = weekKey(year, week);
  // `take` lets you replay the reading behind a specific version (V1/V2/V3/MINE)
  // without touching which one is current — default is the week's current take.
  const rec = take || weekSummaries[k];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const range = weekRangeLabel(year, week);

  // days touched (0–6) and the week's top topics — all from the entries, no new AI
  const filled = new Set(list.map(entryDay).filter(d => d != null));
  const tally = {};
  list.forEach(e => (e.tags || []).forEach(tg => { if (topicById[tg]) tally[tg] = (tally[tg] || 0) + 1; }));
  const topTopics = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => topicById[id]);

  // the plan — a thin week earns fewer cards
  const panels = ["cover", "shape"];
  if (topTopics.length >= 2) panels.push("topics");
  if (rec && rec.text) panels.push("summary");
  panels.push("still");
  const total = panels.length;

  lockPageScroll();
  let timer = null, raf = null, snap = null;
  function stopTimers() { clearTimeout(timer); clearInterval(timer); cancelAnimationFrame(raf); snap = null; }
  const deck = storyDeck({
    rootClass: "recap week", blobs: 2, label: "W" + pad2(week) + " · " + range, total,
    buildCard: i => buildCard(i),
    stopTimers,
    tapGuard: () => { // a tap mid count-up settles it instead of stepping on
      if (!snap) return false;
      snap(); // settle() clears snap itself
      return true;
    }
  });
  const { root, stage, show, close } = deck;

  // half the monthly's dust — the week earns a whisper, not the full burst
  function dustWhisper(c) {
    deck.dust(c.querySelector(".recap-head") || c, { count: 5, dx: 20, dyMin: -24, dyVar: 36, minH: 24 });
  }

  function buildCard(i) {
    const kind = panels[i];
    const c = el("div", { class: "recap-card" });

    if (kind === "cover") {
      c.appendChild(el("p", { class: "recap-head", style: { fontSize: "64px" } }, "W" + pad2(week)));
      c.appendChild(el("p", { class: "recap-sub" }, range));
      c.appendChild(el("p", { class: "recap-meta recap-ev-btn", style: { cursor: "pointer" } }, "tap to look back"));

    } else if (kind === "shape") {
      const num = el("p", { class: "wk-count" }, reduceMotion ? String(list.length) : "0");
      c.appendChild(num);
      c.appendChild(el("p", { class: "wk-count-label" }, list.length === 1 ? "deposit" : "deposits"));
      const days = el("div", { class: "wk-days" });
      DAY_TOKENS.forEach(tok => days.appendChild(el("span", null, tok)));
      c.appendChild(days);
      c.appendChild(el("p", { class: "wk-count-label", style: { marginTop: "18px", opacity: "0.85" } },
        filled.size + (filled.size === 1 ? " day" : " days") + " touched"));

      const order = DAY_TOKENS.map((_, di) => di).filter(di => filled.has(di));
      function lightDays() {
        let n = 0;
        (function step() {
          if (!days.isConnected || n >= order.length) return;
          days.children[order[n]].classList.add("on");
          n++;
          timer = setTimeout(step, 110);
        })();
      }
      if (reduceMotion) {
        order.forEach(di => days.children[di].classList.add("on"));
      } else {
        // numbers arriving, not spinning — ease-out expo, then the days light left→right
        const target = list.length, dur = 850, t0 = performance.now();
        const settle = () => { cancelAnimationFrame(raf); num.textContent = String(target); snap = null; lightDays(); };
        (function tick(now) {
          const p = Math.min(1, ((now || t0) - t0) / dur);
          num.textContent = String(Math.round((1 - Math.pow(2, -10 * p)) * target));
          if (p < 1) raf = requestAnimationFrame(tick); else settle();
        })(t0);
        snap = settle; // a tap mid count-up settles it instead of advancing
      }

    } else if (kind === "topics") {
      c.appendChild(el("p", { class: "recap-sub", style: { margin: "0 0 6px" } }, "you kept coming back to…"));
      const chips = el("div", { class: "wk-chips" });
      topTopics.forEach((t, ti) => {
        const chip = el("span", { class: "wk-chip" + (ti === 0 ? " lead" : ""),
          style: { background: t.bg, color: t.fg } }, t.label);
        chip.style.animationDelay = (0.15 + ti * 0.12) + "s";
        chips.appendChild(chip);
      });
      c.appendChild(chips);

    } else if (kind === "summary") {
      // 27px was tuned against a 2-3 sentence summary. A long one at that size overflowed
      // the screen in both directions; the stage scrolls now, but a reading you have to
      // scroll through isn't a reading. Step the size down so most summaries still land
      // whole, and let scrolling be the safety net rather than the reading experience.
      c.appendChild(el("p", { class: "recap-head", style: { fontSize: revealTextSize(rec.text) } },
        sentenceCase(rec.text)));
      // the one and only crescendo — a beat after the words settle, the world brightens
      timer = setTimeout(() => {
        if (!c.isConnected) return;
        root.classList.add("lit");
        if (!reduceMotion) dustWhisper(c);
      }, 750);

    } else { // still — the keepable final frame
      const still = el("div", { class: "wk-still" });
      still.appendChild(el("p", { class: "wk-still-num" }, "W" + pad2(week)));
      still.appendChild(el("p", { class: "wk-still-range" }, range));
      still.appendChild(el("p", { class: "wk-still-stat" },
        list.length + (list.length === 1 ? " deposit" : " deposits") + " · "
        + filled.size + (filled.size === 1 ? " day" : " days")));
      if (topTopics.length) {
        const dots = el("div", { class: "wk-still-dots" });
        topTopics.forEach(t => { const d = el("i"); d.style.background = t.dot; dots.appendChild(d); });
        still.appendChild(dots);
      }
      if (rec && rec.text) {
        const first = sentenceCase(rec.text).split(/(?<=[.!?])\s+/)[0];
        still.appendChild(el("p", { class: "wk-still-line" }, first));
      }
      c.appendChild(still);

      const meta = el("div", { class: "recap-meta" });
      // every take the week holds — tap another to replay it (mirrors the wsum pill row)
      const slots = { ...(weekSummaryVersions[k] || {}) };
      if (rec) slots[summarySlot(rec)] = rec;
      const ids = Object.keys(slots).sort((a, b) =>
        ((a === "mine") - (b === "mine")) || (parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10)));
      if (ids.length > 1) {
        // each take's own reading — tap to replay the reveal for that version. purely a
        // viewing switch: the week's current take (and the whole back-catalogue) is untouched.
        const pills = el("div", { style: { marginBottom: "14px" } });
        ids.forEach(id => {
          const on = rec && id === summarySlot(rec);
          pills.appendChild(el("span", {
            class: "wsum-pill" + (on ? " on" : ""),
            onclick: ev => {
              ev.stopPropagation();
              if (on) return;
              close();
              openWeekReveal(year, week, list, slots[id]);
            }
          }, id === "mine" ? "MINE" : id.toUpperCase()));
        });
        meta.appendChild(pills);
      }
      meta.appendChild(el("button", { class: "recap-ev-btn", style: { marginBottom: "8px" },
        onclick: ev => { ev.stopPropagation(); close(); } }, "done"));
      if (apiKey) meta.appendChild(el("button", {
        class: "recap-ev-btn",
        onclick: async ev => {
          ev.stopPropagation();
          close();
          await generateWeekSummary(year, week, list); // arrives as the next take
          openWeekReveal(year, week, list);
        }
      }, "read it again, fresh"));
      c.appendChild(meta);
    }
    return c;
  }

  document.body.appendChild(root);
  show(0);
}

// ---------- search ----------
// flatten raw text into display segments: bold flagged (for the highlight rule),
// redacted content replaced with a mask so search results can never unveil it
function segmentText(raw) {
  const segs = [];
  let last = 0, m;
  RICH_RE.lastIndex = 0;
  while ((m = RICH_RE.exec(raw))) {
    if (m.index > last) segs.push({ t: raw.slice(last, m.index) });
    if (m[1] != null) segs.push({ t: m[1] });                     // link: show its label as plain text
    else if (m[3] != null) segs.push({ t: m[3], bold: true });
    else if (m[7] != null) segs.push({ t: "▓▓▓", redacted: true });
    else if (m[8] != null) segs.push({ t: "" });                  // image: nothing to show in a text snippet
    else segs.push({ t: m[4] != null ? m[4] : (m[5] != null ? m[5] : m[6]) }); // italic/underline/mono: plain in snippets
    last = m.index + m[0].length;
  }
  if (last < raw.length) segs.push({ t: raw.slice(last) });
  return segs;
}

// truncated snippet centred on the first match; every match in the window is
// bolded — or underlined when it sits inside already-bold text
function searchResultEl(e, q) {
  const segs = segmentText(e.text);
  const disp = segs.map(s => s.t).join("");
  const lower = disp.toLowerCase();
  const ranges = [];
  if (q) {
    let idx = 0;
    while ((idx = lower.indexOf(q, idx)) !== -1) { ranges.push([idx, idx + q.length]); idx += q.length; }
  }
  const first = ranges.length ? ranges[0][0] : 0;
  let start = Math.max(0, first - 34);
  if (start > 0) {
    const sp = disp.indexOf(" ", start);
    if (sp !== -1 && sp < first) start = sp + 1; // snap to a word boundary
  }
  const end = Math.min(disp.length, start + 120);

  const p = el("p", { class: "search-snippet" });
  if (start > 0) p.appendChild(document.createTextNode("…"));
  let off = 0;
  for (const s of segs) {
    const sStart = off, sEnd = off + s.t.length;
    off = sEnd;
    if (sEnd <= start || sStart >= end) continue;
    const from = Math.max(sStart, start), to = Math.min(sEnd, end);
    const emit = (a, b, hl) => {
      if (b <= a) return;
      const txt = disp.slice(a, b);
      if (hl) p.appendChild(el("span", { class: s.bold ? "rt-b hl-b" : "hl" }, txt));
      else if (s.bold) p.appendChild(el("span", { class: "rt-b" }, txt));
      else if (s.redacted) p.appendChild(el("span", { class: "snip-mask" }, txt));
      else p.appendChild(document.createTextNode(txt));
    };
    let cur = from;
    for (const [a, b] of ranges) {
      const ia = Math.max(a, cur), ib = Math.min(b, to);
      if (ib <= ia) continue;
      emit(cur, ia, false);
      emit(ia, ib, true);
      cur = ib;
    }
    emit(cur, to, false);
  }
  if (end < disp.length) p.appendChild(document.createTextNode("…"));

  const entry = el("div", { class: "entry", onclick: () => openComposer(e) });
  entry.appendChild(p);
  const meta = el("div", { class: "entry-meta" });
  const d = entryDay(e);
  const bits = [];
  if (d != null) bits.push(DAY_TOKENS[d]);
  if (e.week != null) bits.push("W" + pad2(e.week));
  else bits.push(new Date(e.year, e.month, 1).toLocaleDateString("en-SG", { month: "short" })); // month-scoped
  if (e.year !== currentWk.year) bits.push(String(e.year));
  meta.appendChild(el("span", { class: "entry-day" }, bits.join(" · ")));
  for (const tg of e.tags) {
    const tt = topicById[tg], mm = modeById[tg];
    if (tt) meta.appendChild(el("span", { class: "pill", style: { background: tt.bg, color: tt.fg } }, tt.label));
    else if (mm) meta.appendChild(el("span", { class: "pill mode" }, mm.label));
  }
  entry.appendChild(meta);
  return entry;
}

// ---------- the menu (the lozenge on the compose bar) ----------
// one centred modal for the things that used to crowd the header. search is its top row and
// its primary purpose: type and the body below morphs into matching entries. leave it empty
// and the body is the settings list — day view among them.
const SEARCH_GLYPH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>';
function openMenu() {
  lockPageScroll();
  const back = el("div", { class: "read-back" });
  const modal = el("div", { class: "menu-modal", onclick: ev => ev.stopPropagation() });

  const searchRow = el("div", { class: "menu-search" });
  searchRow.innerHTML = SEARCH_GLYPH;
  const input = el("input", { type: "search", placeholder: "search entries\u2026", autocomplete: "off" });
  searchRow.appendChild(input);
  modal.appendChild(searchRow);

  const body = el("div", { class: "menu-body" });
  modal.appendChild(body);

  const close = () => {
    back.classList.remove("show");
    document.removeEventListener("keydown", onKey);
    setTimeout(() => back.remove(), 200);
    unlockPageScroll();
  };
  const onKey = ev => { if (ev.key === "Escape") close(); };

  function row(label, state, onPick, glyph) {
    const r = el("button", { class: "menu-row" + (state ? " on" : ""), onclick: onPick });
    if (glyph) { const g = el("span"); g.innerHTML = glyph; r.appendChild(g.firstChild); }
    r.appendChild(el("span", { class: "mr-label" }, label));
    if (state) r.appendChild(el("span", { class: "mr-state" }, state));
    return r;
  }

  function renderSettings() {
    body.innerHTML = "";
    // day view's home, finally: a plain row that names its own state
    body.appendChild(row("Day view", layout === "day" ? "on" : "off", () => {
      setLayout(layout === "day" ? "topic" : "day");
      renderSettings();
    }));
    // named the same way the rail names it, so the two surfaces agree
    body.appendChild(row("Showing", oldestFirst ? "oldest" : "most recent", () => {
      setOldestFirst(!oldestFirst);
      renderSettings();
    }));
    body.appendChild(row("Export markdown", null, () => { close(); doExport(); }));
    body.appendChild(row("Settings", null, () => { close(); openSettings(); }));
  }

  function renderResults(q) {
    body.innerHTML = "";
    const hay = e => (plainText(e.text, "keep") + " " + e.tags.map(groupLabel).join(" ")).toLowerCase();
    const found = entries.filter(e => !e.segmented && hay(e).includes(q))
      .sort((a, b) => (b.year - a.year) || (weekSortKey(b) - weekSortKey(a))
        || (daySortKey(b) - daySortKey(a)) || b.createdAt.localeCompare(a.createdAt));
    body.appendChild(el("p", { class: "menu-count" }, found.length + " found"));
    if (!found.length) return;
    const card = el("div", { class: "group-card" });
    for (const e of found) {
      const r = searchResultEl(e, q);
      r.addEventListener("click", () => close(), { once: true }); // its own handler opens the composer
      card.appendChild(r);
    }
    body.appendChild(card);
  }

  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (q) renderResults(q); else renderSettings();
  });

  renderSettings();
  back.appendChild(modal);
  back.addEventListener("click", () => close());
  document.addEventListener("keydown", onKey);
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add("show"));
  setTimeout(() => back.classList.add("show"), 60); // rAF can be throttled where nothing paints
}

function openSearch() {
  sheetRoot.innerHTML = "";
  lockPageScroll();
  let q = "", scope = "all";

  // scope targets = whatever week/month is currently being browsed, so "a specific
  // week/month" = navigate there first; the chips name themselves accordingly
  const scopeWk = { year: wk.year, week: wk.week };
  const monOfWk = mondayOfISOWeek(wk.year, wk.week);
  const thuOfWk = new Date(monOfWk);
  thuOfWk.setUTCDate(monOfWk.getUTCDate() + 3);
  const scopeMo = view === "month" ? { ...mo } : { year: thuOfWk.getUTCFullYear(), month: thuOfWk.getUTCMonth() };
  const nowYear = getISOWeek(new Date()).year;
  const moName = new Date(scopeMo.year, scopeMo.month, 1).toLocaleDateString("en-SG", { month: "long" })
    + (scopeMo.year !== nowYear ? " " + scopeMo.year : "");

  const overlay = el("div", { class: "overlay", onclick: close });
  const sheet = el("div", { class: "sheet search-sheet", onclick: e => e.stopPropagation() });
  overlay.appendChild(sheet);
  function close() { sheetRoot.innerHTML = ""; unlockPageScroll(); }

  sheet.appendChild(el("div", { class: "grabber" }));
  sheet.appendChild(el("div", { class: "sheet-head" }, el("span"), el("span", { class: "title" }, "Search"), el("span")));

  const input = el("input", { class: "search-input", type: "search", placeholder: "search entries…", autocomplete: "off" });
  input.addEventListener("input", () => { q = input.value.trim().toLowerCase(); renderResults(); });
  sheet.appendChild(input);

  const chips = el("div", { class: "chips" });
  const scopes = [["all", "all"], ["week", "W" + pad2(scopeWk.week) + (scopeWk.year !== nowYear ? " " + scopeWk.year : "")], ["month", moName]];
  for (const [id, label] of scopes) {
    chips.appendChild(el("button", {
      class: "chip mode" + (scope === id ? " on" : ""),
      onclick: () => {
        scope = id;
        Array.from(chips.children).forEach((c, i) => c.classList.toggle("on", scopes[i][0] === id));
        renderResults();
      }
    }, label));
  }
  sheet.appendChild(chips);

  const resultsRoot = el("div", { class: "search-results" });
  sheet.appendChild(resultsRoot);

  function inScope(e) {
    if (scope === "week") return e.year === scopeWk.year && e.week === scopeWk.week;
    if (scope === "month") {
      if (e.week == null) return e.year === scopeMo.year && e.month === scopeMo.month; // month-scoped entry
      const mon = mondayOfISOWeek(e.year, e.week);
      const thu = new Date(mon);
      thu.setUTCDate(mon.getUTCDate() + 3);
      return thu.getUTCFullYear() === scopeMo.year && thu.getUTCMonth() === scopeMo.month;
    }
    return true;
  }
  function matches(e) {
    const hay = (plainText(e.text, "keep") + " " + e.tags.map(groupLabel).join(" ")).toLowerCase();
    return hay.includes(q);
  }
  function renderResults() {
    resultsRoot.innerHTML = "";
    if (!q) {
      resultsRoot.appendChild(el("p", { class: "search-hint" }, "search " + entries.filter(e => !e.segmented && inScope(e)).length + " entries…"));
      return;
    }
    const found = entries.filter(e => !e.segmented && inScope(e) && matches(e))
      .sort((a, b) => (b.year - a.year) || (weekSortKey(b) - weekSortKey(a)) || (daySortKey(b) - daySortKey(a)) || b.createdAt.localeCompare(a.createdAt));
    resultsRoot.appendChild(el("p", { class: "search-count" }, found.length + " found"));
    if (!found.length) return;
    const card = el("div", { class: "group-card" });
    for (const e of found) card.appendChild(searchResultEl(e, q));
    resultsRoot.appendChild(card);
  }

  renderResults();
  sheetRoot.appendChild(overlay);
  setTimeout(() => input.focus(), 120);
}

// ---------- settings (long-press the title) ----------
function openSettings() {
  sheetRoot.innerHTML = "";
  const overlay = el("div", { class: "overlay", onclick: () => sheetRoot.innerHTML = "" });
  const sheet = el("div", { class: "sheet", onclick: e => e.stopPropagation() });
  overlay.appendChild(sheet);

  function build() {
    sheet.innerHTML = "";
    sheet.appendChild(el("div", { class: "grabber" }));
    sheet.appendChild(el("div", { class: "sheet-head" },
      el("span", { class: "title" }, "Settings"), el("span")));

    // ---- tags ----
    // First on the sheet: it's the only section here that is her CONTENT rather than the app's
    // plumbing, and the one she'll come looking for. Rebuilt on its own (renderTags) rather than
    // through build(), so editing a name can't wipe the connection note or the key field below.
    const tagsBox = el("div");
    sheet.appendChild(tagsBox);
    // one debounce for both jobs a rename has to do — write it away, and redraw the list behind
    // the sheet where the old name is still showing on every pill and group header.
    let tagSaveT = null;
    function commitTags() {
      clearTimeout(tagSaveT);
      tagSaveT = setTimeout(() => { saveTaxonomy(); render(); }, 220);
    }
    // A removal is instantly reversible, so it doesn't get a confirmation — it gets a restore row
    // in the rose the app already uses for undo. It goes into the retired list rather than a
    // variable in this sheet, so it is still there after Settings is closed, after a reload, and
    // on her other device: an undo that expires the moment the panel does is not an undo, it's a
    // grace period, and the deposits it would strand are the whole reason removal needs one.
    // Nothing is done to those deposits either way — they keep the tag's id, so a restore puts
    // every one of them back exactly where it was.
    function removeTag(item, list, isTopic) {
      const at = list.indexOf(item);
      if (at < 0) return;
      list.splice(at, 1);
      RETIRED = [...RETIRED, { ...item, at, isTopic }].slice(-RETIRED_MAX);
      commitTags(); renderTags();
    }
    function restoreTag(rec) {
      const list = rec.isTopic ? TOPICS : MODES;
      const { at, isTopic, ...item } = rec;
      list.splice(Math.min(at == null ? list.length : at, list.length), 0, item);
      RETIRED = RETIRED.filter(r => r !== rec);
      commitTags(); renderTags();
    }
    // circular distance between two hues, so "far from the others" means the same going either
    // way round the wheel
    const hueGap = (a, b) => { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); };
    // Tapping a dot walks the wheel FORWARD to the next hue that is at least 24° clear of every
    // other topic. Forward means repeated taps keep moving rather than flipping between two
    // colours; the 24° floor means every stop is a colour she can actually tell apart from the
    // ones already on the list.
    function cycleHue(cur, others) {
      for (let step = 6; step <= 360; step += 6) {
        const h = (cur + step) % 360;
        if (others.every(o => hueGap(h, o) > 24)) return h;
      }
      return (cur + 30) % 360;
    }
    function taxRow(item, list, isTopic, usage) {
      const row = el("div", { class: "tax-row" });
      if (isTopic) {
        const dot = el("button", {
          class: "tax-dot", "aria-label": "Change colour",
          style: { background: item.dot },
          onclick: () => {
            const others = list.filter(x => x !== item).map(x => x.hue != null ? x.hue : hexHue(x.dot));
            Object.assign(item, topicColours(cycleHue(item.hue != null ? item.hue : hexHue(item.dot), others)));
            commitTags(); renderTags();
          }
        });
        row.appendChild(dot);
      }
      // a ghost input: it reads as the name until she puts a caret in it, and only then as a
      // field. Same grammar as the composer — nothing looks editable until it is being edited.
      const name = el("input", {
        class: "tax-name", type: "text", value: item.label,
        "aria-label": "Tag name", autocomplete: "off", spellcheck: "false"
      });
      // renderTags is deliberately NOT called from here: rebuilding the row under a live caret
      // is how a rename loses the caret on every keystroke.
      name.addEventListener("input", () => { item.label = name.value; commitTags(); });
      name.addEventListener("blur", () => {
        if (item.label.trim()) return;
        item.label = isTopic ? "untitled topic" : "untitled mode";
        name.value = item.label; commitTags();
      });
      row.appendChild(name);
      const n = usage[item.id] || 0;
      if (n) row.appendChild(el("span", { class: "tax-count" }, String(n)));
      row.appendChild(el("button", {
        class: "tax-del", "aria-label": "Remove " + item.label,
        onclick: () => removeTag(item, list, isTopic)
      }, "×"));
      return row;
    }
    function addTag(list, isTopic) {
      const item = isTopic
        ? { id: "t" + Date.now().toString(36), label: "new topic", ...topicColours(nextFreeHue()) }
        : { id: "m" + Date.now().toString(36), label: "new mode" };
      list.push(item);
      commitTags(); renderTags();
      // straight into naming it, with the placeholder name selected so typing replaces it —
      // adding a tag and naming it are one action, not two
      const rows = tagsBox.querySelectorAll(".tax-row .tax-name");
      const field = rows[isTopic ? TOPICS.length - 1 : TOPICS.length + MODES.length - 1];
      if (field) { field.focus(); field.select(); }
    }
    function renderTags() {
      tagsBox.innerHTML = "";
      // counted off every deposit, not the current period: this is "what am I about to drop",
      // and a topic with nothing filed under it this month may still hold a year of entries.
      const usage = {};
      for (const e of entries) for (const t of (e.tags || [])) usage[t] = (usage[t] || 0) + 1;

      tagsBox.appendChild(el("p", { class: "field-label", style: { marginTop: "0" } }, "topics"));
      TOPICS.forEach(t => tagsBox.appendChild(taxRow(t, TOPICS, true, usage)));
      tagsBox.appendChild(el("button", { class: "tax-add", onclick: () => addTag(TOPICS, true) }, "+ topic"));

      tagsBox.appendChild(el("p", { class: "field-label", style: { marginTop: "20px" } }, "modes"));
      MODES.forEach(m => tagsBox.appendChild(taxRow(m, MODES, false, usage)));
      tagsBox.appendChild(el("button", { class: "tax-add", onclick: () => addTag(MODES, false) }, "+ mode"));

      // the retired ones, newest first — the mistake she is most likely to be undoing is the
      // one she just made
      [...RETIRED].reverse().forEach(rec => {
        const n = usage[rec.id] || 0;
        tagsBox.appendChild(el("button", { class: "tax-undo", onclick: () => restoreTag(rec) },
          "restore " + (rec.label || "that tag")
          + (n ? " · " + n + " deposit" + (n === 1 ? "" : "s") : "")));
      });

      tagsBox.appendChild(el("p", { class: "settings-note" },
        "renaming keeps every deposit already filed under a tag — they're stored by tag, not by name. "
        + "removing one leaves those deposits untagged rather than deleting them, and tapping a dot "
        + "gives that topic the next colour the palette has room for."));
    }
    renderTags();

    // ---- cloud sync ----
    // A Worker URL and a secret, typed in once per device. No accounts and no sign-in
    // round-trip: the previous backend's session token lived in localStorage alongside the
    // photos, so when that filled up the token couldn't be refreshed and both devices were
    // quietly signed out. Two fields that never expire can't do that.
    sheet.appendChild(el("p", { class: "field-label" }, "cloud sync"));
    const cc = cloudConfig();
    if (cc) {
      const note = el("p", { class: "settings-note", style: { margin: "0" } },
        "backing up to " + cc.url.replace(/^https?:\/\//, "") + " — entries and photos sync across your devices.");
      sheet.appendChild(note);
      const syncBtn = el("button", { class: "lock-btn", onclick: async () => {
        syncBtn.disabled = true; syncBtn.textContent = "syncing…";
        await syncPull(); await pushEntriesNow();
        syncBtn.disabled = false; syncBtn.textContent = "sync now"; render();
      } }, "sync now");
      sheet.appendChild(syncBtn);
      const testBtn = el("button", { class: "lock-btn", onclick: async () => {
        testBtn.disabled = true; testBtn.textContent = "checking…";
        const r = await cloudCheck();
        testBtn.disabled = false; testBtn.textContent = "test connection";
        note.textContent = r.ok
          ? "connected — " + r.entries + " entries in the cloud" +
            (r.deleted ? " (plus " + r.deleted + " deleted)." : ".")
          : "can't reach it: " + r.reason;
      } }, "test connection");
      sheet.appendChild(testBtn);
      // Setting a device up by retyping a 48-character key is how keys end up mistyped.
      // This copies a link that carries it — open it on the other device and it is done.
      const linkBtn = el("button", { class: "lock-btn", onclick: async () => {
        const url = setupLink();
        if (!url) return;
        try { await navigator.clipboard.writeText(url); linkBtn.textContent = "copied — open it on the other device"; }
        catch (e) { note.textContent = url; linkBtn.textContent = "copy failed — the link is above"; }
        setTimeout(() => { linkBtn.textContent = "copy setup link"; }, 4000);
      } }, "copy setup link");
      sheet.appendChild(linkBtn);
      sheet.appendChild(el("p", { class: "settings-note", style: { margin: "2px 0 0" } },
        "the link contains your key — treat it like a password, and it only needs to travel once."));
      sheet.appendChild(el("button", { class: "lock-btn", style: { marginTop: "10px" }, onclick: () => {
        setCloudConfig(null); build();   // local entries are untouched; only the link goes
      } }, "disconnect"));
    } else {
      const urlIn = el("input", { class: "key-input", type: "url", placeholder: "https://deposits.<you>.workers.dev", autocomplete: "off" });
      const secretIn = el("input", { class: "key-input", type: "password", placeholder: "worker secret", autocomplete: "off" });
      const status = el("p", { class: "settings-note" },
        "paste the Worker's address and its secret. entries back up as one small file; " +
        "photos go up once each and are only ever downloaded once per device.");
      const connect = el("button", { class: "lock-btn", onclick: async () => {
        const url = urlIn.value.trim(), secret = secretIn.value.trim();
        if (!url || !secret) return;
        connect.disabled = true; connect.textContent = "connecting…";
        setCloudConfig({ url, secret });
        const r = await cloudCheck();
        connect.disabled = false; connect.textContent = "connect";
        if (!r.ok) { setCloudConfig(null); status.textContent = "couldn't connect: " + r.reason; return; }
        await syncPull(); render(); syncPushEntries();
        build();
      } }, "connect");
      sheet.appendChild(urlIn);
      sheet.appendChild(secretIn);
      sheet.appendChild(connect);
      sheet.appendChild(status);
    }

    // ---- storage ----
    // Real numbers, on the device that has the problem. Diagnosing the last outage meant
    // plugging a phone into a Mac to reach a console; it shouldn't have.
    sheet.appendChild(el("p", { class: "field-label", style: { marginTop: "26px" } }, "storage"));
    const storageNote = el("p", { class: "settings-note", style: { margin: "0" } }, "checking…");
    sheet.appendChild(storageNote);

    // photos move in the background; show where they are rather than leaving the panel silent
    const photoNote = el("p", { class: "settings-note", style: { margin: "4px 0 0" } });
    photoNote.style.display = photoStatus ? "" : "none";
    if (photoStatus) photoNote.textContent = "photos " + photoStatus.done + " of " + photoStatus.total + "…";
    sheet.appendChild(photoNote);
    onPhotoProgress = (st, done, total) => {
      if (!photoNote.isConnected) { onPhotoProgress = null; return; }
      photoNote.style.display = "";
      photoNote.textContent = st ? "photos " + done + " of " + total + "…" : "photos up to date";
    };

    if (cloudConfig()) {
      const fixBtn = el("button", { class: "lock-btn", onclick: async () => {
        fixBtn.disabled = true; fixBtn.textContent = "re-downloading…";
        const r = await pullMissingImages(true);
        fixBtn.disabled = false; fixBtn.textContent = "re-download photos";
        photoNote.style.display = "";
        photoNote.textContent = r.got + " photo(s) restored" + (r.failed ? ", " + r.failed + " failed" : "");
        render();
      } }, "re-download photos");
      sheet.appendChild(fixBtn);
    }

    storageReport().then(r => {
      const mb = n => (n / 1048576).toFixed(1) + "MB";
      const pct = r.quota ? Math.round((r.usage / r.quota) * 100) : null;
      storageNote.textContent =
        r.entries + " entries · " + r.images + " photos (" + mb(r.imageBytes) + ")" +
        (r.quota ? " · using " + mb(r.usage) + " of " + mb(r.quota) + " available (" + pct + "%)" : "") +
        (r.legacyBytes > 100000 ? " · " + mb(r.legacyBytes) + " still in the old store" : "");
    }).catch(() => { storageNote.textContent = "couldn't read storage stats"; });

    // ---- composer speed ----
    // One sheet serves both viewports: the desktop rail's Settings glyph and the mobile ⋮
    // menu's Settings row both land here, so this control only has to be built once.
    sheet.appendChild(el("p", { class: "field-label", style: { marginTop: "26px" } }, "composer speed"));
    const seg = el("div", { class: "speed-seg", role: "group", "aria-label": "Composer speed" });
    for (let i = 0; i < UNFOLD_STEPS.length; i++) {
      const off = UNFOLD_STEPS[i] === 0;
      const cell = el("button", {
        class: "speed-cell" + (i === unfoldLevel ? " on" : ""),
        "aria-pressed": i === unfoldLevel ? "true" : "false",
        "aria-label": off ? "no animation" : "speed " + (i + 1) + " of " + UNFOLD_STEPS.length,
        onclick: () => { setUnfoldLevel(i); build(); }
      });
      if (off) cell.innerHTML = ICO_RABBIT;
      else cell.textContent = String(i + 1);
      seg.appendChild(cell);
    }
    sheet.appendChild(seg);
    sheet.appendChild(el("p", { class: "settings-note" }, unfoldNote()));

    sheet.appendChild(el("p", { class: "field-label", style: { marginTop: "26px" } }, "anthropic api key"));
    const input = el("input", { class: "key-input", type: "password", placeholder: "sk-ant-…", autocomplete: "off" });
    input.value = apiKey || "";
    input.addEventListener("input", () => {
      apiKey = input.value.trim() || null;
      try {
        if (apiKey) localStorage.setItem(API_KEY_KEY, apiKey);
        else localStorage.removeItem(API_KEY_KEY);
      } catch (e) {}
    });
    sheet.appendChild(input);
    sheet.appendChild(el("p", { class: "settings-note" },
      "stored only on this device. used for the weekly summary (via haiku, fractions of a cent) — once a week has entries on 3 or more days, a wand appears to create it — and for the monthly reading (via sonnet, a few cents): in month view, the wand reads the whole month back as observation cards, one at a time."));
  }

  build();
  sheetRoot.appendChild(overlay);
}

// settings used to hang off a long-press on the "deposits" title; the period tabs now
// occupy that same top-left spot, so the gesture moves there and the muscle memory holds.
// the flag stops the release from also registering as a period tap.
const periodNav = document.querySelector(".period-nav");
let titleHoldTimer = null;
periodNav.addEventListener("pointerdown", () => {
  titleLongFired = false;
  clearTimeout(titleHoldTimer);
  titleHoldTimer = setTimeout(() => { titleLongFired = true; openSettings(); }, 500);
});
["pointerup", "pointerleave", "pointercancel"].forEach(evt =>
  periodNav.addEventListener(evt, () => clearTimeout(titleHoldTimer)));
periodNav.addEventListener("contextmenu", e => e.preventDefault());

// ---------- fab: tap = new entry, long-press = swap to export ----------
const fab = document.getElementById("fab");
const composeHint = document.querySelector(".compose-hint");
pauseShimmerOnScroll(composeHint); // window scroll — the bar is fixed, so the sweep would ride over moving cards
const EXPORT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>';
const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const TICK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19.5 7"/></svg>';
let fabMode = "add";
let fabHoldTimer = null, fabLongFired = false, fabRevertTimer = null;

// the dock's primary button is icon-based now, so every state swaps innerHTML — assigning
// textContent would drop the svg and leave a bare glyph in a 44px circle.
function setFabMode(mode) {
  fabMode = mode;
  clearTimeout(fabRevertTimer);
  fab.classList.remove("copied");
  if (mode === "export") {
    composeHint.classList.remove("shimmer"); // its svg would vanish under background-clip:text
    composeHint.innerHTML = EXPORT_ICON + "<span style=\"margin-left:8px\">export markdown</span>";
    fab.setAttribute("aria-label", "Export markdown");
    fabRevertTimer = setTimeout(() => setFabMode("add"), 5000); // untouched: fall back to +
  } else {
    composeHint.textContent = "Start typing\u2026";
    composeHint.classList.add("shimmer");
    fab.setAttribute("aria-label", "New entry");
  }
}

async function doExport() {
  const md = toMarkdown(activeEntries(), exportHeading());
  clearTimeout(fabRevertTimer);
  try {
    await navigator.clipboard.writeText(md);
    fab.classList.add("copied");
    composeHint.classList.remove("shimmer");
    composeHint.innerHTML = TICK_ICON + "<span style=\"margin-left:8px\">copied</span>";
    setTimeout(() => setFabMode("add"), 1200);
  } catch (e) {
    setFabMode("add");
    const overlay = el("div", { class: "overlay", onclick: () => sheetRoot.innerHTML = "" });
    const sheet = el("div", { class: "sheet", onclick: ev => ev.stopPropagation() });
    sheet.appendChild(el("div", { class: "grabber" }));
    sheet.appendChild(el("p", { class: "export-note" }, "select all + copy:"));
    const ta = el("textarea", { class: "export-area", rows: "14", readonly: "readonly" });
    ta.value = md;
    ta.addEventListener("focus", () => ta.select());
    sheet.appendChild(ta);
    overlay.appendChild(sheet);
    sheetRoot.appendChild(overlay);
  }
}

fab.addEventListener("pointerdown", () => {
  fabLongFired = false;
  clearTimeout(fabHoldTimer);
  fabHoldTimer = setTimeout(() => {
    fabLongFired = true;
    setFabMode(fabMode === "add" ? "export" : "add");
  }, 500);
});
["pointerup", "pointerleave", "pointercancel"].forEach(evt =>
  fab.addEventListener(evt, () => clearTimeout(fabHoldTimer)));
fab.addEventListener("contextmenu", e => e.preventDefault());
fab.addEventListener("click", () => {
  if (fabLongFired) { fabLongFired = false; return; } // swallow the click after a long press
  if (fabMode === "add") openComposer(null);
  else doExport();
});

// ============================================================================
// THE WRAPPED CUE — one chevron under the period, and the heat bloom it opens
// ----------------------------------------------------------------------------
// It replaced two magic wands (one in weekSummaryBlock, one in monthRecapBlock) that were
// absolutely positioned over the first entry card's top-right corner. There is one door now,
// it sits under the thing it's about, and it is the same control in both views.
//
// The gesture is a scrub, not a button: drag down and the bloom follows the finger, so the
// wrapped can be peeked at and backed out of. Past PULL_COMMIT it finishes on its own.
// ============================================================================
const cueEl = document.getElementById("wrappedCue");
const chevEl = document.getElementById("wcChev");
const heatEl = document.getElementById("heat");
const wrapEl = document.querySelector(".wrap");

const PULL_FULL = 150;    // px of drag that equals a fully bloomed screen
const PULL_COMMIT = 0.58; // …and the fraction of it that counts as "yes, open it"

// what the cue would do right now: null = don't show it at all.
//   { kind: "open", run }      a reading exists — go straight in
//   { kind: "make", run, ask } nothing yet — the bloom lands on the offer to write one
let cueAction = null;

function syncWrappedCue(list) {
  cueAction = list && list.length ? wrappedActionFor(list) : null;
  cueEl.hidden = !cueAction;
  wrapEl.classList.toggle("has-cue", !!cueAction);
  // catch up with wherever the page already is: a reload restores the scroll position,
  // and without this the cue would come back at full strength sitting under the header
  syncCueFade(wrapEl.scrollTop || window.scrollY);
  chevEl.setAttribute("aria-label",
    !cueAction ? "Open the wrapped"
      : cueAction.kind === "open"
        ? (view === "week" ? "Open this week's wrapped" : "Open this month's wrapped")
        : (view === "week" ? "Read this week back" : "Read this month back"));
}

function wrappedActionFor(list) {
  if (view === "week") {
    const k = weekKey(wk.year, wk.week);
    if (weekSumInFlight.has(k)) return null;         // already being written
    const rec = weekSummaries[k];
    if (rec) return { kind: "open", run: () => openWeekReveal(wk.year, wk.week, list) };
    const filledDays = new Set(list.map(entryDay).filter(d => d != null)).size;
    if (filledDays >= 3 && apiKey) return {
      kind: "make",
      ask: "Create a summary of this week?", ok: "Summarize",
      run: () => {
        showWeekSummary = true; // she asked for it — don't let it land hidden
        try { localStorage.setItem(SHOW_WSUM_KEY, "1"); } catch (e) {}
        generateWeekSummary(wk.year, wk.week, list);
        render();
      }
    };
    return null;
  }
  const k = monthKey(mo.year, mo.month);
  if (recapInFlight.has(k)) return null;
  if (currentRecapTake(monthRecaps[k])) return { kind: "open", run: () => openRecap(mo.year, mo.month) };
  if (apiKey && list.length >= RECAP_MIN_ENTRIES) return {
    kind: "make",
    ask: "Read " + monthNameOf(mo.year, mo.month) + " back? A few observations, one at a time.",
    ok: "Read it",
    run: () => startMonthRecap(mo.year, mo.month)
  };
  return null;
}

// ---- the status bar ------------------------------------------------------
// Installed to the home screen, iOS paints the strip above the page with theme-color. Left
// at the app's grey it reads as a foreign band across the top of a screen full of colour.
// It can't be made transparent without also turning the clock white (see the meta comment),
// so instead it is kept matching: set on arrival, restored on the way out.
const THEME_BASE = "#F0F0F1";
const themeMeta = document.querySelector('meta[name="theme-color"]');
function setThemeColor(hex) { if (themeMeta) themeMeta.setAttribute("content", hex); }
// what the top of the bloom actually resolves to: the field nearest the top of the screen,
// alpha-composited over the wash the same way the CSS does it. Approximated rather than
// sampled — reading a real pixel would mean a canvas snapshot of a blurred, animating layer.
function heatTopColor() {
  if (!heatFields.length) return THEME_BASE;
  // whichever field ended up highest on screen is the one under the status bar
  const hex = heatFields.reduce((a, b) => (b.y < a.y ? b : a)).c;
  const n = parseInt(hex.slice(1), 16);
  const mix = (c, i) => Math.round(c * i + 252 * (1 - i)); // 252 = the #FCFCFB wash
  // the top of the screen catches a field's outer falloff, not its core, so it lands light
  const a = 0.34;
  return "#" + [mix((n >> 16) & 255, a), mix((n >> 8) & 255, a), mix(n & 255, a)]
    .map(v => v.toString(16).padStart(2, "0")).join("");
}

// ---- the bloom ----------------------------------------------------------
// Fields are rebuilt per open because they're made of THIS period's topics: which ones,
// and how much of each. A month of nothing but work is one big blue field; a scattered
// month is six small ones. That's the "heat" — it's her data, not decoration.
let heatFields = [];   // {c, y} per field — y in vh from centre, for heatTopColor()
function buildHeatFields(list) {
  heatEl.querySelectorAll(".heat-field").forEach(n => n.remove());
  heatFields = [];
  const tally = {};
  list.forEach(e => (e.tags || []).forEach(t => { if (topicById[t]) tally[t] = (tally[t] || 0) + 1; }));
  let ranked = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 6);
  // a period with no topics at all still deserves a transition, so fall back to the
  // deck's own three neutrals rather than opening onto a blank white screen
  if (!ranked.length) ranked = [["_a", 1], ["_b", 1], ["_c", 1]];
  const NEUTRAL = { _a: "#EDE4D8", _b: "#DFE7EA", _c: "#EAE0EA" };
  const top = ranked[0][1];

  // where the bloom is born: the chevron's own centre, in viewport units
  const r = chevEl.getBoundingClientRect();
  const ox = (r.left + r.width / 2) + "px";
  const oy = (r.top + r.height / 2) + "px";

  ranked.forEach(([id, n], i) => {
    // fan them around the origin rather than scattering randomly — a fixed golden-angle
    // spiral means the same period always blooms the same way, which matters the second
    // time she opens it. Random placement made a familiar month look like a new one.
    const ang = i * 2.399963 - 1.2;              // ~137.5°, the golden angle
    // pushed well off centre and sized under the viewport: fields that all cover the whole
    // screen are just one colour, and the point is to SEE that this month was mostly work
    const reach = 0.28 + 0.055 * i;
    const share = n / top;                        // 1 for her biggest topic
    const colour = NEUTRAL[id] || topicById[id].heat;
    heatFields.push({ c: colour, y: Math.sin(ang) * reach });
    const f = el("div", { class: "heat-field" });
    f.style.setProperty("--c", colour);
    f.style.setProperty("--ox", ox);
    f.style.setProperty("--oy", oy);
    f.style.setProperty("--x", `calc(50vw + ${(Math.cos(ang) * reach * 100).toFixed(1)}vw)`);
    f.style.setProperty("--y", `calc(50vh + ${(Math.sin(ang) * reach * 100).toFixed(1)}vh)`);
    f.style.setProperty("--d", (62 + share * 38).toFixed(0) + "vmax");
    f.style.setProperty("--blur", (22 + i * 4) + "px");
    // her biggest topic is the most present; the tail is a tint
