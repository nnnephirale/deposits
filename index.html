    p.appendChild(renderRichBlocks(above, e.images, onResize, onCheck));
  } else {
    p.appendChild(renderRichBlocks(e.text, e.images, onResize, onCheck));
  }
  body.appendChild(p);
  if (foldHasBody) {
    const more = el("button", { class: "read-more",
      onclick: ev => { ev.stopPropagation(); openReadModal(e); } }, "Read more");
    body.appendChild(more);
  }
  const meta = el("div", { class: "entry-meta" });
  if (e.locked) {
    const lock = el("span", { class: "entry-lock", "aria-label": "locked" });
    lock.innerHTML = LOCK_ICON;
    meta.appendChild(lock);
  }
  const bits = [];
  // the gutter badge already says which day it was, so meta only adds what it can't:
  // the calendar date in month view, plus week/year when those aren't implied by the view.
  if (opts.showDate && dayIdx != null) {
    const dstr = entryDateStr(e);
    if (dstr) bits.push(dstr);
  }
  // week-tagged entries (day or not) show their W## in month view; month-scoped ones
  // have no week to show — the view itself is their scope
  if (opts.showWeek && e.week != null) bits.push("W" + pad2(e.week));
  if (opts.showWeek && e.year !== currentWk.year) bits.push(String(e.year));
  if (bits.length) meta.appendChild(el("span", { class: "entry-day" }, bits.join(" · ")));
  for (const tg of e.tags) {
    if (tg === opts.skipTag) continue;
    const tt = topicById[tg], mm = modeById[tg];
    if (tt) {
      if (sideTopic && tt.id === sideTopic.id) continue; // already riding at the side
      meta.appendChild(el("span", { class: "pill", style: { background: tt.bg, color: tt.fg } }, tt.label));
    }
    else if (mm) meta.appendChild(el("span", { class: "pill mode" }, mm.label));
  }
  if (meta.children.length) body.appendChild(meta);
  if (sideTopic) {
    body.appendChild(el("div", { class: "entry-side" },
      el("span", { class: "pill", style: { background: sideTopic.bg, color: sideTopic.fg } }, sideTopic.label)));
  }
  entry.appendChild(body);
  return entry;
}

// Read-more opens the whole entry — above AND below the fold — floating in a centred modal
// (her modal spec: dark blurred backdrop, white card, heavy shadow, 20px radius). read-only,
// but the checklists stay live; toggling one rewrites the text and rebuilds the modal body
// in place. tapping the entry card itself is still the way into the editor.
function openReadModal(entry) {
  const id = entry.id;
  lockPageScroll();
  const back = el("div", { class: "read-back" });
  const modal = el("div", { class: "read-modal", onclick: ev => ev.stopPropagation() });
  const body = el("div", { class: "read-body" });
  const renderBody = () => {
    const e = entries.find(x => x.id === id) || entry; // re-read: a toggle may have changed it
    body.innerHTML = "";
    // renderRichBlocks already drops the "+++" fold line, so the modal shows above+below seamlessly
    body.appendChild(renderRichBlocks(e.text, e.images,
      (imgId, size) => { setImageSize(id, imgId, size); renderBody(); },
      (li, c) => { setLineChecked(id, li, c); renderBody(); }));
  };
  renderBody();
  const close = () => {
    back.classList.remove("show");
    document.removeEventListener("keydown", onKey);
    setTimeout(() => back.remove(), 200);
    unlockPageScroll();
  };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  modal.appendChild(el("button", { class: "read-x", "aria-label": "Close", onclick: close }, "×"));
  modal.appendChild(body);
  back.appendChild(modal);
  back.addEventListener("click", () => close()); // tap the backdrop to dismiss
  document.addEventListener("keydown", onKey);
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add("show"));
}

function renderTopicGroups(list, dense) {
  for (const g of orderGroupsForDisplay(groupByTopic(list))) {
    const t = topicById[g.key];
    const group = el("div", { class: "group" + (dense ? " dense" : "") });
    let head = null;
    if (!dense) {
      head = el("div", { class: "group-head" });
      if (t) head.appendChild(el("span", { class: "group-dot", style: { background: t.dot } }));
      head.appendChild(el("span", { class: "group-label", style: { color: t ? t.fg : "var(--subtle)" } }, groupLabel(g.key)));
    }
    const card = el("div", { class: "group-card" });
    if (head) card.appendChild(head); // the topic reads as the block's own heading now
    for (const e of g.entries) {
      card.appendChild(entryEl(e, {
        skipTag: dense ? null : g.key, // dense: every entry carries its own topic pill, headers or no
        showWeek: view === "month",
        showDate: view === "month"
      }));
    }
    group.appendChild(card);
    entriesRoot.appendChild(group);
  }
}

function renderDayGroups(list) {
  const buckets = [];
  if (view === "week") {
    for (let d = DAY_TOKENS.length - 1; d >= 0; d--) {
      buckets.push({ label: DAY_TOKENS[d], entries: list.filter(e => entryDay(e) === d), opts: { showDay: false, sidePill: true } });
    }
    buckets.push({ label: "anytime", entries: list.filter(e => entryDay(e) == null), opts: { showDay: false, sidePill: true } });
  } else {
    for (const w of [...new Set(list.map(e => e.week))]) {
      // the null-week bucket holds the month-scoped entries — "anytime", like week view's
      buckets.push({ label: w == null ? "anytime" : "W" + pad2(w), entries: list.filter(e => e.week === w), opts: { showDate: true, sidePill: true } });
    }
  }
  for (const b of buckets) {
    if (!b.entries.length) continue;
    const card = el("div", { class: "group-card" });
    card.appendChild(el("div", { class: "group-head" },
      el("span", { class: "group-label", style: { color: "var(--ink)" } }, b.label)));
    for (const e of b.entries) card.appendChild(entryEl(e, b.opts));
    entriesRoot.appendChild(el("div", { class: "group" }, card));
  }
}

function render() {
  // the period tabs are both the identity and the switcher: W## reads the week being
  // viewed, 7\u6708 the month. the active one is dark, the other recedes.
  navWeek.textContent = "W" + pad2(wk.week);
  navMonth.textContent = (mo.month + 1) + "\u6708";
  navWeek.classList.toggle("on", view === "week");
  navMonth.classList.toggle("on", view === "month");
  if (layoutBtns) Array.from(layoutBtns.children).forEach(b => {
    const name = b.getAttribute("data-name");
    if (name) b.classList.toggle("on", name === layout);
  });

  periodLabel.innerHTML = "";
  if (view === "week") {
    let sub = weekRangeLabel(wk.year, wk.week);
    if (wk.year !== currentWk.year) sub += " \u00B7 " + wk.year;
    periodLabel.appendChild(el("div", { class: "wk-range" }, sub));
  } else {
    periodLabel.appendChild(el("div", { class: "wk-range" }, monthLabel(mo.year, mo.month)));
  }

  entriesRoot.innerHTML = "";
  const list = activeEntries();
  if (list.length === 0) {
    const empty = el("div", { class: "empty" });
    empty.innerHTML = "nothing deposited " + (view === "week" ? "this week" : "this month") + " yet.<br/>start typing below to file a thought.";
    entriesRoot.appendChild(empty);
    return;
  }
  if (view === "week") {
    const wsum = weekSummaryBlock(list);
    if (wsum) entriesRoot.appendChild(wsum);
  } else {
    const recap = monthRecapBlock(list); // the month's wand: read it back / replay the reading
    if (recap) entriesRoot.appendChild(recap);
  }
  if (layout === "day") renderDayGroups(list);
  else renderTopicGroups(list, false);
}

// ---------- composer ----------
const sheetRoot = document.getElementById("sheetRoot");

// pinned so the list behind a sheet can't scroll while it's open (iOS scroll-chaining fix)
let composerScrollY = 0;
function lockPageScroll() {
  if (document.body.style.position === "fixed") return; // already locked (e.g. composer opened from search)
  composerScrollY = window.scrollY;
  document.body.style.position = "fixed";
  document.body.style.top = -composerScrollY + "px";
  document.body.style.width = "100%";
}
function unlockPageScroll() {
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.width = "";
  window.scrollTo(0, composerScrollY);
}

// document-level selectionchange hook for whichever composer textarea is live. build()
// recreates the field on every day/week change, so the previous hook has to go with it —
// one listener at a time, dropped for good when the composer closes.
let fmtSelSync = null;
function bindFmtSelectionSync(fn) {
  if (fmtSelSync) document.removeEventListener("selectionchange", fmtSelSync);
  fmtSelSync = fn;
  if (fn) document.addEventListener("selectionchange", fn);
}

function openComposer(existing) {
  let text = existing ? existing.text : "";
  let tags = existing ? [...existing.tags] : [];
  let images = existing && existing.images ? { ...existing.images } : {};
  let locked = existing ? !!existing.locked : false;
  // month mode: entries born in the month view belong to the month itself — no week, no
  // day. an entry keeps its scope for life: editing a month entry never grows week pills.
  const monthMode = existing ? (existing.week == null && existing.month != null) : view === "month";
  const cmo = monthMode
    ? (existing ? { year: existing.year, month: existing.month } : { ...mo })
    : null;
  let cw = existing
    ? { year: existing.year, week: existing.week }
    : (view === "week" ? { year: wk.year, week: wk.week } : getISOWeek(new Date()));
  let day = existing ? entryDay(existing) : weekdayIndex(new Date());
  const nowWk = getISOWeek(new Date());
  // the fields that pin an entry to its spot in time — month scope or week(+day) scope
  const scopeFields = () => monthMode
    ? { year: cmo.year, month: cmo.month, week: null, day: null }
    : { year: cw.year, week: cw.week, day };
  // segmentation proposal: null | { busy: true } | { ranges: [{start, end, topic}] }
  let segState = null, segErr = null, segTagOpen = -1;
  // manual composer height (px) set by dragging the notch; persists across rebuilds
  let manualHeight = null;
  // once the format bar has shown, keep it shown (survives rebuilds too — no reflow jump)
  let barShown = false;

  sheetRoot.innerHTML = ""; // never stack on another sheet (composer can open from search results)
  lockPageScroll();
  const overlay = el("div", { class: "overlay", onclick: requestClose });
  const sheet = el("div", { class: "sheet expanse", onclick: e => e.stopPropagation() });
  overlay.appendChild(sheet);
  // build() clears sheet's children but not sheet's own listeners, and it re-runs on every
  // day/week/tag/lock change — so the tap-away handler is swapped, never stacked.
  let sheetTapAway = null;

  function close() {
    document.body.classList.remove("composing"); // let the list come back forward
    bindFmtSelectionSync(null); sheetRoot.innerHTML = ""; unlockPageScroll();
  }
  // tapping away with unsaved work is an easy way to lose a thought — warn first. covers a
  // brand-new entry with text AND edits to an existing one; an unchanged entry (just opened
  // to read) or an empty new composer dismisses without friction.
  function isDirty() {
    if (segState && segState.ranges) return true; // an unsaved cut proposal counts as work
    if (!existing) return !!text.trim();
    if (text.trim() !== (existing.text || "").trim()) return true;
    if (locked !== !!existing.locked) return true;
    if (day !== entryDay(existing)) return true;
    if (cw.year !== existing.year || cw.week !== existing.week) return true;
    const a = [...tags].sort(), b = [...(existing.tags || [])].sort();
    return a.length !== b.length || a.some((t, i) => t !== b[i]);
  }
  function requestClose() {
    if (isDirty()) {
      confirmAction(
        existing ? "Discard your changes to this entry?" : "Discard this entry? Your unsaved text will be lost.",
        "Discard", close);
    } else {
      close();
    }
  }

  function build() {
    sheet.innerHTML = "";
    const grabber = el("div", { class: "grabber", title: "Drag to resize" });
    sheet.appendChild(grabber);

    // ---- header: day scrubber | title | save ----
    const head = el("div", { class: "sheet-head" });

    // strip = 7 day tokens + a trailing "–" cell meaning "no day"
    const NO_DAY = DAY_TOKENS.length;
    const stripTokens = [...DAY_TOKENS, "–"];
    const dayPill = el("button", { class: "day-pill" }, day == null ? "–" : DAY_TOKENS[day]);
    let strip = null, dragging = false, moved = false, hot = (day == null ? NO_DAY : day), startX = 0;

    function commitDay(i) {
      day = (i === NO_DAY) ? null : i;
      closeStrip();
      build();
    }
    function openStrip() {
      if (strip) return;
      const todayIdx = weekdayIndex(new Date());
      strip = el("div", { class: "day-strip" });
      stripTokens.forEach((tok, i) => {
        const cls = [i === hot ? "hot" : "", i === todayIdx ? "today" : ""].filter(Boolean).join(" ");
        const s = el("span", { class: cls }, tok);
        // commit on pointerdown, not click: a click arrives only after the textarea has
        // blurred and the keyboard collapse has shifted the whole sheet, so it used to
        // land on the wrong element — the tap "didn't take" and needed a second attempt.
        // preventDefault also keeps the textarea focused, so nothing moves at all.
        s.addEventListener("pointerdown", ev => {
          ev.preventDefault();
          ev.stopPropagation();
          commitDay(i);
        });
        s.addEventListener("click", ev => ev.stopPropagation()); // late click on a replaced sheet must not bubble anywhere
        strip.appendChild(s);
      });
      head.appendChild(strip);
    }
    function closeStrip() { if (strip) { strip.remove(); strip = null; } }
    function highlight(i) {
      hot = i;
      if (!strip) return;
      Array.from(strip.children).forEach((c, j) => c.classList.toggle("hot", j === i));
    }
    function idxFromX(x) {
      const r = strip.getBoundingClientRect();
      const i = Math.floor((x - r.left) / (r.width / stripTokens.length));
      return Math.max(0, Math.min(stripTokens.length - 1, i));
    }

    dayPill.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      closeCalPop();
      if (strip && !dragging) { closeStrip(); return; } // second tap toggles closed
      dragging = true; moved = false; hot = (day == null ? NO_DAY : day); startX = ev.clientX;
      openStrip();
      try { dayPill.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    dayPill.addEventListener("pointermove", ev => {
      if (!dragging || !strip) return;
      if (Math.abs(ev.clientX - startX) > 8) moved = true;
      if (moved) highlight(idxFromX(ev.clientX));
    });
    dayPill.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      if (moved) commitDay(hot);
      // no movement: strip stays open for tapping a day
    });
    dayPill.addEventListener("pointercancel", () => { dragging = false; closeStrip(); });

    // ---- week pill: the wk-picker section collapsed into a W## button beside the day
    // pill. tapping it drops an inline month calendar; a date picks week + day, the W##
    // cell picks just the week (day untouched). collapse animates before committing. ----
    let calPop = null, calMonth = null;
    const weekPill = el("button", { class: "day-pill" },
      "W" + pad2(cw.week) + (cw.year !== nowWk.year ? "·" + String(cw.year).slice(2) : ""));
    weekPill.addEventListener("pointerdown", ev => ev.preventDefault()); // keep the textarea focused
    weekPill.addEventListener("click", ev => {
      ev.stopPropagation();
      if (calPop) closeCalPop(); else openCalPop();
    });

    function openCalPop() {
      if (calPop) return;
      closeStrip();
      const mon = mondayOfISOWeek(cw.year, cw.week);
      const thu = new Date(mon);
      thu.setUTCDate(mon.getUTCDate() + 3);
      calMonth = { year: thu.getUTCFullYear(), month: thu.getUTCMonth() }; // month the chosen week belongs to
      calPop = el("div", { class: "cal-pop" });
      // same keyboard rule as the day strip: preventDefault on pointerdown so the textarea
      // never blurs — the sheet stays perfectly still under the picker
      calPop.addEventListener("pointerdown", ev => { ev.preventDefault(); ev.stopPropagation(); });
      calPop.addEventListener("click", ev => ev.stopPropagation());
      renderCalPop();
      head.appendChild(calPop);
    }
    function closeCalPop(after) {
      const p = calPop;
      calPop = null;
      if (!p) { if (after) after(); return; }
      let fired = false;
      const done = () => { if (fired) return; fired = true; p.remove(); if (after) after(); };
      p.classList.add("closing");
      p.addEventListener("animationend", done, { once: true });
      setTimeout(done, 240); // reduced-motion / safety net
    }
    function pickWeek(iso, dayIdx) {
      closeCalPop(() => {
        cw = { year: iso.year, week: iso.week };
        if (dayIdx != null) day = dayIdx;
        build();
      });
    }
    function renderCalPop() {
      calPop.innerHTML = "";
      calPop.appendChild(el("div", { class: "cal-head" },
        el("button", { class: "stepper-btn", onclick: () => {
          calMonth = stepMonth(calMonth, -1);
          renderCalPop();
        } }, "‹"),
        el("button", { class: "cal-title", onclick: () => { // tap the title = back to the current month
          const t = new Date();
          calMonth = { year: t.getFullYear(), month: t.getMonth() };
          renderCalPop();
        } }, monthLabel(calMonth.year, calMonth.month)),
        el("button", { class: "stepper-btn", onclick: () => {
          calMonth = stepMonth(calMonth, 1);
          renderCalPop();
        } }, "›")
      ));
      const dow = el("div", { class: "cal-row cal-dow" }, el("span", { class: "cal-wk" }, ""));
      DAY_TOKENS.forEach(t => dow.appendChild(el("span", null, t)));
      calPop.appendChild(dow);

      // commits on pointerdown: this popover lives above a focused textarea, so a click
      // would land after the keyboard collapses the sheet. see the day-strip picker.
      for (const { iso, days } of monthGridRows(calMonth.year, calMonth.month)) {
        const current = iso.year === cw.year && iso.week === cw.week;
        const row = el("div", { class: "cal-row wk-row" + (current ? " current" : "") });
        const wkCell = el("span", { class: "cal-wk" }, "W" + pad2(iso.week));
        wkCell.addEventListener("pointerdown", () => pickWeek(iso, null)); // week only — day stays
        row.appendChild(wkCell);
        days.forEach((d, i) => {
          const cls = [
            d.getUTCMonth() !== calMonth.month ? "cal-out" : "",
            isTodayCell(d) ? "cal-today" : "",
            current && i === day ? "cal-sel" : ""
          ].filter(Boolean).join(" ");
          const cell = el("span", cls ? { class: cls } : null, String(d.getUTCDate()));
          cell.addEventListener("pointerdown", () => pickWeek(iso, i)); // a date sets week + day together
          row.appendChild(cell);
        });
        calPop.appendChild(row);
      }
    }

    // tap anywhere else in the sheet closes an open strip / calendar. swapped rather than
    // added, so a long editing session doesn't accumulate one handler per rebuild.
    if (sheetTapAway) sheet.removeEventListener("click", sheetTapAway);
    sheetTapAway = ev => {
      if (strip && !strip.contains(ev.target) && ev.target !== dayPill) closeStrip();
      if (calPop && !calPop.contains(ev.target) && ev.target !== weekPill) closeCalPop();
    };
    sheet.addEventListener("click", sheetTapAway);

    function doSave() {
      const imgs = imagesUsedIn(text, images); // pasted-then-deleted images don't persist
      const imgVal = Object.keys(imgs).length ? imgs : undefined;
      if (existing) {
        entries = entries.map(e => e.id === existing.id
          ? { ...e, text: text.trim(), tags, ...scopeFields(), locked,
              images: imgVal, updatedAt: new Date().toISOString() }
          : e);
      } else {
        const stamp = new Date().toISOString();
        entries = [...entries, {
          id: Date.now().toString(36),
          createdAt: stamp, updatedAt: stamp,
          text: text.trim(), tags, ...scopeFields(), locked,
          images: imgVal
        }];
      }
      saveEntries(entries);
      close();
      render();
    }

    // saving a segmentation writes the ramble as a hidden source entry plus one
    // deposit per block — every block is a verbatim slice of the original text.
    function doSaveSegments() {
      const ranges = segState.ranges;
      const stamp = new Date().toISOString();
      const base = Date.now().toString(36);
      const srcImgs = imagesUsedIn(text, images);
      let src;
      if (existing) {
        src = { ...existing, text: text.trim(), tags, ...scopeFields(), locked,
          images: Object.keys(srcImgs).length ? srcImgs : undefined, segmented: true, updatedAt: stamp };
        entries = entries.map(e => e.id === existing.id ? src : e);
      } else {
        src = { id: base, createdAt: stamp, updatedAt: stamp, text: text.trim(), tags,
          ...scopeFields(), locked, segmented: true,
          images: Object.keys(srcImgs).length ? srcImgs : undefined };
        entries = [...entries, src];
      }
      const modeTags = tags.filter(t => modeById[t]); // modes chosen for the ramble carry to every deposit
      const segs = ranges.map((rg, i) => {
        const segText = text.slice(rg.start, rg.end).trim();
        const segImgs = imagesUsedIn(segText, images); // each deposit keeps only the images its slice references
        return {
          id: base + "s" + i, createdAt: stamp, updatedAt: stamp,
          text: segText,
          tags: [...(rg.topic ? [rg.topic] : []), ...modeTags],
          ...scopeFields(), locked: false, sourceId: src.id,
          images: Object.keys(segImgs).length ? segImgs : undefined
        };
      });
      entries = [...entries, ...segs];
      saveEntries(entries);
      close();
      render();
    }

    const saveBtn = el("button", {
      class: "save",
      onclick: () => {
        if (!text.trim()) return;
        const save = (segState && segState.ranges) ? doSaveSegments : doSave;
        // moving an existing entry to a different week is easy to do by accident — confirm it
        if (existing && (cw.year !== existing.year || cw.week !== existing.week)) {
          const from = "W" + pad2(existing.week) + (existing.year !== cw.year ? " " + existing.year : "");
          const to = "W" + pad2(cw.week) + (existing.year !== cw.year ? " " + cw.year : "");
          confirmAction("Move this entry from " + from + " to " + to + "?", "Move", save);
        } else {
          save();
        }
      }
    }, "Save");
    saveBtn.disabled = !text.trim();

    if (monthMode) {
      // month entries carry no week/day — a single quiet pill names the month instead
      const monthPill = el("button", { class: "day-pill", style: { cursor: "default" } },
        new Date(cmo.year, cmo.month, 1).toLocaleDateString("en-SG", { month: "short" }).toUpperCase()
        + (cmo.year !== nowWk.year ? "·" + String(cmo.year).slice(2) : ""));
      monthPill.addEventListener("pointerdown", ev => ev.preventDefault()); // keep the textarea focused
      head.appendChild(el("div", { class: "head-pills" }, monthPill));
    } else {
      head.appendChild(el("div", { class: "head-pills" }, dayPill, weekPill));
    }
    // no "New entry" label: an empty field that says "Start typing…" is already the message.
    if (segState && segState.ranges) {
      head.appendChild(el("span", { class: "title" }, segState.ranges.length + " deposits"));
    }
    head.appendChild(saveBtn);
    sheet.appendChild(head);

    // ---- segmentation preview: the ramble cut into blocks, nothing else on the sheet ----
    if (segState && segState.ranges) { buildSegPreview(); return; }

    // ---- text ----
    const ta = el("textarea", { rows: "4", class: "ta-entry", placeholder: "Start typing\u2026" });
    ta.value = text;
    // grows with content up to the CSS max-height, then scrolls internally \u2014 so
    // "topic" stays peeking below rather than getting pushed off-screen entirely.
    // once the notch has been dragged, that height wins and content just scrolls within it.
    function autoGrow() {
      if (manualHeight != null) { ta.style.height = manualHeight + "px"; return; }
      ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
    }
    ta.addEventListener("input", () => { text = ta.value; saveBtn.disabled = !text.trim(); autoGrow(); });
    sheet.appendChild(ta);
    requestAnimationFrame(autoGrow); // ta isn't attached to the document until after build() returns

    // ---- notch = resize handle: drag it up to grow the writing surface, down to shrink ----
    grabber.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      const startY = ev.clientY;
      const startH = ta.getBoundingClientRect().height;
      // maximise the writing surface up to the point where the sheet exactly fills the
      // viewport minus a minimal tap-away gap — so dragging all the way up never spawns a
      // scrollbar. chrome = everything in the sheet that isn't the textarea (grabber, head,
      // format bar, topic/mode sections, paddings), measured live so it stays honest.
      const TOP_GAP = Math.max(28, Math.round(window.innerHeight * 0.06));
      const chrome = sheet.scrollHeight - startH;
      const maxH = Math.max(120, Math.round(window.innerHeight - TOP_GAP - chrome));
      sheet.style.maxHeight = (window.innerHeight - TOP_GAP) + "px"; // let the sheet grow to match
      grabber.style.cursor = "grabbing";
      try { grabber.setPointerCapture(ev.pointerId); } catch (e) {}
      const onMove = e => {
        const h = Math.max(120, Math.min(maxH, Math.round(startH + (startY - e.clientY))));
        manualHeight = h;
        // an explicit height overrides the CSS min/max clamp so the drag feels 1:1
        ta.style.maxHeight = "none"; ta.style.height = h + "px";
      };
      const onUp = e => {
        grabber.removeEventListener("pointermove", onMove);
        grabber.removeEventListener("pointerup", onUp);
        grabber.style.cursor = "";
        try { grabber.releasePointerCapture(e.pointerId); } catch (err) {}
      };
      grabber.addEventListener("pointermove", onMove);
      grabber.addEventListener("pointerup", onUp);
    });
    // a height chosen earlier survives a rebuild (day/week change)
    if (manualHeight != null) { ta.style.maxHeight = "none"; ta.style.height = manualHeight + "px"; }

    // shared image pipeline: ⌘V paste and the format-bar photo button both land here.
    // the image is downscaled (max 1100px), stored on the entry, and referenced inline
    // as a short ![photo:id] marker — never as base64 soup in the editor.
    async function insertImageFile(file) {
      try {
        const dataUrl = await fileToDataUrl(file);
        let id;
        do { id = Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }
        while (images[id]); // a batch of photos can land inside one millisecond
        images[id] = dataUrl;
        const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
        const before = v.slice(0, s), after = v.slice(en);
        const mark = (before && !before.endsWith("\n") ? "\n" : "")
          + "![photo:" + id + "]"
          + (!after || after.startsWith("\n") ? "" : "\n");
        ta.value = before + mark + after;
        const pos = before.length + mark.length;
        ta.setSelectionRange(pos, pos);
        text = ta.value;
        saveBtn.disabled = !text.trim();
        ta.focus(); // the file picker stole focus — hand it back so she can keep typing
        autoGrow();
        updateBar();
      } catch (err) { console.warn("image insert failed", err); }
    }

    // several photos at once — one after another, in the order she picked them, so the
    // markers land in that order too (each insert moves the cursor past its own marker)
    async function insertImageFiles(files) {
      for (const f of files) await insertImageFile(f);
    }

    // ⌘V an image (screenshot, copied photo) — or a clipboard holding several
    ta.addEventListener("paste", ev => {
      const items = ev.clipboardData ? ev.clipboardData.items : null;
      if (!items) return;
      const files = [...items]
        .filter(it => it.kind === "file" && it.type.startsWith("image/"))
        .map(it => it.getAsFile())
        .filter(Boolean);
      if (!files.length) return; // plain text pastes stay untouched
      ev.preventDefault();
      insertImageFiles(files);
    });

    // desktop: ⌘B / ⌘I / ⌘U (ctrl elsewhere). with a selection they wrap it, same as the
    // format bar. with just a cursor they now open the style — the markers appear with the
    // cursor between them, typing lands inside, and the same combo steps back out.
    ta.addEventListener("keydown", ev => {
      if (!(ev.metaKey || ev.ctrlKey) || ev.altKey) return;
      const pair = { b: ["**", "**"], i: ["*", "*"], u: ["__", "__"] }[ev.key.toLowerCase()];
      if (!pair) return;
      ev.preventDefault();
      if (ta.selectionStart !== ta.selectionEnd) wrapSel(pair[0], pair[1]);
      else toggleAtCursor(pair[0], pair[1]);
    });
    // the "*** ahead" check keeps ⌘I usable inside bold: a lone * or the *** of
    // italic-then-bold closers counts as an italic closer; a bare ** does not.
    function toggleAtCursor(pre, post) {
      const s = ta.selectionStart, v = ta.value;
      const closerAhead = v.slice(s, s + post.length) === post
        && (post !== "*" || v.slice(s, s + 2) !== "**" || v.slice(s, s + 3) === "***");
      if (closerAhead) {
        if (v.slice(Math.max(0, s - pre.length), s) === pre) {
          // nothing was typed between the markers — remove the empty pair instead of leaving ****
          ta.value = v.slice(0, s - pre.length) + v.slice(s + post.length);
          ta.setSelectionRange(s - pre.length, s - pre.length);
        } else {
          ta.setSelectionRange(s + post.length, s + post.length); // step out of the style
        }
      } else {
        ta.value = v.slice(0, s) + pre + post + v.slice(s);
        ta.setSelectionRange(s + pre.length, s + pre.length); // type straight into the style
      }
      text = ta.value;
      saveBtn.disabled = !text.trim();
      ta.focus();
      updateBar();
    }

    // ---- format bar: line ops (• ⇥ ⇤) while just typing, span ops (B I U M R L)
    // once text is selected — the row swaps contents rather than growing ----
    const fmtBar = el("div", { class: "fmt-bar" });
    // once the bar has appeared it stays put for the life of the composer: hiding it on
    // blur reflows the sheet, and the height jump made it easy to tap the backdrop by
    // accident and trip the discard prompt. it still swaps line-ops <-> span-ops.
    // span ops belong to a live selection in *this* field, so the swap keys off focus too:
    // a blurred textarea keeps its selectionStart/End, which used to leave B I U showing
    // over nothing selected.
    const updateBar = () => {
      const focused = document.activeElement === ta;
      const hasSel = focused && ta.selectionStart !== ta.selectionEnd;
      fmtBar.classList.toggle("has-sel", hasSel);
      if (focused || hasSel) barShown = true;
      fmtBar.classList.toggle("show", barShown);
    };
    // selectionchange is the only event that fires for BOTH making and clearing a selection:
    // `select` fires only when text becomes selected — never when it collapses — and on iOS
    // the tap that dismisses a selection is swallowed by the callout/handles, so no pointerup
    // reaches the textarea either. that's the row getting stuck on the wrong ops. bound on
    // the element (newer engines) and on the document (Safari's long-standing path).
    ta.addEventListener("selectionchange", updateBar);
    bindFmtSelectionSync(updateBar);
    ["keyup", "pointerup", "input", "focus", "blur"].forEach(evt => ta.addEventListener(evt, updateBar));

    // markers have to hug the words they style, one line at a time — that's what makes the
    // difference between a style that renders and one that shows its asterisks. a selection
    // dragged to the end of a line carries the newline with it (and iOS loves to hand back a
    // trailing space), so whitespace at either edge stays *outside* the pair, and a selection
    // spanning lines gets its own pair per line rather than one straddling the break.
    const LINE_RUN = /[^\n]+/g;
    // [, lead, core, trail] — a line's indent and its bullet marker count as lead, so
    // styling a run of bullets styles the words and leaves the • alone
    const runParts = r => /^(\s*(?:[-—] )?)([\s\S]*?)(\s*)$/.exec(r);
    // a line that is nothing but a photo marker is never styled: **![photo:id]** would be
    // eaten by the bold rule in RICH_RE (leftmost match wins, so the photo branch never runs)
    // and the picture would render as its raw marker instead.
    const PHOTO_RUN = /^\s*!\[photo:[a-z0-9]+(?:@(?:inline|1x|2x|3x))?\]\s*$/;
    function wrapSel(pre, post) {
      const s = ta.selectionStart, en = ta.selectionEnd;
      if (s === en) return;
      const v = ta.value, sel = v.slice(s, en);
      const pl = pre.length, ql = post.length;
      const runs = (sel.match(LINE_RUN) || []).filter(r => !PHOTO_RUN.test(r));
      const cores = runs.map(r => runParts(r)[2]).filter(Boolean);
      const wrapped = c => c.startsWith(pre) && c.endsWith(post) && c.length > pl + ql;
      let ns, ne;
      if (cores.length && cores.every(wrapped)) {
        // every styled line in the selection already carries the markers -> unwrap them all
        ta.value = v.slice(0, s) + sel.replace(LINE_RUN, r => {
          if (PHOTO_RUN.test(r)) return r;
          const m = runParts(r);
          return m[2] ? m[1] + m[2].slice(pl, m[2].length - ql) + m[3] : r;
        }) + v.slice(en);
        ns = s; ne = s + (en - s) - cores.length * (pl + ql);
      } else if (v.slice(Math.max(0, s - pl), s) === pre && v.slice(en, en + ql) === post) {
        // markers sit just outside the selection -> unwrap
        ta.value = v.slice(0, s - pl) + sel + v.slice(en + ql);
        ns = s - pl; ne = ns + sel.length;
      } else if (cores.length) {
        const out = sel.replace(LINE_RUN, r => {
          if (PHOTO_RUN.test(r)) return r;
          const m = runParts(r);
          return m[2] ? m[1] + pre + m[2] + post + m[3] : r;
        });
        ta.value = v.slice(0, s) + out + v.slice(en);
        ns = s; ne = s + out.length; // selection keeps the markers, so pressing again toggles off
      } else return; // whitespace-only selection: nothing to style
      text = ta.value;
      saveBtn.disabled = !text.trim();
      ta.focus();
      ta.setSelectionRange(ns, ne);
      updateBar();
    }

    // link: wrap the selection as [label](url). if the selection is itself a url, it
    // becomes a domain-labelled pill with no typing; otherwise prompt for the url and
    // keep the selected words as the label. either way the label stays editable in raw text.
    function linkSel() {
      const s = ta.selectionStart, en = ta.selectionEnd;
      if (s === en) return;
      const v = ta.value, sel = v.slice(s, en).trim();
      const looksUrl = /^(https?:\/\/\S+|www\.\S+|\S+\.[a-z]{2,}(\/\S*)?)$/i.test(sel);
      let url, label;
      if (looksUrl) {
        url = /^https?:\/\//i.test(sel) ? sel : "https://" + sel;
        label = domainOf(url);
      } else {
        let u = prompt("paste the link url");
        if (!u) return;
        u = u.trim();
        url = /^https?:\/\//i.test(u) ? u : "https://" + u;
        label = sel;
      }
      const md = "[" + label + "](" + url + ")";
      ta.value = v.slice(0, s) + md + v.slice(en);
      text = ta.value;
      saveBtn.disabled = !text.trim();
      ta.focus();
      ta.setSelectionRange(s + 1, s + 1 + label.length); // land on the label so it's easy to rename
      autoGrow();
      updateBar();
    }

    // every format-bar press commits on pointerdown. the press already has to preventDefault
    // to keep the field focused and the selection alive; a click arrives a beat later, by which
    // time the row may have swapped its contents out from under her finger — which is exactly
    // how a tap ends up doing nothing, or the wrong thing. same rule as the day strip.
    function fmtPress(b, run) {
      b.addEventListener("pointerdown", ev => {
        if (ev.button !== 0) return; // left/primary press only — a right-click isn't a format op
        ev.preventDefault();
        run();
      });
      return b;
    }

    // line ops act on the line the cursor sits in — no selection needed.
    // marker is captured (group 2) so continuation preserves "- " or "— " as typed.
    const BULLET_LINE = /^([ \t]*)([-—] )(.*)$/;
    function lineOp(transform) {
      const v = ta.value, s = ta.selectionStart;
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      let le = v.indexOf("\n", s); if (le === -1) le = v.length;
      const line = v.slice(ls, le);
      const nl = transform(line);
      if (nl !== line) {
        ta.value = v.slice(0, ls) + nl + v.slice(le);
        const pos = Math.min(Math.max(ls, s + nl.length - line.length), ls + nl.length);
        text = ta.value;
        saveBtn.disabled = !text.trim();
        ta.setSelectionRange(pos, pos);
        autoGrow();
      }
      ta.focus();
      updateBar();
    }
    [[BULLET_ICON, "Bullet", line => {
        const m = BULLET_LINE.exec(line);
        // a checklist counts as a bullet — toggling the dot returns it to plain text too
        return m ? m[1] + m[3].replace(CHECK_RE, "$2") : line.replace(/^([ \t]*)/, "$1- ");
      }],
     [CHECKBOX_ICON, "Checkbox", line => {
        // plain/bullet line -> "- [ ] "; an existing checklist item -> back to plain text
        const m = /^([ \t]*)(?:([-—] )(\[[ xX]\] ?)?)?([\s\S]*)$/.exec(line);
        return m[3] ? m[1] + m[4] : m[1] + "- [ ] " + m[4];
      }],
     [INDENT_ICON, "Indent", line => "  " + line],
     [OUTDENT_ICON, "Outdent", line => line.startsWith("  ") ? line.slice(2) : line.replace(/^[ \t]/, "")]
    ].forEach(([icon, label, transform]) => {
      const b = el("button", { class: "fmt-btn line-only", "aria-label": label });
      b.innerHTML = icon;
      fmtBar.appendChild(fmtPress(b, () => lineOp(transform)));
    });

    // fold: drop a "+++" cut on its own line. everything below it collapses in the card
    // behind a Read-more that floats the whole entry in a centred modal.
    function insertFold() {
      const v = ta.value, s = ta.selectionStart;
      let le = v.indexOf("\n", s); if (le === -1) le = v.length;
      const head = v.slice(0, le), tail = v.slice(le);
      const ins = "\n+++" + (tail.startsWith("\n") ? "" : "\n");
      ta.value = head + ins + tail;
      const pos = head.length + ins.length;
      ta.setSelectionRange(pos, pos);
      text = ta.value;
      saveBtn.disabled = !text.trim();
      autoGrow();
      ta.focus();
      updateBar();
    }
    const foldBtn = el("button", { class: "fmt-btn line-only", "aria-label": "Fold (read more)" });
    foldBtn.innerHTML = FOLD_ICON;
    fmtBar.appendChild(fmtPress(foldBtn, insertFold));

    // photo button: pick from disk / photo library — the same pipeline as ⌘V,
    // for the phone (and anyone who doesn't live on the clipboard)
    const imgInput = el("input", { type: "file", accept: "image/*", multiple: true, style: { display: "none" } });
    imgInput.addEventListener("change", () => {
      const files = imgInput.files ? [...imgInput.files] : [];
      imgInput.value = ""; // so the same photo can be picked again later
      if (files.length) insertImageFiles(files);
    });
    const imgBtn = el("button", { class: "fmt-btn line-only", "aria-label": "Add photo" });
    imgBtn.innerHTML = IMG_ICON;
    // deliberately NOT fmtPress: opening a file picker needs transient user activation, and
    // pointerdown only grants that for a mouse (on touch it's pointerup/touchend). committing
    // on pointerdown made the picker silently refuse to open on the phone. preventDefault still
    // keeps focus in the textarea, so the keyboard doesn't collapse and the click lands here.
    imgBtn.addEventListener("pointerdown", ev => ev.preventDefault());
    imgBtn.addEventListener("click", () => imgInput.click());
    fmtBar.appendChild(imgBtn);
    sheet.appendChild(imgInput);

    // enter continues the current line's structure: a bullet keeps its marker+indent, an
    // indented blockquote keeps its indent. an empty one of either ends it (drops the
    // marker/indent instead of carrying a dangling one to the next line).
    const INDENT_LINE = /^([ \t]+)(.*)$/;
    ta.addEventListener("keydown", ev => {
      if (ev.key !== "Enter" || ta.selectionStart !== ta.selectionEnd) return;
      const v = ta.value, s = ta.selectionStart;
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      let le = v.indexOf("\n", s); if (le === -1) le = v.length;
      const line = v.slice(ls, le);
      const bm = BULLET_LINE.exec(line);
      const cm = bm ? CHECK_RE.exec(bm[3]) : null; // a checklist item continues as a fresh unchecked box
      const im = bm ? null : INDENT_LINE.exec(line);
      let carry, rest;
      if (cm) { carry = bm[1] + "- [ ] "; rest = cm[2]; }
      else if (bm) { carry = bm[1] + bm[2]; rest = bm[3]; }
      else if (im && (im[1].length >= 2 || im[1].includes("\t"))) { carry = im[1]; rest = im[2]; }
      else return; // ordinary line: let Enter do its normal thing
      ev.preventDefault();
      if (!rest.trim()) {
        ta.value = v.slice(0, ls) + v.slice(le); // empty bullet/quote: end it, don't carry the marker
        ta.setSelectionRange(ls, ls);
      } else {
        const ins = "\n" + carry; // continue with the same marker/indent
        ta.value = v.slice(0, s) + ins + v.slice(s);
        ta.setSelectionRange(s + ins.length, s + ins.length);
      }
      text = ta.value;
      saveBtn.disabled = !text.trim();
      autoGrow();
    });

    // backspace while the cursor sits inside a line's leading indent clears one whole level
    // (a 2-space unit, or a tab) in a single press — so the blockquote she just made comes
    // off as easily as it went on, matching the outdent button. mid-text backspace is
    // untouched: this only fires when everything from line-start to the cursor is whitespace.
    ta.addEventListener("keydown", ev => {
      if (ev.key !== "Backspace" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
      if (ta.selectionStart !== ta.selectionEnd) return;
      const v = ta.value, s = ta.selectionStart;
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const before = v.slice(ls, s);
      if (!before || !/^[ \t]+$/.test(before)) return; // cursor must be within the leading indent
      ev.preventDefault();
      const unit = before[0] === "\t" ? 1 : Math.min(2, before.length); // one level = 2 spaces (or a tab)
      ta.value = v.slice(0, ls) + v.slice(ls + unit);
      const ns = s - unit;
      ta.setSelectionRange(ns, ns);
      text = ta.value;
      saveBtn.disabled = !text.trim();
      autoGrow();
      updateBar();
    });

    [["B", "**", "**", "fmt-b"], ["I", "*", "*", "fmt-i"], ["U", "__", "__", "fmt-u"],
     ["M", "`", "`", "fmt-m"], ["R", "||", "||", "fmt-r"]].forEach(([label, pre, post, cls]) => {
      const b = el("button", { class: "fmt-btn sel-only " + cls }, label);
      fmtBar.appendChild(fmtPress(b, () => wrapSel(pre, post)));
    });
    fmtBar.appendChild(fmtPress(el("button", { class: "fmt-btn sel-only fmt-l" }, "L"), linkSel));
    sheet.appendChild(fmtBar);

    // ---- segmentation offer: appears once the ramble is long enough (and a key exists) ----
    const segOffer = segState && segState.busy
      ? el("p", { class: "seg-offer pending" }, "finding the seams…")
      : el("button", { class: "seg-offer", onclick: runSegmentation }, "break into deposits");
    sheet.appendChild(segOffer);
    if (segErr && !(segState && segState.busy)) sheet.appendChild(el("p", { class: "seg-note" }, segErr));
    updateSegOffer();
    function updateSegOffer() {
      const lines = text.split("\n").filter(l => l.trim()).length;
      const long = lines >= SEGMENT_MIN_LINES || wordCount(plainText(text, "x")) >= SEGMENT_MIN_WORDS;
      segOffer.style.display = (apiKey && long) ? "" : "none";
    }
    ta.addEventListener("input", updateSegOffer);

    async function runSegmentation() {
      if (segState) return;
      segErr = null; segState = { busy: true }; build();
      try {
        const ranges = await segmentRamble(text);
        if (ranges.length < 2) throw new Error("only one thought found");
        segState = { ranges }; segTagOpen = -1;
      } catch (err) {
        console.warn("segmentation failed", err);
        segState = null;
        segErr = "couldn't find clean seams — try again";
      }
      build();
    }

    // ---- topics ----
    sheet.appendChild(el("p", { class: "field-label" }, "topic"));
    const topicChips = el("div", { class: "chips" });
    for (const t of TOPICS) {
      const on = tags.includes(t.id);
      const chip = el("button", {
        class: "chip",
        style: on
          ? { background: t.bg, color: t.fg, borderColor: t.dot, fontWeight: "600" }
          : {},
        onclick: () => { toggleTag(t.id); build(); }
      }, t.label);
      topicChips.appendChild(chip);
    }
    sheet.appendChild(topicChips);

    // ---- modes ----
    sheet.appendChild(el("p", { class: "field-label" }, "mode"));
    const modeChips = el("div", { class: "chips" });
    for (const m of MODES) {
      const chip = el("button", {
        class: "chip mode" + (tags.includes(m.id) ? " on" : ""),
        onclick: () => { toggleTag(m.id); build(); }
      }, m.label);
      modeChips.appendChild(chip);
    }
    sheet.appendChild(modeChips);

    if (existing && existing.sourceId) {
      // this deposit was cut from a longer ramble — the untouched original is two taps away
      const src = entries.find(e => e.id === existing.sourceId);
      if (src) {
        sheet.appendChild(el("button", {
          class: "back-link",
          style: { display: "block", marginTop: "18px" },
          onclick: () => {
            if (isDirty()) confirmAction("Discard your changes to this entry?", "Discard", () => openRambleView(src));
            else openRambleView(src);
          }
        }, "view the full ramble"));
      }
    }

    if (existing) {
      // lock guards against accidental deletion: delete only shows while unlocked.
      // the lock state itself saves with Save, like every other field.
      sheet.appendChild(el("button", {
        class: "lock-btn",
        onclick: () => { locked = !locked; build(); }
      }, locked ? "Unlock entry" : "Lock entry"));
      if (!locked) {
        sheet.appendChild(el("button", {
          class: "delete-btn",
          onclick: () => {
            tombstoneEntry(existing.id); // so the deletion syncs to the cloud, not just locally
            entries = entries.filter(e => e.id !== existing.id);
            saveEntries(entries);
            close();
            render();
          }
        }, "Delete entry"));
      }
    }

    // preview of the proposed cuts: entry-like blocks, each with its suggested topic
    // pill (tap to retag) and a JOIN control on every divider to merge neighbours.
    function buildSegPreview() {
      const ranges = segState.ranges;
      sheet.appendChild(el("p", { class: "seg-note", style: { margin: "2px 0 12px" } },
        "your words, cut apart — nothing rewritten"));
      const card = el("div", { class: "group-card seg-list" });
      ranges.forEach((rg, i) => {
        if (i) {
          const join = el("div", { class: "seg-join" });
          join.appendChild(el("button", {
            onclick: () => {
              ranges[i - 1].end = rg.end;
              if (!ranges[i - 1].topic) ranges[i - 1].topic = rg.topic;
              ranges.splice(i, 1);
              if (ranges.length < 2) { segState = null; segErr = null; } // merged back into one — plain composer returns
              segTagOpen = -1;
              build();
            }
          }, "join"));
          card.appendChild(join);
        }
        const block = el("div", { class: "seg-block" });
        const p = el("p");
        p.appendChild(renderRichBlocks(text.slice(rg.start, rg.end).trim(), images));
        block.appendChild(p);
        const meta = el("div", { class: "entry-meta" });
        const tt = topicById[rg.topic];
        meta.appendChild(el("button", {
          class: "pill" + (tt ? "" : " mode"),
          style: tt ? { background: tt.bg, color: tt.fg } : {},
          onclick: () => { segTagOpen = segTagOpen === i ? -1 : i; build(); }
        }, tt ? tt.label : "untagged"));
        block.appendChild(meta);
        if (segTagOpen === i) {
          const chips = el("div", { class: "chips", style: { marginTop: "10px" } });
          for (const t of TOPICS) {
            const on = rg.topic === t.id;
            chips.appendChild(el("button", {
              class: "chip",
              style: on ? { background: t.bg, color: t.fg, borderColor: t.dot, fontWeight: "600" } : {},
              onclick: () => { rg.topic = on ? null : t.id; segTagOpen = -1; build(); }
            }, t.label));
          }
          block.appendChild(chips);
        }
        card.appendChild(block);
      });
      sheet.appendChild(card);
      sheet.appendChild(el("button", {
        class: "back-link",
        onclick: () => { segState = null; segErr = null; segTagOpen = -1; build(); }
      }, "keep as one entry"));
    }
  }

  function toggleTag(id) {
    tags = tags.includes(id) ? tags.filter(t => t !== id) : [...tags, id];
  }

  build();
  sheetRoot.appendChild(overlay);
  // unfold from the compose bar: clip the sheet to that grey rectangle's real measured box,
  // then release it so the clip opens outward into the full sheet. two frames because the
  // folded state has to be painted before the transition has anything to travel from.
  const barEl = document.querySelector(".compose-bar");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (barEl && !still) {
    const b = barEl.getBoundingClientRect(), s = sheet.getBoundingClientRect();
    const inset = v => Math.max(0, Math.round(v)) + "px";
    sheet.style.setProperty("--mt", inset(b.top - s.top));
    sheet.style.setProperty("--mr", inset(s.right - b.right));
    sheet.style.setProperty("--mb", inset(s.bottom - b.bottom));
    sheet.style.setProperty("--ml", inset(b.left - s.left));
    document.body.classList.add("composing"); // the list shrinks + fades as this unfolds
    sheet.classList.add("folded", "no-anim");
    void sheet.offsetHeight;              // paint the folded rectangle with transitions off
    sheet.classList.remove("no-anim");
    void sheet.offsetHeight;              // transition armed, style unchanged
    // ...and open out. rAF alone can be throttled (a backgrounded tab never paints), which
    // would strand the composer as a grey bar — so a timer races it, whichever lands first.
    const release = () => sheet.classList.remove("folded");
    requestAnimationFrame(release);
    setTimeout(release, 70);
  }
  setTimeout(() => {
    const ta = sheet.querySelector("textarea");
    if (ta && !existing) ta.focus();
  }, still ? 120 : 520); // let the unfold land before the keyboard comes up
}

// read-only view of the original ramble a deposit was cut from. restoring swaps the
// deposits back out for the single original entry — they're all verbatim slices of it,
// so only edits made to the deposits afterwards would be lost, hence the confirm.
function openRambleView(src) {
  sheetRoot.innerHTML = "";
  lockPageScroll();
  const overlay = el("div", { class: "overlay", onclick: close });
  const sheet = el("div", { class: "sheet", onclick: e => e.stopPropagation() });
  overlay.appendChild(sheet);
  function close() { sheetRoot.innerHTML = ""; unlockPageScroll(); }

  sheet.appendChild(el("div", { class: "grabber" }));
  const head = el("div", { class: "sheet-head" });
  head.appendChild(el("span", { class: "title" }, "Full ramble"));
  sheet.appendChild(head);

  const segs = entries.filter(e => e.sourceId === src.id);
  const d = entryDay(src);
  sheet.appendChild(el("p", { class: "seg-note", style: { margin: "0 0 12px" } },
    "kept as written · "
    + (src.week == null
      ? monthLabel(src.year, src.month)
      : (d == null ? "" : DAY_TOKENS[d] + ", ") + "W" + pad2(src.week))
    + " · now " + segs.length + " deposits"));

  const body = el("p", { class: "ramble-text" });
  body.appendChild(renderRichBlocks(src.text, src.images));
  sheet.appendChild(body);

  sheet.appendChild(el("button", {
    class: "delete-btn",
    onclick: () => confirmAction(
      "Restore the full ramble? Its " + segs.length + " deposits will be replaced by the original entry.",
      "Restore",
      () => {
        segs.forEach(sg => tombstoneEntry(sg.id)); // so the removals sync, not just locally
        entries = entries
          .filter(e => e.sourceId !== src.id)
          .map(e => e.id === src.id ? { ...e, segmented: false, updatedAt: new Date().toISOString() } : e);
        saveEntries(entries);
        close();
        render();
      })
  }, "Restore as one entry"));

  sheetRoot.appendChild(overlay);
}

// ---------- calendar picker ----------
// week view: long-press the W## label. month view: tap the month label.
// tap a week row = jump to that week (week view); tap the month title = jump to that month (month view).
function openCalendar() {
  let cm;
  if (view === "week") {
    const mon = mondayOfISOWeek(wk.year, wk.week);
    const thu = new Date(mon);
    thu.setUTCDate(mon.getUTCDate() + 3);
    cm = { year: thu.getUTCFullYear(), month: thu.getUTCMonth() };
  } else {
    cm = { ...mo };
  }

  sheetRoot.innerHTML = ""; // never stack a second sheet
  const overlay = el("div", { class: "overlay", onclick: dismiss });
  const sheet = el("div", { class: "sheet", onclick: e => e.stopPropagation() });
  overlay.appendChild(sheet);
  function close() { sheetRoot.innerHTML = ""; }
  // month view: browsing to another month and tapping away lands the view there —
  // no need to also hit the title. week view keeps its no-op dismiss.
  function dismiss() {
    if (view === "month" && (cm.year !== mo.year || cm.month !== mo.month)) {
      mo = { ...cm }; close(); render(); return;
    }
    close();
  }

  function build() {
    sheet.innerHTML = "";
    sheet.appendChild(el("div", { class: "grabber" }));

    sheet.appendChild(el("div", { class: "cal-head" },
      el("button", { class: "stepper-btn", onclick: () => { cm = stepMonth(cm, -1); build(); } }, "‹"),
      el("button", {
        class: "cal-title",
        onclick: () => { mo = { ...cm }; view = "month"; close(); render(); }
      }, monthLabel(cm.year, cm.month)),
      el("button", { class: "stepper-btn", onclick: () => { cm = stepMonth(cm, 1); build(); } }, "›")
    ));

    const dow = el("div", { class: "cal-row cal-dow" }, el("span", { class: "cal-wk" }, ""));
    DAY_TOKENS.forEach(t => dow.appendChild(el("span", null, t)));
    sheet.appendChild(dow);

    // the whole row commits, on click: this sheet closes and re-renders the list beneath
    // it, so a pointerdown commit would let the trailing click land on an entry.
    for (const { iso, days } of monthGridRows(cm.year, cm.month)) {
      const current = view === "week" && iso.year === wk.year && iso.week === wk.week;
      const row = el("div", {
        class: "cal-row wk-row" + (current ? " current" : ""),
        onclick: () => { wk = iso; view = "week"; close(); render(); }
      });
      row.appendChild(el("span", { class: "cal-wk" }, "W" + pad2(iso.week)));
      for (const d of days) {
        const cls = [d.getUTCMonth() !== cm.month ? "cal-out" : "", isTodayCell(d) ? "cal-today" : ""].filter(Boolean).join(" ");
        row.appendChild(el("span", cls ? { class: cls } : null, String(d.getUTCDate())));
      }
      sheet.appendChild(row);
    }
  }

  build();
  sheetRoot.appendChild(overlay);
}

// period tabs: tapping the OTHER one switches view; tapping the one you're already in
// opens the picker. that's the whole of period navigation on plain taps — no long-press to
// discover, and no separate calendar button competing for space in the dock.
let titleLongFired = false; // set by the settings long-press below, so it can swallow this tap
function periodTap(target) {
  if (titleLongFired) { titleLongFired = false; return; }
  if (view !== target) { view = target; render(); return; }
  openCalendar();
}
navWeek.addEventListener("click", () => periodTap("week"));
navMonth.addEventListener("click", () => periodTap("month"));
[navWeek, navMonth].forEach(b => b.addEventListener("contextmenu", e => e.preventDefault()));

// ---------- pinch to zoom the list ----------
// pinch out (fingers apart) = full text; pinch in = compact view with summaries.
// only active on the list itself — ignored while any sheet is open.
(() => {
  let startDist = null;
  const dist = touches => Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
  document.addEventListener("touchstart", ev => {
    if (ev.touches.length === 2 && !sheetRoot.childElementCount) startDist = dist(ev.touches);
  }, { passive: true });
  document.addEventListener("touchmove", ev => {
    if (ev.touches.length !== 2 || startDist == null) return;
    ev.preventDefault();
    const ratio = dist(ev.touches) / startDist;
    if (ratio < 0.75 && !compactView) {
      compactView = true;
      startDist = dist(ev.touches); // re-baseline so the same gesture doesn't flap
      render();
    } else if (ratio > 1.33 && compactView) {
      compactView = false;
      startDist = dist(ev.touches);
      render();
    }
  }, { passive: false });
  ["touchend", "touchcancel"].forEach(evt =>
    document.addEventListener(evt, () => { startDist = null; }));
})();

// ---------- weekly summary block ----------
const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';
const WAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>';

// which bucket the current summary falls in: MINE (hand-written), or V1/V2… (AI takes).
// legacy records predate origin/version — treat them as the first AI take.
function summaryPill(rec) {
  if (!rec) return "";
  return rec.origin === "mine" ? "MINE" : "V" + (rec.version || 1);
}

// the hand-write invite only wakes at the week's own sunday 10:00 (local time) — a
// sunday-morning reflection ritual. (the AI path no longer waits for sunday: the wand
// shows as soon as 3 days are filled, and generates only on an explicit tap+confirm.)
function weekSummaryUnlocked(year, week) {
  const mon = mondayOfISOWeek(year, week);
  const sun = new Date(mon);
  sun.setUTCDate(mon.getUTCDate() + 6); // Mon + 6 = Sun (last day of the ISO week)
  const unlockAt = new Date(sun.getUTCFullYear(), sun.getUTCMonth(), sun.getUTCDate(), 10, 0, 0, 0);
  return new Date() >= unlockAt;
}

function weekSummaryBlock(list) {
  const k = weekKey(wk.year, wk.week);
  const rec = weekSummaries[k];
  const filledDays = new Set(list.map(entryDay).filter(d => d != null)).size;

  if (!rec) {
    // a requested summary is on its way — hold the pending line
    if (weekSumInFlight.has(k)) {
      const wrap = el("div", { class: "wsum" });
      wrap.appendChild(el("p", { class: "wsum-text pending" }, "Summarizing the week…"));
      return wrap;
    }
    // 3+ days filled and a key set → the magic wand appears where the collapsed eye
    // usually sits. tapping it asks first; nothing generates on its own anymore.
    if (filledDays >= 3 && apiKey) {
      const wrap = el("div", { class: "wsum collapsed" });
      const wand = el("button", { class: "wsum-eye wsum-wand", "aria-label": "Summarize this week" });
      wand.innerHTML = WAND_ICON;
      wand.addEventListener("click", () => {
        confirmAction("Create a summary of this week?", "Summarize", () => {
          showWeekSummary = true; // she asked for it — make sure it isn't hidden when it lands
          try { localStorage.setItem(SHOW_WSUM_KEY, "1"); } catch (e) {}
          generateWeekSummary(wk.year, wk.week, list);
          render(); // shows the pending line while the summary is written
        });
      });
      wrap.appendChild(wand);
      return wrap;
    }
    // no wand (no key / fewer than 3 days) → offer to hand-write one (saves as MINE),
    // but only once the week has reached its sunday 10am. before that the whole surface
    // stays dormant (no invite, no eye). suppressed when hidden too.
    if (!showWeekSummary || !weekSummaryUnlocked(wk.year, wk.week)) return null;
    const wrap = el("div", { class: "wsum" });
    wrap.appendChild(el("button", {
      class: "wsum-add",
      onclick: () => openWeekSummaryEditor(wk.year, wk.week, list)
    }, "+ write a summary"));
    return wrap;
  }

  const wrap = el("div", { class: "wsum" + (showWeekSummary ? "" : " collapsed") });
  const eye = el("button", { class: "wsum-eye", "aria-label": "Toggle week summary" });
  eye.innerHTML = showWeekSummary ? EYE_ON : EYE_OFF;
  eye.addEventListener("click", () => {
    showWeekSummary = !showWeekSummary;
    try { localStorage.setItem(SHOW_WSUM_KEY, showWeekSummary ? "1" : "0"); } catch (e) {}
    render();
  });
  wrap.appendChild(eye);

  if (showWeekSummary) {
    // a quiet wand to summon the reveal again — the reading, not just the line
    const replay = el("button", { class: "wsum-replay", "aria-label": "Replay this week's reveal",
      onclick: () => openWeekReveal(wk.year, wk.week, list) });
    replay.innerHTML = WAND_ICON;
    wrap.appendChild(replay);

    const open = () => openWeekSummaryEditor(wk.year, wk.week, list);
    // every take the week has: V1…Vn then MINE. active pill opens the editor,
    // any other pill switches the week to that take (and the choice persists/syncs).
    const slots = { ...(weekSummaryVersions[k] || {}) };
    slots[summarySlot(rec)] = rec;
    const ids = Object.keys(slots).sort((a, b) =>
      ((a === "mine") - (b === "mine")) || (parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10)));
    const cur = summarySlot(rec);
    for (const id of ids) {
      const on = id === cur;
      wrap.appendChild(el("span", {
        class: "wsum-pill" + (on && ids.length > 1 ? " on" : ""),
        onclick: on ? open : () => switchWeekSummary(k, slots[id])
      }, id === "mine" ? "MINE" : id.toUpperCase()));
    }
    wrap.appendChild(el("p", { class: "wsum-text", onclick: open }, sentenceCase(rec.text)));
  }
  return wrap;
}

// bring an earlier take back: it becomes the week's current record with a fresh
// updatedAt, so the choice both survives reloads and wins last-write-wins in sync
function switchWeekSummary(k, target) {
  const cur = weekSummaries[k];
  if (cur) (weekSummaryVersions[k] = weekSummaryVersions[k] || {})[summarySlot(cur)] = cur;
  weekSummaries[k] = { ...target, updatedAt: new Date().toISOString() };
  saveWeekSummaries();
  render();
}

function openWeekSummaryEditor(year, week, list) {
  const k = weekKey(year, week);
  sheetRoot.innerHTML = "";
  const overlay = el("div", { class: "overlay", onclick: () => sheetRoot.innerHTML = "" });
  const sheet = el("div", { class: "sheet", onclick: e => e.stopPropagation() });
  overlay.appendChild(sheet);

  sheet.appendChild(el("div", { class: "grabber" }));
  const pill = el("span", { class: "wsum-pill", style: { cursor: "default", margin: "0" } });
  const refreshPill = () => {
    const p = summaryPill(weekSummaries[k]);
    pill.textContent = p;
    pill.style.display = p ? "inline-block" : "none";
  };
  const saveBtn = el("button", {
    class: "save",
    onclick: () => {
      const v = ta.value.trim();
      if (v) {
        const prev = weekSummaries[k];
        const nowIso = new Date().toISOString();
        // editing an existing take keeps its bucket (V1 stays V1); a fresh write is MINE
        weekSummaries[k] = prev
          ? { ...prev, text: v, edited: true, updatedAt: nowIso }
          : { text: v, createdAt: nowIso, updatedAt: nowIso, edited: true, origin: "mine" };
      } else {
        tombstoneSummary(k);     // sync the clear, not just locally
        delete weekSummaries[k]; // cleared = forget it; a fresh one generates on next render
        delete weekSummaryVersions[k]; // start over means the back-catalogue goes too
        saveWeekSummaryVersions();
      }
      saveWeekSummaries();
      sheetRoot.innerHTML = "";
      render();
    }
  }, "Save");
  sheet.appendChild(el("div", { class: "sheet-head" },
    pill, el("span", { class: "title" }, "Week summary"), saveBtn));

  const ta = el("textarea", { rows: "5", placeholder: "this week, in your words…" });
  ta.value = sentenceCase((weekSummaries[k] || {}).text || "");
  sheet.appendChild(ta);
  refreshPill();

  if (apiKey) {
    const resum = el("button", {
      class: "lock-btn",
      onclick: async () => {
        resum.disabled = true;
        resum.textContent = "summarizing…";
        await generateWeekSummary(year, week, list); // increments the version off the prior take
        resum.disabled = false;
        resum.textContent = "re-summarize";
        // a fresh take isn't just a new line — replay it Wrapped-style, the same reveal the
        // week's first reading gets. close the editor first so the deck isn't behind it.
        if (weekSummaries[k]) {
          sheetRoot.innerHTML = "";
          render();
          setTimeout(() => openWeekReveal(year, week, list), 80); // let the render settle first
        }
      }
    }, "re-summarize");
    sheet.appendChild(resum);
  }

  // explicit authorship: plain Save keeps the current take's provenance (a light edit of
  // V3 stays V3), so claiming a hand-written take is its own deliberate action. archives
  // the current AI take into the pill row and makes a distinct MINE the current one.
  const curRec = weekSummaries[k];
  if (curRec && curRec.origin !== "mine") {
    sheet.appendChild(el("button", {
      class: "lock-btn",
      onclick: () => {
        const v = ta.value.trim();
        if (!v) return;
        const nowIso = new Date().toISOString();
        (weekSummaryVersions[k] = weekSummaryVersions[k] || {})[summarySlot(curRec)] = curRec; // keep the AI take
        weekSummaries[k] = { text: v, createdAt: nowIso, updatedAt: nowIso, edited: true, origin: "mine" };
        saveWeekSummaries();
        sheetRoot.innerHTML = "";
        render();
      }
    }, "save as my own"));
  }

  sheetRoot.appendChild(overlay);
}

// ---------- monthly recap: the month, read back ----------
// one sonnet call reads the whole month and returns observation cards, each citing
// the entry ids it grew from. cards that can't cite don't survive — the app drops
// them before she ever sees one. verdicts (keep / let it go) are stored and fed to
// the next month's reading, so the AI learns what rings true. device-local for now
// (a recap is regenerable, so losing it costs one api call, not data).
const RECAP_KEY = "weekly-deposits-month-recaps";
const RECAP_MIN_ENTRIES = 5;
let monthRecaps = {};
try { monthRecaps = JSON.parse(localStorage.getItem(RECAP_KEY)) || {}; } catch (e) {}
// a month now holds TAKES (V1, V2… like the weekly pills) — normalize any recap
// saved under the original flat single-take shape
for (const [mk_, r_] of Object.entries(monthRecaps)) {
  if (r_ && r_.cards) monthRecaps[mk_] = {
    cur: 0,
    takes: [{ version: 1, cards: r_.cards, title: r_.title, verdicts: r_.verdicts || {}, createdAt: r_.createdAt }]
  };
}
function saveMonthRecaps() {
  try { localStorage.setItem(RECAP_KEY, JSON.stringify(monthRecaps)); } catch (e) {}
}
function currentRecapTake(rec) { return (rec && rec.takes && rec.takes[rec.cur]) || null; }
function monthKey(year, month) { return year + "-M" + pad2(month + 1); }
function monthNameOf(year, month) {
  return new Date(year, month, 1).toLocaleDateString("en-SG", { month: "long" });
}

// loading verbs, claude-code style — one at random while the month is being read
const LOADING_VERBS = ["Accomplishing","Actioning","Actualizing","Architecting","Baking","Beaming","Beboppin'","Befuddling","Billowing","Blanching","Bloviating","Boogieing","Boondoggling","Booping","Bootstrapping","Brewing","Burrowing","Calculating","Canoodling","Caramelizing","Cascading","Catapulting","Cerebrating","Channelling","Choreographing","Churning","Clauding","Coalescing","Cogitating","Composing","Computing","Concocting","Considering","Contemplating","Cooking","Crafting","Creating","Crystallizing","Cultivating","Crunching","Deciphering","Deliberating","Dilly-dallying","Discombobulating","Doodling","Drizzling","Ebbing","Effecting","Elucidating","Embellishing","Enchanting","Envisioning","Evaporating","Fermenting","Fiddle-faddling","Finagling","Flambéing","Flibbertigibbeting","Flowing","Flummoxing","Fluttering","Forging","Forming","Frosting","Frolicking","Gallivanting","Galloping","Garnishing","Generating","Germinating","Gitifying","Grooving","Gusting","Harmonizing","Hashing","Hatching","Herding","Hibernating","Honking","Hullaballooing","Hyperspacing","Ideating","Imagining","Improvising","Incubating","Inferring","Infusing","Ionizing","Jitterbugging","Julienning","Kneading","Leavening","Levitating","Lollygagging","Manifesting","Marinating","Meandering","Metamorphosing","Misting","Moonwalking","Moseying","Mulling","Mustering","Musing","Nebulizing","Nesting","Noodling","Nucleating","Orbiting","Orchestrating","Osmosing","Perambulating","Percolating","Perusing","Philosophising","Photosynthesizing","Pollinating","Pontificating","Pondering","Pouncing","Precipitating","Prestidigitating","Processing","Proofing","Propagating","Puttering","Puzzling","Quantumizing","Razzle-dazzling","Razzmatazzing","Recombobulating","Reticulating","Roosting","Ruminating","Sautéing","Scampering","Scheming","Schlepping","Scurrying","Seasoning","Shenaniganing","Shimmying","Simmering","Skedaddling","Sketching","Slithering","Smooshing","Sock-hopping","Spelunking","Spinning","Sprouting","Stewing","Sublimating","Sussing","Swirling","Swooping","Symbioting","Synthesizing","Tempering","Thinking","Thundering","Tinkering","Tomfoolering","Topsy-turvying","Transfiguring","Transmuting","Twisting","Undulating","Unfurling","Unravelling","Vibing","Waddling","Wandering","Warping","Whatchamacalliting","Whirlpooling","Whirring","Whisking","Wibbling","Working","Wrangling","Zesting","Zigzagging"];

// strict schema — the api guarantees the reply parses; grounding is still checked app-side
const RECAP_SCHEMA = {
  type: "object",
  properties: {
    cards: {
      type: "array",
      items: {
        type: "object",
        properties: {
          headline: { type: "string" },
          support: { type: "string" },
          evidence: { type: "array", items: { type: "string" } },
          earned: { type: "boolean" }
        },
        required: ["headline", "support", "evidence", "earned"],
        additionalProperties: false
      }
    },
    title: { type: "string" }
  },
  required: ["cards", "title"],
  additionalProperties: false
};

const RECAP_SYSTEM = "You are reading one month of Marilyn's personal journal entries to write her monthly recap: a handful of observations that show her the month's patterns — things she might not have noticed herself. Rules: 3 to 8 cards; a thin or scattered month earns fewer, and when no single thread runs through the month it is fine for the cards to be small specific moments instead of themes. Every card must be grounded in specific entries and cite 1-4 of their ids in evidence — an observation you cannot cite must not be written. headline is one short sentence, an observation rather than a statistic. support is 1-3 short lines expanding it; borrowing her own words is good. earned is true on at most 2 cards that deserve a moment of weight — a real shift, a milestone, something worth sitting with — and false on everything else. title is what the month would be called if it had a title: a short phrase (2-6 words) only this month could produce, defensible from the entries. Voice: plain, concrete, warm but dry, written in sentence case with normal capitalization. Never use: quietly, gently, softly, simply, truly, journey, chapter, embrace, whirlwind. No exclamation marks, no horoscope vagueness — name the actual things. When her past reactions are provided (kept, let go, rewrote, notes), her rewordings and notes are the standard to write toward — never repeat an observation she let go or rewrote.";

// one line per card she reacted to — verdicts, rewrites, and notes teach the next reading
function recapTakeLines(take, onlyReacted) {
  const out = [];
  (take.cards || []).forEach((cd, i) => {
    const v = (take.verdicts || {})[i];
    if (onlyReacted && !v && !cd.original && !cd.feedback) return;
    let line = cd.original
      ? '- "' + cd.original.headline + '" — she rewrote it to: "' + cd.headline + '"'
      : '- "' + cd.headline + '"';
    const notes = [];
    if (v === "keep") notes.push("kept");
    if (v === "letgo") notes.push("let go — this one missed");
    if (cd.feedback) notes.push("her note: " + cd.feedback);
    if (notes.length) line += " (" + notes.join("; ") + ")";
    out.push(line);
  });
  return out;
}

const recapInFlight = new Set();
async function startMonthRecap(year, month) {
  const k = monthKey(year, month);
  if (!apiKey || recapInFlight.has(k)) return;
  recapInFlight.add(k);
  if (view === "month") render(); // the "reading…" line appears
  try {
    const list = entriesForMonth(year, month);
    const lines = list.map(e => {
      const labels = e.tags.map(tg => (topicById[tg] || modeById[tg] || {}).label).filter(Boolean).join(", ");
      const when = e.week == null ? "month-wide"
        : (entryDay(e) != null && entryDateStr(e)) ? entryDateStr(e) : "W" + pad2(e.week);
      return e.id + " | " + when + " | " + (labels || "untagged") + " | " + plainText(e.text, "[…]");
    });
    // her hand-written week summaries are the purest voice reference available
    const mine = Object.values(weekSummaries)
      .filter(r => r.origin === "mine" && r.text).slice(-5).map(r => "- " + r.text);
    // her reactions teach the reading: last month's take, and — on a re-read —
    // every earlier take of this same month
    const pm = month === 0 ? { year: year - 1, month: 11 } : { year, month: month - 1 };
    const prevTake = currentRecapTake(monthRecaps[monthKey(pm.year, pm.month)]);
    let feedback = "";
    if (prevTake) {
      const pl = recapTakeLines(prevTake, true);
      if (pl.length) feedback += "\n\nLAST MONTH'S READING — HER REACTIONS:\n" + pl.join("\n");
    }
    const thisRec = monthRecaps[k];
    if (thisRec && thisRec.takes.length) {
      feedback += "\n\nTHIS IS A RE-READ. EARLIER READINGS OF THIS SAME MONTH:";
      thisRec.takes.forEach(t => {
        feedback += "\nV" + t.version + ":\n" + recapTakeLines(t, false).join("\n");
      });
      feedback += "\nWrite a genuinely fresh take — different angles, not the same cards reworded.";
    }
    const input = "THE MONTH: " + monthNameOf(year, month) + " " + year
      + "\n\nENTRIES (id | when | topics | text):\n" + lines.join("\n")
      + (mine.length ? "\n\nHER OWN WORDS, FOR VOICE (week summaries she wrote herself):\n" + mine.join("\n") : "")
      + feedback;

    const parsed = await anthropicJSON({
      model: "claude-sonnet-5", // reads a month better than haiku; one call a month, a few cents
      max_tokens: 6000, // headroom: sonnet 5 thinks before writing, and thinking counts against this
      output_config: { format: { type: "json_schema", schema: RECAP_SCHEMA } },
      system: RECAP_SYSTEM,
      messages: [{ role: "user", content: input }]
    });

    // grounding pass: evidence ids must resolve to real entries; snapshots of her words
    // are stored on the card so a later edit/delete never breaks a saved recap
    const byId = new Map(list.map(e => [e.id, e]));
    const cards = (parsed.cards || []).map(cd => ({
      headline: String(cd.headline || "").trim(),
      support: String(cd.support || "").trim(),
      earned: !!cd.earned,
      evidence: [...new Set(cd.evidence || [])].map(id => byId.get(id)).filter(Boolean)
        .map(e => ({ id: e.id, text: truncateWords(plainText(e.text, "▓▓▓"), 28) }))
    })).filter(cd => cd.headline && cd.evidence.length); // can't cite it → she never sees it
    let earnedCount = 0; // spectacle budget enforced here, not left to the model's enthusiasm
    for (const cd of cards) if (cd.earned && ++earnedCount > 2) cd.earned = false;
    if (!cards.length) throw new Error("no grounded cards");

    // a new reading never replaces an old one — it lands as the next take (V2, V3…)
    const rec = monthRecaps[k];
    const version = rec ? Math.max(...rec.takes.map(t => t.version || 1)) + 1 : 1;
    const take = { version, cards, title: String(parsed.title || "").trim(), createdAt: new Date().toISOString(), verdicts: {} };
    if (rec) { rec.takes.push(take); rec.cur = rec.takes.length - 1; }
    else monthRecaps[k] = { cur: 0, takes: [take] };
    saveMonthRecaps();
    if (view === "month" && mo.year === year && mo.month === month) openRecap(year, month);
  } catch (err) {
    console.warn("month recap failed", err); // wand returns on re-render; tap to retry
  } finally {
    recapInFlight.delete(k);
    if (view === "month" && mo.year === year && mo.month === month) render();
  }
}

// the wand row in month view — same collapsed-eye spot as the week wand.
// no recap yet: tap → confirm → generate. recap saved: tap → straight back in.
function monthRecapBlock(list) {
  const k = monthKey(mo.year, mo.month);
  const monthName = monthNameOf(mo.year, mo.month);
  if (recapInFlight.has(k)) {
    // claude-code style: a random loading verb, swapped every couple of seconds
    const wrap = el("div", { class: "wsum" });
    const p = el("p", { class: "wsum-text pending" });
    const tick = () => { p.textContent = LOADING_VERBS[Math.floor(Math.random() * LOADING_VERBS.length)] + "…"; };
    tick();
    const t = setInterval(() => { if (!p.isConnected) { clearInterval(t); return; } tick(); }, 2200);
    wrap.appendChild(p);
    return wrap;
  }
  const rec = currentRecapTake(monthRecaps[k]) ? monthRecaps[k] : null;
  if (!rec && !(apiKey && list.length >= RECAP_MIN_ENTRIES)) return null;
  const wrap = el("div", { class: "wsum collapsed" });
  const wand = el("button", { class: "wsum-eye wsum-wand", "aria-label": rec ? "Replay this month's reading" : "Read this month back" });
  wand.innerHTML = WAND_ICON;
  wand.addEventListener("click", () => {
