    f.style.setProperty("--w", (0.38 + share * 0.50).toFixed(2));
    heatEl.appendChild(f);
  });
}

let heatP = 0, heatRaf = 0, heatFallback = 0;
function setHeatP(p) {
  heatP = p;
  heatEl.style.setProperty("--p", p.toFixed(4));
}
// animate --p to a target and call done() on arrival. rAF rather than a CSS transition:
// a custom property can't interpolate without @property, and more to the point the scrub
// has to be able to reverse mid-flight, which a running transition would fight.
//
// A TIMER RACES THE rAF — same lesson the composer's unfold already learned. A hidden tab
// gets zero rAF callbacks, so if she pulls the chevron halfway and the phone locks (or she
// switches apps), the retreat animation never runs and she comes back to a half-bloomed
// screen stranded over her list with no way out. Timers still fire when hidden; whichever
// lands first settles it, and `settled` means done() runs exactly once either way.
function heatTo(target, ms, done) {
  cancelAnimationFrame(heatRaf);
  clearTimeout(heatFallback);
  const from = heatP, t0 = performance.now();
  const ease = x => 1 - Math.pow(1 - x, 3); // ease-out cubic, same family as the app's easing
  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    cancelAnimationFrame(heatRaf);
    clearTimeout(heatFallback);
    setHeatP(target);
    if (done) done();
  };
  const step = now => {
    const k = Math.min(1, (now - t0) / ms);
    if (k >= 1) { finish(); return; }
    setHeatP(from + (target - from) * ease(k));
    heatRaf = requestAnimationFrame(step);
  };
  heatRaf = requestAnimationFrame(step);
  heatFallback = setTimeout(finish, ms + 120);
}
function heatOpen(list) {
  buildHeatFields(list);
  heatEl.classList.add("live");
  setHeatP(0);
}
function heatClose() {
  cancelAnimationFrame(heatRaf);
  clearTimeout(heatFallback);
  heatEl.classList.remove("live");
  setHeatP(0);
  setThemeColor(THEME_BASE);
}

// once a node leaves the document, do something. Used for both handoffs below, so neither
// has to poll: the deck and the confirm box both just remove themselves when they're done.
function onGone(node, then) {
  const parent = node.parentNode;
  if (!parent) { then(); return; }
  const obs = new MutationObserver(() => {
    if (node.isConnected) return;
    obs.disconnect();
    then();
  });
  obs.observe(parent, { childList: true });
}

// commit: finish the bloom, then hand it to the deck.
// The bloom is NOT torn down when the deck opens — it BECOMES the deck's background and
// stays for its whole life. .recap is opaque `var(--canvas)`, so tearing the bloom down
// meant cutting from a screen full of her colours to a flat near-white one in a single
// frame. Now the thing the drag built is the sky she reads it under, and it only leaves
// when she does. (A deck opened any other way — the auto-reveal when a summary lands —
// never gets .on-heat, so it keeps its own stock blobs. No regression there.)
function heatCommit(action) {
  heatTo(1, Math.max(160, (1 - heatP) * 420), () => {
    // only once it's full — theme-color is a whole-OS repaint, not something to drive per frame
    setThemeColor(heatTopColor());
    // an exception in run() must not leave the screen bloomed with no deck and no way back:
    // the handoff is what retreats the bloom when nothing opens, so it has to run regardless
    if (action.kind === "open") {
      try { action.run(); } finally { heatHandOff(); }
      return;
    }
    // nothing written yet: the offer arrives ON the bloom, and backing out takes it away
    confirmAction(action.ask, action.ok, () => { action.run(); heatHandOff(); });
    const box = document.querySelector(".confirm-overlay");
    // the confirm mounts on document.body as .confirm-overlay — NOT in sheetRoot, and not
    // with the .overlay class the sheets use. Watch the real node, not a guess at it.
    if (box) onGone(box, () => {
      if (!document.querySelector(".recap") && heatP > 0) heatTo(0, 340, heatClose);
    });
  });
}
function heatHandOff() {
  const deck = document.querySelector(".recap");
  if (!deck) { heatTo(0, 340, heatClose); return; } // nothing opened (a generation started) — don't strand it
  deck.classList.add("on-heat");
  onGone(deck, () => heatTo(0, 520, heatClose));
}

// ---- the scrub ----------------------------------------------------------
let pull = null;
chevEl.addEventListener("pointerdown", ev => {
  if (!cueAction) return;
  ev.preventDefault();
  pull = { y0: ev.clientY, moved: 0, list: activeEntries(), action: cueAction };
  chevEl.classList.add("pulling");
  try { chevEl.setPointerCapture(ev.pointerId); } catch (e) {}
  heatOpen(pull.list);
});
chevEl.addEventListener("pointermove", ev => {
  if (!pull) return;
  const dy = ev.clientY - pull.y0;
  pull.moved = Math.max(pull.moved, Math.abs(dy));
  const p = Math.max(0, Math.min(1, dy / PULL_FULL));
  setHeatP(p);
  // the chevron IS the progress readout: it sinks with the pull and darkens as it commits
  chevEl.style.transform = "translateY(" + (p * 16).toFixed(1) + "px)";
  chevEl.style.color = p >= PULL_COMMIT ? "#6E6E73" : "#C4C4C9";
});
function endPull(ev, mayCommit) {
  if (!pull) return;
  const { action, moved } = pull;
  pull = null;
  chevEl.classList.remove("pulling");
  chevEl.style.transform = "";
  chevEl.style.color = "";
  try { chevEl.releasePointerCapture(ev.pointerId); } catch (e) {}
  if (!mayCommit) { heatTo(0, 260, heatClose); return; }
  // a tap is a drag that never went anywhere — it plays the whole thing rather than
  // doing nothing, so the control still works for anyone who doesn't discover the drag
  if (moved < 6) { heatCommit(action); return; }
  if (heatP >= PULL_COMMIT) heatCommit(action);
  else heatTo(0, 260, heatClose);
}
chevEl.addEventListener("pointerup", ev => endPull(ev, true));
// pointercancel is NOT a quiet pointerup and must never commit. It fires when the system
// takes the gesture away — an edge-swipe back, a notification, the browser deciding this
// was a scroll after all — and she never let go of anything. Sharing the release path meant
// a stolen gesture past the threshold opened the wrapped on its own. It always retreats,
// which also guarantees no half-bloomed screen is left stranded over the list.
chevEl.addEventListener("pointercancel", ev => endPull(ev, false));

// ---- fade the cue out as the list scrolls under the header ----
// continuous, not a class toggle: it should melt as she scrolls, not blink off at a line.
function syncCueFade(y) {
  cueEl.style.setProperty("--cue-o", String(Math.max(0, 1 - y / 64)));
  cueEl.style.pointerEvents = y > 56 ? "none" : "";
}

// ---------- header hides on scroll down, returns on scroll up ----------
const headerEl = document.querySelector(".header");
let headerLastY = window.scrollY, headerHidden = false;
function setHeaderHidden(h) {
  if (headerHidden === h) return;
  headerHidden = h;
  headerEl.classList.toggle("hidden", h);
}
// on desktop the page doesn't scroll — .wrap does — so the cue's fade has to listen there
// too, or it stays at full opacity forever in the one layout where it never scrolls off.
wrapEl.addEventListener("scroll", () => syncCueFade(wrapEl.scrollTop), { passive: true });
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  syncCueFade(y);
  const dy = y - headerLastY;
  headerLastY = y;
  if (document.body.style.position === "fixed") return; // sheet open: the jump to 0 isn't a real scroll
  if (Math.abs(dy) > 240) return; // programmatic jump (sheet-close restore), not a finger
  if (y < 70) { setHeaderHidden(false); return; } // near the top the header always shows
  if (dy > 4) setHeaderHidden(true);
  else if (dy < -4) setHeaderHidden(false);
}, { passive: true });

// ---------- wiring ----------
// both live inside the compose bar, so both must stop the bar's own click
document.getElementById("composeAdd").addEventListener("click", ev => {
  ev.stopPropagation();
  openComposer(null);
});
document.getElementById("menuBtn").addEventListener("click", ev => {
  ev.stopPropagation();
  openMenu();
});
// the bar is a div (it holds a button), so give it the keyboard behaviour a button would have
fab.addEventListener("keydown", ev => {
  if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fab.click(); }
});
function stepPeriod(delta) {
  if (view === "week") wk = shiftWeek(wk.year, wk.week, delta);
  else mo = stepMonth(mo, delta);
  deskTopic = null; // a filter belongs to the period it was set in
  render();
}
document.getElementById("prevBtn").addEventListener("click", () => stepPeriod(-1));
document.getElementById("nextBtn").addEventListener("click", () => stepPeriod(1));

// ---------- keyboard (desktop) ----------
// deliberately small: step the period, write, search. everything else already has a
// visible control, and a shortcut nobody can see isn't a feature.
function typingTarget(t) {
  if (!t) return false;
  const tag = t.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || t.isContentEditable;
}
function anySheetOpen() {
  return sheetRoot.childElementCount > 0 || !!document.querySelector(".read-back, .img-preview-back");
}
document.addEventListener("keydown", ev => {
  // the scope pull-down closes before anything else claims Escape
  if (ev.key === "Escape" && deskScopeOpen) { ev.stopPropagation(); deskScopeOpen = false; render(); return; }
  const meta = ev.metaKey || ev.ctrlKey;
  // ⌘K reaches search only when nothing is open over the list. With a sheet up the key
  // belongs to that sheet — the composer claims it for paste-a-link, and the search sheet IS
  // what this would have opened. Focusing the rail field behind an overlay was the bug.
  if (meta && (ev.key === "k" || ev.key === "K")) {
    if (anySheetOpen()) return;
    ev.preventDefault();
    if (deskMQ.matches && deskSearchInput) deskSearchInput.focus();
    else openMenu();
    return;
  }
  if (meta && (ev.key === "n" || ev.key === "N")) {
    if (anySheetOpen()) return;
    ev.preventDefault();
    openComposer(null);
    return;
  }
  if (meta || ev.altKey || typingTarget(ev.target) || anySheetOpen()) return;
  if (ev.key === "ArrowLeft") { ev.preventDefault(); stepPeriod(-1); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); stepPeriod(1); }
});

// ---------- boot ----------
// Opening IndexedDB is async, so the first render waits for it — a render against an empty
// list would flash an empty week and, worse, a save landing in that window would persist the
// emptiness over the real entries.
(async () => {
  onStoreError(showSaveAlert);
  try {
    await openStore();
  } catch (err) {
    // No IndexedDB (private mode, a locked-down browser). Fall back to the old localStorage
    // copy so the app still opens read-mostly, and say plainly that saves won't stick.
    console.error("deposits: indexeddb unavailable", err);
    try { entries = JSON.parse(localStorage.getItem("weekly-deposits-entries")) || []; } catch (e) { entries = []; }
    render();
    showSaveAlert(err);
    return;
  }

  const migration = await migrateFromLocalStorage().catch(err => {
    console.error("deposits: migration failed", err);
    return { ran: false, reason: "threw" };
  });
  if (migration.ran) {
    console.info(`deposits: moved ${migration.entries} entries and ${migration.photos} photos into IndexedDB, ` +
                 `freeing ~${Math.round(migration.freedBytes / 1024)}KB of localStorage`);
  }

  entries = await loadEntries();
  render();

  requestPersistence(); // ask Safari not to evict us after 7 idle days

  // restore any existing session and reconcile with the cloud (async; local render already happened)
  initSync();
})();

// A pending write must not die with the page. pagehide is the one event iOS reliably fires
// when an app is backgrounded or killed; visibilitychange covers the tab-switch case.
window.addEventListener("pagehide", () => { flushEntries(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) flushEntries(); });

// Module scope hides everything from the console, and we have been leaning on the console to
// diagnose exactly this kind of problem. One deliberate handle, rather than leaking the lot.
window.__deposits = {
  get entries() { return entries; },
  report: storageReport,
  imageBlob,
  flush: flushEntries,
  export: () => toMarkdown(activeEntries(), exportHeading()),
  cloud: cloudConfig,
  connect: cfg => { setCloudConfig(cfg); return cloudCheck(); },
  sync: async () => { await syncPull(); await pushEntriesNow(); render(); }
};
</script>
</body>
</html>
