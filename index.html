    margin: 0 0 8px; font-size: 13px; line-height: 1.55; color: #6B6B70;
    padding-left: 12px; border-left: 2px solid rgba(28,28,30,0.10);
  }
  .recap-verdicts { display: flex; gap: 8px; margin-top: 16px; }
  .recap-verdicts button {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase;
    padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(28,28,30,0.12);
    background: transparent; color: var(--subtle); transition: all 0.15s ease;
  }
  .recap-verdicts button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* dust catching sunlight — reserved for earned cards, never confetti */
  .recap-dust {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: rgba(28,28,30,0.35); pointer-events: none;
    animation: dust 1.9s ease-out forwards;
  }
  @keyframes dust {
    from { opacity: 0; }
    15%  { opacity: 1; }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)); }
  }

  /* ---------- weekly reveal: the monthly recap's lighter sibling ----------
     a polaroid developing in the hand, not a feature film. reuses the .recap shell
     with two quieter blobs and a handful of week-only faces. */
  .recap.week .recap-blob.b3 { display: none; }
  .recap.week .recap-blob { opacity: 0.42; }
  .wk-count {
    font-family: 'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;
    font-size: 88px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .wk-count-label {
    font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--subtle); margin-top: 10px;
  }
  .wk-days { display: flex; gap: 12px; margin-top: 34px; }
  .wk-days span {
    font-family: var(--mono); font-size: 14px; color: rgba(28,28,30,0.14);
    opacity: 0.55; transition: color 0.55s ease, opacity 0.55s ease;
  }
  .wk-days span.on { color: var(--ink); opacity: 1; }
  .wk-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
  .wk-chip {
    font-family: var(--mono); font-size: 13px; border-radius: 999px; padding: 8px 16px;
    animation: recapRise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .wk-chip.lead { font-size: 17px; padding: 11px 22px; }
  /* the keepable still — a quiet frame you'd want to screenshot */
  .wk-still {
    border-radius: 20px; padding: 26px 24px;
    background: rgba(255,255,255,0.55); border: 1px solid rgba(0,0,0,0.04);
    box-shadow: 0 12px 40px rgba(0,0,0,0.06);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .wk-still-num {
    font-family: 'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;
    font-size: 40px; line-height: 1; color: var(--ink); margin: 0;
  }
  .wk-still-range {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--subtle); margin: 6px 0 0;
  }
  .wk-still-stat { font-family: var(--mono); font-size: 12px; color: #55555A; margin: 16px 0 0; }
  .wk-still-dots { display: flex; gap: 6px; margin-top: 14px; }
  .wk-still-dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .wk-still-line {
    font-family: 'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;
    font-size: 19px; line-height: 1.4; color: var(--ink); margin: 16px 0 0;
  }

  .export-area {
    width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    background: var(--field); border: none; border-radius: 12px; padding: 12px;
    resize: none;
  }
  .export-note { font-size: 13px; color: var(--subtle); margin: 0 0 10px; }

  /* ============================================================================
     DESKTOP — icon rail · mat · topics
     ----------------------------------------------------------------------------
     Below the breakpoint .deck and .deck-main are `display: contents`: they leave
     the box tree entirely, so .wrap / .bottom-frost / .compose-dock lay out as the
     body children they used to be. Nothing above this block is touched.

     There is no window frame. The deck is a bare transparent grid; the one painted
     surface is the centre MAT, a rounded card floating on the canvas wash. Both
     rails sit directly on that wash and paint nothing of their own.

     Three greys, darkest outward: the wash the rails sit on, then the mat, then the
     white cards on top of it. On the phone the cards are white on grey and that
     reads; a white mat left them invisible, so the mat steps down to --mat and the
     wash steps down again below it. Every value stays in the --canvas family —
     lightness only, no hue introduced, and no text colour that mobile doesn't have.
     ============================================================================ */
  .deck, .deck-main { display: contents; }
  .rail { display: none; }

  @media (min-width: 1080px) {
    :root {
      --rail-i: 64px;    /* icon rail — one 38px glyph plus its gutters, at every state:
                            the hover label is a pill that overflows it, not a wider rail */
      --rail-t: 248px;   /* topics rail */
      --deck-x: 20px;    /* viewport inset */
      --deck-cap: 1400px;
      /* no vertical inset: the mat takes the deck's full height and only steps in from the
         rails. Compared with the 14px it had, floor-to-ceiling is the one that reads as a
         window — the inset just made the wash above and below look like a missed edge. */
      --mat-y: 0px; --mat-x: 12px;
      /* the middle grey. Far enough under #FFF that a card has an edge without the
         mat itself reading as a tinted panel. The frosts over it are tinted to match.
         Every value below is its first cut with 20% of its distance from #FFF taken
         back out — the three steps still read, they just sit closer together. */
      --mat: #F4F4F5;
      --mat-a: rgba(244,244,245,0.88);
      --mat-0: rgba(244,244,245,0);
    }
    html, body { height: 100%; overflow: hidden; }
    /* the wash, one step below the mat everywhere including its own highlights, so the
       rails always read as the deepest surface no matter which corner you look at */
    body {
      background:
        radial-gradient(115% 85% at 8% -8%,   #EEEEF0 0%, rgba(238,238,240,0) 60%),
        radial-gradient(95% 75%  at 96% 4%,   #EDEDEE 0%, rgba(237,237,238,0) 55%),
        radial-gradient(90% 75%  at 84% 108%, #DFDFE2 0%, rgba(223,223,226,0) 64%),
        radial-gradient(75% 65%  at -4% 96%,  #E3E3E6 0%, rgba(227,227,230,0) 60%),
        #E9E9EC;
    }

    /* the scroll affordance is the content moving; a grey bar in each pane is three
       vertical lines the design doesn't have anywhere else — and the centre one was
       stealing 15px off the reading column's right, knocking it off axis */
    .wrap, .rail-scroll { scrollbar-width: none; }
    .wrap::-webkit-scrollbar, .rail-scroll::-webkit-scrollbar { width: 0; height: 0; }

    .deck {
      display: grid;
      grid-template-columns: var(--rail-i) minmax(0, 1fr) var(--rail-t);
      /* the implicit row defaults to auto = max-content, which any tall rail blows
         straight past; pin it to the deck's own height so the panes scroll internally */
      grid-template-rows: minmax(0, 1fr);
      /* capped and centred rather than edge-to-edge: past the cap the extra width
         becomes field the mat floats on, instead of white margin growing around a
         fixed reading column — which is the problem the rails were meant to solve. */
      position: fixed; inset: var(--deck-x); z-index: 1;
      max-width: var(--deck-cap); margin: 0 auto;
      /* NO background, NO shadow, NO overflow clip. The deck is pure layout: the mat
         carries the elevation, and the icon rail has to be able to expand over it. */
      transform-origin: center center;
      transition: transform calc(0.62s * var(--unfold-k)) cubic-bezier(0.77, 0.006, 0.078, 1),
                  opacity calc(0.62s * var(--unfold-k)) cubic-bezier(0.77, 0.006, 0.078, 1);
    }
    /* everything recedes behind the composer together — mat and both rails */
    body.composing .deck { transform: scale(0.965); opacity: 0.4; }
    body.composing .wrap { transform: none; opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .deck { transition: none; } }

    /* ---- the mat: the one painted surface, floating on the wash ---- */
    .deck-main {
      display: block; position: relative; min-width: 0; min-height: 0;
      margin: var(--mat-y) var(--mat-x);
      background: var(--mat);
      border-radius: 24px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 6px 18px rgba(0,0,0,0.045),
                  0 24px 56px rgba(0,0,0,0.05);
    }
    /* the scroller. the page itself no longer scrolls, so the frost and the compose
       bar can be absolute siblings that simply don't move. */
    .wrap {
      position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
      max-width: none; margin: 0; padding: 0 24px 176px;
    }
    /* the reading column. 600 is the measure; the compose bar below matches it exactly so
       the bar's edges line up with the cards' — change one, change the other. */
    .wrap > .header, .wrapped-cue, #entriesRoot { max-width: 600px; margin: 0 auto; }
    .wrap > .header { padding: 34px 0 44px; }
    .wrap.has-cue > .header { padding-bottom: 10px; }
    /* the frost is tinted to the surface it sits on, or it reads as a band: on the phone
       that's the canvas, here it's the mat */
    .header, .header::after {
      background: var(--mat-a);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      backdrop-filter: blur(14px) saturate(150%);
    }
    .header.hidden { transform: none; } /* hide-on-scroll is a phone pattern */
    /* white, like the cards — --field is #F4F4F6 and the mat is #F4F4F5, i.e. the same
       colour, so anything --field that sits DIRECTLY on the mat disappears into it. The
       stepper arrows and the week summary's provenance pills are the two that do; every
       other --field surface lives inside a white card or sheet and is unaffected. */
    .stepper-btn {
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.035);
    }
    .wsum-pill:not(.on) { background: var(--card); }

    .bottom-frost, .compose-dock { position: absolute; }
    /* inside the mat there is nothing behind this worth seeing through — on the phone the
       0.94 base let the grey canvas glow through, here it just let entries peek out under
       the compose bar. Same recipe, opaque at the base. */
    .bottom-frost {
      height: 172px;
      background: linear-gradient(to top, var(--mat) 30%, var(--mat-a) 66%, var(--mat-0));
    }
    .compose-dock { left: 24px; right: 24px; max-width: 600px; padding: 0 0 22px; }
    /* the ⋮ menu held search, day view, export and settings — all four now have a visible
       home in the rails, so the button is a second route to nothing. + is the whole bar. */
    .compose-lozenge, .compose-divider { display: none; }

    /* ---- rails: no surface of their own, they sit straight on the wash ---- */
    .rail {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: none;
    }

    /* ---- left: the icon rail ----
       A column of glyphs on the wash. On hover (or when tabbed into) the row under the
       pointer names itself. The bar is ABSOLUTELY positioned so the name is an overlay,
       never a reflow — anything that widened in the grid would re-wrap every line of
       every entry as the pointer crossed it. */
    .rail-l { position: relative; overflow: visible; }
    /* No panel. The bar is just a column of glyphs on the wash; the row under the pointer
       names itself with a white pill beside the glyph, and nothing else moves. Opening a
       whole panel to answer one question meant four blank rows came along for the ride. */
    .iconbar {
      position: absolute; left: 0; top: var(--mat-y);
      width: var(--rail-i); z-index: 5;
      display: flex; flex-direction: column; gap: 2px;
      padding: 8px 0;
      overflow: visible;  /* the hovered label pill extends past the rail, over the mat */
    }
    /* the row never changes size or paints anything: it stays exactly the rail's width and
       lets the label pill overflow it to the right. Nothing reflows, and the pill's shadow
       isn't clipped the way an overflow:hidden lozenge would clip it. */
    .ico-row {
      /* 2px, not a gap: the pill reads as sitting against the circle. It can't be 0 —
         on an active row the circle is white too, and flush they merge back into the
         one-piece lozenge this replaced. */
      flex: none; display: flex; align-items: center; gap: 2px;
      width: var(--rail-i); padding: 0 13px; height: 42px;
      background: none; border: none; text-align: left;
      border-radius: 999px; overflow: visible; white-space: nowrap;
    }
    .ico-glyph {
      position: relative; flex: none;
      width: 38px; height: 38px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; line-height: 0;
      color: #B0B0B6;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .ico-glyph svg { width: 18px; height: 18px; }
    /* the label IS the pill: a white lozenge the height of the glyph's circle, cut to the
       length of the word. Decoration only — pointer-events off, so the 64px row stays the
       hit target and the pill never sits over the mat catching clicks meant for a card. */
    .ico-label {
      flex: none; white-space: nowrap;
      height: 38px; padding: 0 15px; border-radius: 999px;
      display: flex; align-items: center;
      font-size: 13px; color: var(--subtle);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0,0,0,0.035), 0 4px 14px rgba(0,0,0,0.06);
      pointer-events: none;
      /* 4px of travel, not 6: any further and the pill starts at rest *underneath* the
         circle it sits 2px from, and slides out over its edge */
      opacity: 0; transform: translateX(-4px);
      transition: opacity 0.16s ease,
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-reduced-motion: reduce) { .ico-label { transition: none; transform: none; } }
    .ico-row.on .ico-glyph {
      background: var(--card); color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
    }
    .ico-row.on .ico-label { color: var(--ink); font-weight: 600; }
    .ico-div { flex: none; height: 1px; margin: 7px 21px; background: var(--hairline); }
    /* sync state, on the control that already owns it — one route, state still visible */
    .ico-dot {
      position: absolute; top: 6px; right: 6px;
      width: 6px; height: 6px; border-radius: 50%;
      background: #CFCFD4; box-shadow: 0 0 0 2px var(--card);
    }
    .ico-dot.live { background: #55A862; }

    .ico-row:hover .ico-label, .ico-row:focus-visible .ico-label {
      opacity: 1; transform: none; transition-delay: 0.04s;
    }
    /* under the pointer the glyph takes a soft grey circle of its own; an active glyph keeps
       its white one — there's no white lozenge behind it any more to hide against */
    .ico-row:hover .ico-glyph, .ico-row:focus-visible .ico-glyph {
      color: var(--ink); background: rgba(0,0,0,0.05); box-shadow: none;
    }
    .ico-row.on:hover .ico-glyph, .ico-row.on:focus-visible .ico-glyph {
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
    }

    /* ---- right: topics ---- */
    .rail-r { padding: var(--mat-y) 0 16px; }
    .rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
    /* the room above TOPICS is the point: the search sits at the top edge, and the
       list starts well down the rail so it reads as its own thing, not a second row */
    .rail-r .rail-scroll { padding-top: 58px; }
    .rail-head {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--subtle);
      margin: 0 0 10px; padding: 0 22px;
    }

    .rail-row {
      display: flex; align-items: center; gap: 10px;
      width: 100%; text-align: left; background: none; border: none;
      padding: 7px 22px; font-family: var(--font); font-size: 13px;
      color: var(--subtle); line-height: 1.3;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .rail-row .rr-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rail-row .rr-count { flex: none; margin-left: auto; font-family: var(--mono); font-size: 11px; color: #C2C2C7; }
    .rail-row.on { color: var(--ink); font-weight: 600; }
    .rail-row.on .rr-count { color: var(--ink); }
    /* the topic pill, truncating rather than pushing the count off the rail */
    .rail-row > .pill { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* a filter is on: the chosen pill keeps its colour, the rest step back */
    .rail-scroll:has(.rail-row.on) .rail-row:not(.on) > .pill { opacity: 0.45; }
    .rail-row > .pill { transition: opacity 0.18s ease; }
    .rr-mark { flex: none; width: 5px; height: 5px; border-radius: 50%; background: #D4D4D9; }

    .rail-search {
      display: flex; align-items: center; gap: 8px;
      margin: 0 14px; padding: 9px 12px;
      /* on the wash rather than on a panel, so it needs its own lift to read as a field */
      background: rgba(255,255,255,0.72); border-radius: 12px;
      color: var(--subtle);
      transition: background 0.15s ease;
    }
    .rail-search svg { width: 14px; height: 14px; flex: none; }
    .rail-search input {
      flex: 1; min-width: 0; border: none; outline: none; background: none;
      font-family: var(--font); font-size: 13px; color: var(--ink);
    }
    /* ghost input: reads as label until she's in it */
    .rail-search input::placeholder { color: var(--subtle); }
    .rail-search:focus-within { background: rgba(255,255,255,0.95); }
    /* the scope flips week → month → all. It names itself in the app's own tokens (W31 / 7月)
       rather than in words, so it reads as the same object as the header's identity. */
    .rail-scope {
      flex: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.5px;
      background: rgba(0,0,0,0.055); border: none; border-radius: 999px;
      padding: 3px 7px; color: var(--subtle); line-height: 1.35;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .rail-scope:active { transform: scale(0.96); }
    .rail-scope.open { background: var(--ink); color: #fff; }

    /* the pull-down. grid-template-rows 0fr→1fr is the one way to transition to a content
       height without measuring it, so TOPICS below is pushed down by the real height of the
       list rather than by a guessed max-height that would ease at the wrong rate. */
    .rail-scope-wrap {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rail-scope-wrap.open { grid-template-rows: 1fr; }
    .rail-scope-inner { overflow: hidden; min-height: 0; }
    .rail-scope-list { padding: 6px 14px 0; }
    .rail-scope-opt {
      display: flex; align-items: center; gap: 8px;
      width: 100%; text-align: left; background: none; border: none;
      padding: 7px 8px; border-radius: 10px;
      font-family: var(--font); font-size: 13px; color: var(--subtle);
      /* the rows arrive a beat after the box starts opening, so it reads as unfolding
         rather than as a block appearing at full strength */
      opacity: 0; transform: translateY(-4px);
      transition: opacity 0.28s ease 0.08s, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) 0.08s,
                  background 0.15s ease, color 0.15s ease;
    }
    .rail-scope-wrap.open .rail-scope-opt { opacity: 1; transform: none; }
    .rail-scope-opt .so-key {
      flex: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.5px;
      min-width: 34px; color: #C2C2C7;
    }
    .rail-scope-opt.on { color: var(--ink); font-weight: 600; }
    .rail-scope-opt.on .so-key { color: var(--ink); }
    @media (prefers-reduced-motion: reduce) {

    }

    /* ---- hover, finally: the invisible interface has something to be invisible in ---- */
    @media (hover: hover) {
      .rail-row:hover { color: var(--ink); background: rgba(0,0,0,0.028); }
      .rail-scope:hover { color: var(--ink); background: rgba(0,0,0,0.085); }
      .rail-scope.open:hover { color: #fff; background: var(--ink); }
      .rail-scope-opt:hover { color: var(--ink); background: rgba(0,0,0,0.032); }
      .entry:hover { background: rgba(0,0,0,0.016); }
      .stepper-btn:hover { background: #EAEAED; color: var(--ink); }
      .compose-bar:hover { background: #E4E4E7; }
      .compose-icon:hover, .compose-lozenge:hover { background: rgba(0,0,0,0.05); }
      .compose-icon:hover { color: var(--ink); }
    }
    .entry { transition: background 0.15s ease; }

    /* ---- composer ----
       The sheet is a VIEWPORT-level overlay but the compose bar now lives in the mat,
       which is off-centre (64px rail one side, 248px the other). Pad the overlay by the
       real gutters so `justify-content: center` lands the sheet on the mat's axis —
       otherwise the unfold opens lopsided. --deck-x here is the deck's own left edge,
       which is the inset until the cap kicks in and starts centring it. */
    .overlay {
      --gutter: max(var(--deck-x), (100vw - var(--deck-cap)) / 2);
      padding-left: calc(var(--gutter) + var(--rail-i));
      padding-right: calc(var(--gutter) + var(--rail-t));
      padding-bottom: calc(var(--deck-x) + var(--mat-y));
    }
    /* wider than the 600px compose bar ON PURPOSE. The unfold clips the sheet to the bar's
       measured rect, and inset() can't go negative — a bar wider than the sheet clamps
       --ml/--mr to 0 and the box only opens vertically. 680 leaves 40px of travel a side. */
    .sheet { border-radius: 20px; max-width: 680px; }
    .sheet.expanse {
      /* top and bottom both land on the mat's edges. --sheet-ceil is redefined rather than just
         max-height, so the 85% default is 85% of THIS ceiling — otherwise the desktop deck would
         size itself off the phone's safe-area formula and land somewhere arbitrary. Desktop had
         the same no-headroom problem in miniature: 828px default against an 860px cap. */
      --sheet-ceil: calc(100dvh - (var(--deck-x) + var(--mat-y)) * 2);
      max-height: var(--sheet-ceil);
      clip-path: inset(0 round 20px);
    }
    /* No keyboard-docked pill on desktop: there is no soft keyboard to dock to (SOFT_KB gates
       --kb/--kbr off entirely, so they are permanently 0), and the composer here is a centred
       window rather than a phone sheet. Straight back to the in-flow row it has always been —
       the pill's own chrome is unwound too, so the buttons get their grey chips back instead of
       floating on a white capsule that would now be sitting on white. The bar is also RE-HOMED
       in the DOM at this breakpoint (see attachFmtBar): in-flow means it has to be inside the
       sheet, not parked in sheetRoot. */
    .fmt-bar {
      position: static; z-index: auto; bottom: auto;
      padding: 0; pointer-events: auto; transition: none;
      margin: 2px 0 6px;
    }
    .fmt-bar-pill {
      background: none; box-shadow: none; border: none; border-radius: 0;
      padding: 0; gap: 8px; width: 100%; overflow: visible;
    }
    .fmt-btn { flex: 1; width: auto; height: 31px; background: var(--field); border-radius: 999px; }
    /* and no clearance to reserve, since nothing is floating over the content any more */
    .sheet.expanse.has-fmt { padding-bottom: calc(env(safe-area-inset-bottom) + 28px + var(--kb) + var(--kbr)); }
    .sheet { scrollbar-width: none; }
    .sheet::-webkit-scrollbar { width: 0; height: 0; }
    .sheet.expanse.folded { clip-path: inset(var(--mt) var(--mr) var(--mb) var(--ml) round 18px); }
    .sheet.expanse textarea.ta-entry { min-height: calc(var(--sheet-h, var(--sheet-default)) - 250px); }
  }

  /* between the phone column and the three-pane window, just let the column breathe */
  @media (min-width: 700px) and (max-width: 1079px) {
    .wrap { max-width: 600px; }
    .compose-dock { max-width: 600px; }
  }

<body>
<!-- the deck is `display: contents` below the desktop breakpoint, so on a phone this markup
     lays out exactly as it did when .wrap, .bottom-frost and .compose-dock were body children.
     At >=1080px it becomes the floating window: rail / entries / rail. -->
<div class="deck">
  <aside class="rail rail-l" id="railL" aria-label="Periods"></aside>

  <div class="deck-main">
    <div class="wrap">
      <div class="header">
        <div class="header-top">
          <div class="stepper-center" id="periodLabel"></div>
        </div>
        <div class="period-row">
          <button class="stepper-btn" id="prevBtn">&lsaquo;</button>
          <div class="period-nav">
            <button class="period-tab" id="navWeek" aria-label="Week view"></button>
            <span class="period-sep">/</span>
            <button class="period-tab" id="navMonth" aria-label="Month view"></button>
          </div>
          <button class="stepper-btn" id="nextBtn">&rsaquo;</button>
        </div>
      </div>

      <!-- the door to the wrapped. Deliberately OUTSIDE .header: the header is sticky and
           this must not be — it scrolls away with the list and fades as it goes. -->
      <div class="wrapped-cue" id="wrappedCue" hidden>
        <button class="wc-chev" id="wcChev" aria-label="Open the wrapped">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>
      </div>

      <div id="entriesRoot"></div>
    </div>

    <div class="bottom-frost"></div>
    <div class="compose-dock" id="dock">
      <div class="compose-bar" id="fab" role="button" tabindex="0" aria-label="New entry">
        <span class="compose-hint shimmer">Start typing&#8230;</span>
        <span class="compose-actions">
          <button class="compose-icon" id="composeAdd" aria-label="New entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
          <span class="compose-divider"></span>
          <button class="compose-lozenge" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
        </span>
      </div>
    </div>
  </div>

  <aside class="rail rail-r" id="railR" aria-label="Topics"></aside>
</div>
<!-- the heat bloom: the transition INTO the wrapped, scrubbed by the chevron's drag.
     One element, one --p from 0 to 1; the fields are built per period from her topics. -->
<div class="heat" id="heat" aria-hidden="true"><div class="heat-wash"></div></div>
<div id="satProbe" aria-hidden="true"></div>
<div id="sheetRoot"></div>

<script>
"use strict";

// The status bar's height in real pixels. The page paints under it (black-translucent), so
// anything that measures against the viewport has to subtract it — window.innerHeight now
// INCLUDES the strip. Read off a probe because env() doesn't survive into JS; see #satProbe.
const satProbeEl = document.getElementById("satProbe");
function safeTop() { return parseFloat(getComputedStyle(satProbeEl).paddingTop) || 0; }

// ---------- taxonomy ----------
// bg/fg/dot are the pills as they appear in the list. `heat` is the same topic turned up
// for the wrapped bloom — see HARMONY below for why it isn't just `dot` at more saturation.
const TOPICS = [
  { id: "work", label: "work", bg: "#E3EDFB", fg: "#2B5FA8", dot: "#4A82D0", heat: "#70A6F2" },
  { id: "eats", label: "notable eats", bg: "#FBEBDD", fg: "#A85B22", dot: "#D98B4A", heat: "#E78B39" },
  { id: "health", label: "health & fitness", bg: "#E2F2E4", fg: "#2E7D3A", dot: "#55A862", heat: "#41C25D" },
  { id: "watched", label: "watched/watching", bg: "#EEE7F9", fg: "#6C46A8", dot: "#9670D4", heat: "#B38EF2" },
  { id: "internet", label: "internet things", bg: "#DFF2F2", fg: "#1F7A7A", dot: "#48A8A8", heat: "#41B9B9" },
  { id: "shopping", label: "shopping", bg: "#FBE5EE", fg: "#B03A6B", dot: "#D8699A", heat: "#F471AC" },
  { id: "relationship", label: "relationships", bg: "#FBE3E1", fg: "#B0403A", dot: "#D8706A", heat: "#F37C75" },
  { id: "home", label: "home", bg: "#F2ECDF", fg: "#8A6D2F", dot: "#B39554", heat: "#C89E3A" },
  { id: "listening", label: "listening to", bg: "#E5E7FB", fg: "#4A50A8", dot: "#7B80D4", heat: "#959BF2" },
  { id: "discovered", label: "discovered ✨", bg: "#FFF6D9", fg: "#9C7A00", dot: "#E8C24A", heat: "#C2A13A" },
  { id: "lookgood", label: "look good feel good", bg: "#F7E6F4", fg: "#9A3E8C", dot: "#C86EB8", heat: "#F361DD" },
];
// HARMONY — how the `heat` column was derived, so it can be re-derived rather than re-guessed.
// Each topic's `dot` was read in OKLCH, its HUE kept, and lightness + chroma replaced with one
// shared rule: L = 0.72 for every topic, and chroma at 85% of that hue's own maximum in sRGB.
//   Same L is what makes eleven colours read as one family instead of eleven decisions.
//   Same %-of-max chroma (not same absolute chroma) is what makes them equally VIVID: the
//   sRGB ceiling is 0.265 at magenta and 0.123 at teal, so one flat number would have left
//   the teal muted and clipped the magenta.
// The source dots were all over the place — L 0.605 (work) to 0.826 (discovered) — which is
// why "just saturate the dots" would have produced a bloom with holes in it.
// Two notes for anyone changing this: `discovered` and `home` land 5° apart in hue and are
// indistinguishable once blurred (harmless — they blend), and the fields paint with
// mix-blend-mode: multiply, so overlaps deepen like ink rather than washing out to grey.
const MODES = [
  { id: "remember", label: "i want to remember" },
  { id: "rundown", label: "weekly rundown" },
  { id: "learned", label: "what i've learned" },
];
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const modeById = Object.fromEntries(MODES.map(m => [m.id, m]));

const DAY_TOKENS = ["M", "T\u00B9", "W", "T\u00B2", "F", "S\u00B9", "S\u00B2"];

// ---------- date helpers (ISO week) ----------
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return { year: d.getUTCFullYear(), week };
}
function mondayOfISOWeek(year, week) {
  const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
  const dow = simple.getUTCDay();
  const monday = new Date(simple);
  if (dow <= 4) monday.setUTCDate(simple.getUTCDate() - simple.getUTCDay() + 1);
  else monday.setUTCDate(simple.getUTCDate() + 8 - simple.getUTCDay());
  return monday;
}
function weekRangeLabel(year, week) {
  const mon = mondayOfISOWeek(year, week);
  const sun = new Date(mon);
  sun.setUTCDate(mon.getUTCDate() + 6);
  const fmt = d => d.toLocaleDateString("en-SG", { day: "numeric", month: "short", timeZone: "UTC" });
  return fmt(mon) + " \u2013 " + fmt(sun);
}
function shiftWeek(year, week, delta) {
  const mon = mondayOfISOWeek(year, week);
  mon.setUTCDate(mon.getUTCDate() + delta * 7);
  return getISOWeek(new Date(mon.getUTCFullYear(), mon.getUTCMonth(), mon.getUTCDate()));
}
function monthLabel(year, month) {
  return new Date(year, month, 1).toLocaleDateString("en-SG", { month: "long", year: "numeric" });
}
function stepMonth(m, delta) { // {year, month} ± n months, rolling the year over
  const n = m.month + delta;
  return { year: m.year + Math.floor(n / 12), month: ((n % 12) + 12) % 12 };
}
// the rows a month's calendar grid shows: each is an ISO week plus the seven UTC dates
// under it (the first and last rows spill into the neighbouring months). shared by the
// composer's week popover and the calendar sheet — they render and bind differently, but
// this arithmetic has to agree, so it lives in one place.
function monthGridRows(year, month) {
  const lastDay = new Date(Date.UTC(year, month + 1, 0));
  const first = new Date(Date.UTC(year, month, 1));
  const start = new Date(first);
  start.setUTCDate(first.getUTCDate() - ((first.getUTCDay() + 6) % 7)); // back to Monday
  const rows = [];
  for (let mon = new Date(start); mon <= lastDay; mon.setUTCDate(mon.getUTCDate() + 7)) {
    const rowMon = new Date(mon);
    const iso = getISOWeek(new Date(rowMon.getUTCFullYear(), rowMon.getUTCMonth(), rowMon.getUTCDate()));
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(rowMon);
      d.setUTCDate(rowMon.getUTCDate() + i);
      days.push(d);
    }
    rows.push({ iso, days });
  }
  return rows;
}
// grid cells are UTC dates; "today" is local — compare the parts, not the timestamps
function isTodayCell(d) {
  const t = new Date();
  return d.getUTCFullYear() === t.getFullYear()
    && d.getUTCMonth() === t.getMonth()
    && d.getUTCDate() === t.getDate();
}
function pad2(n) { return String(n).padStart(2, "0"); }
function weekdayIndex(date) { return (date.getDay() + 6) % 7; } // Mon=0 … Sun=6
function entryDay(e) {
  if (e.day === undefined) return weekdayIndex(new Date(e.createdAt)); // legacy entries
  return e.day; // may be null = no day chosen
}
// ascending-order day key: no-day entries go to the very end (daySortKey's -1 only lands
// last when sorting descending)
function dayAsc(e) { const d = entryDay(e); return d == null ? 99 : d; }
function daySortKey(e) {
  const d = entryDay(e);
  return d == null ? -1 : d; // sorted descending, so no-day entries land last
}
// actual calendar date of an entry's chosen day, as DD/MM (month view shows it beside the day token)
function entryDateStr(e) {
  const d = entryDay(e);
  if (d == null || e.year == null || e.week == null) return null;
  const dt = mondayOfISOWeek(e.year, e.week);
  dt.setUTCDate(dt.getUTCDate() + d);
  return pad2(dt.getUTCDate()) + "/" + pad2(dt.getUTCMonth() + 1);
}
function entryStamp(e) {
  return Date.parse(e.updatedAt || e.createdAt);
}

// ---------- storage ----------
const STORE_KEY = "weekly-deposits-entries";
let memoryFallback = null;
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    memoryFallback = memoryFallback || [];
    return memoryFallback;
  }
}
function saveEntries(list) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
  } catch (e) {
    memoryFallback = list;
  }
  if (typeof tombstones === "object") { // a live entry supersedes any prior delete of the same id
    let touched = false;
    for (const e of list) if (tombstones[e.id]) { delete tombstones[e.id]; touched = true; }
    if (touched) saveTombstones();
  }
  if (typeof syncPushEntries === "function") syncPushEntries(); // best-effort cloud push
}

// ---------- state ----------
const now = new Date();
let entries = loadEntries();
let view = "week";
let wk = getISOWeek(now);
let mo = { year: now.getFullYear(), month: now.getMonth() };
const currentWk = getISOWeek(now);
let compactView = false; // pinch out on the list -> long entries collapse to summaries

// ---------- summaries (zoomed-out view) ----------
// Entries over SUMMARY_MIN_WORDS get a short LLM summary, generated once in the
// background (on save, or backfilled from settings / on pinch) and cached on the
// entry. No key or no summary yet -> compact view falls back to first-words
// truncation. Key is user-supplied, stored only in this device's localStorage.
const API_KEY_KEY = "weekly-deposits-anthropic-key";
const SUMMARY_MIN_WORDS = 20;

// A ramble this long grows a quiet "break into deposits" offer in the composer.
// Segmentation cuts the entry into separate deposits at AI-found seams — the model
// only returns verbatim anchors, the app does the cutting, so the text is never
// rewritten. Needs the API key, like the week summary.
const SEGMENT_MIN_LINES = 6;
const SEGMENT_MIN_WORDS = 80;
let apiKey = null;
try { apiKey = localStorage.getItem(API_KEY_KEY) || null; } catch (e) {}

function wordCount(t) { return t.trim().split(/\s+/).length; }
function truncateWords(t, n) { return t.trim().split(/\s+/).slice(0, n).join(" "); }
// capitalizes the first letter of each sentence — display-only, never mutates stored text
function sentenceCase(s) { return s.replace(/(^\s*\S|[.!?]\s+\S)/g, c => c.toUpperCase()); }

// ---------- inline formatting (Bear-style: raw markers while editing, rendered in cards) ----------
// dialect: [label](url) **bold** *italic* __underline__ `mono` ||redact|| ![photo:id]
// deliberately NO tilde rule — ~text~ renders literally (she likes her curly hyphens).
// link is first so its brackets/parens aren't mis-parsed by the emphasis rules.
// a photo marker may carry an optional display size (![photo:id@2x]); no suffix = full-width (3x).
// bold/underline/redact may run across line breaks — but not across a blank line, so one
// unclosed marker can't swallow the paragraphs after it. italic is the fussy one: a lone *
// is also a plain typographic character, so it only opens on a non-space, never closes on a
// space, never eats the ** of a neighbouring bold marker, and stays on one line. without
// those guards a stray "3 * 4" earlier in an entry silently ate the next **bold**.
const RICH_RE = /\[([^\]]+)\]\(([^)\s]+)\)|\*\*((?:[^\n]|\n(?!\s*\n))+?)\*\*|\*(?![\s*])([^*\n]*?[^\s*])\*(?!\*)|__((?:[^\n]|\n(?!\s*\n))+?)__|`([^`\n]+?)`|\|\|([\s\S]+?)\|\||!\[photo:([a-z0-9]+)(?:@(inline|1x|2x|3x))?\]/g;

// pasted images live out-of-band on the entry (entry.images = { id: dataURL }) so the
// raw-text editor shows a short marker instead of a thousand base64 characters.
const IMG_MARK_RE = /!\[photo:([a-z0-9]+)(?:@(?:inline|1x|2x|3x))?\]/g;
const IMG_SIZES = ["inline", "1x", "2x", "3x"]; // 3x = full-width block (the default)
const IMG_MAX_DIM = 1100, IMG_QUALITY = 0.82;

// keep only the images the text still references — pasted-then-deleted ones don't persist
function imagesUsedIn(text, images) {
  const out = {};
  if (!images) return out;
  let m;
  IMG_MARK_RE.lastIndex = 0;
  while ((m = IMG_MARK_RE.exec(text))) if (images[m[1]]) out[m[1]] = images[m[1]];
  return out;
}

// downscale + recompress a pasted image so entries stay small enough for localStorage/sync
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, IMG_MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); // jpeg has no alpha channel
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", IMG_QUALITY));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image decode failed")); };
    img.src = url;
  });
}

// derive a compact display domain from a url (drops scheme, www, and path)
function domainOf(u) {
  try { return new URL(u).hostname.replace(/^www\./, ""); }
  catch (e) { return u.replace(/^https?:\/\//, "").replace(/^www\./, "").split("/")[0]; }
}

// flatten markers to plain text. redactedAs replaces redacted content ("keep" preserves it) —
// so truncation shows ▓▓▓ and the summarizer never sees redacted content at all. links flatten
// to their label so search/summaries see the readable text, never the raw url.
// redaction is masked in a pre-pass so ||…|| nested inside bold/italic (or spanning lines,
// which the per-rule regex can't reach) never leaks through to the summarizer either.
function plainText(t, redactedAs) {
  if (redactedAs !== "keep") t = t.replace(/\|\|[\s\S]+?\|\|/g, () => redactedAs);
  return t.replace(IMG_MARK_RE, "")
    .replace(/^[ \t]*[-+]{3,}[ \t]*$/gm, "")          // "---" dividers and "+++" fold markers
    .replace(/^[ \t]*[-—] (?:\[[ xX]\] ?)?/gm, "")    // bullet + optional checkbox prefix
    .replace(RICH_RE, (m0, linkLabel, linkUrl, b, i, u, mono, red, img) => {
    if (linkLabel != null) return linkLabel;
    if (red != null) return redactedAs === "keep" ? red : redactedAs;
    if (img != null) return "";
    if (mono != null) return mono; // mono is literal — its content is not re-parsed
    // bold/italic/underline can nest — flatten the inside too so no *markers* leak into
    // summaries/search. safe with the shared global RICH_RE: String.replace finishes
    // collecting matches before any callback runs, so this re-entry can't disturb it.
    return plainText(b != null ? b : i != null ? i : u, redactedAs);
  });
}

// a photo marker hugged by style markers (**![photo:id]**) can't render — the bold rule wins
// the leftmost match and swallows it. wrapSel no longer creates these, but entries styled
// before that fix still carry them, so shed the wrapper here rather than lose the picture.
const PHOTO_WRAPPED_RE = /(\*\*|__|\*|`)(!\[photo:[a-z0-9]+(?:@(?:inline|1x|2x|3x))?\])\1/g;
function unwrapPhotoMarkers(t) { return t.replace(PHOTO_WRAPPED_RE, "$2"); }

// bold / italic / underline recurse into their own content, so *italic* inside **bold**
// (and any other combination the markers allow) renders as both, not as one style wrapping
// the other's literal asterisks. a PRIVATE matcher is essential: renderRich drives a manual
// exec loop, and recursing on the shared global RICH_RE mid-loop would clobber its lastIndex
// and drop the rest of the outer text. mono/redaction/links stay literal — no recursion.
function renderRich(text, images, onResize) {
  text = unwrapPhotoMarkers(text);
  const frag = document.createDocumentFragment();
  const re = new RegExp(RICH_RE.source, "g");
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1] != null) {
      const a = el("a", {
        class: "rt-link", href: m[2], target: "_blank", rel: "noopener noreferrer",
        onclick: ev => ev.stopPropagation() // navigate, but don't also open the composer
      });
      a.innerHTML = LINK_ICON;
      a.appendChild(document.createTextNode(m[1]));
      frag.appendChild(a);
    }
    else if (m[3] != null) frag.appendChild(el("span", { class: "rt-b" }, renderRich(m[3], images, onResize)));
    else if (m[4] != null) frag.appendChild(el("span", { class: "rt-i" }, renderRich(m[4], images, onResize)));
    else if (m[5] != null) frag.appendChild(el("span", { class: "rt-u" }, renderRich(m[5], images, onResize)));
    else if (m[6] != null) frag.appendChild(el("span", { class: "rt-m" }, m[6]));
    else if (m[8] != null) {
      const src = images && images[m[8]];
      // no stored data (e.g. synced before the cloud grew its images column): show the marker as-is
      if (src) {
        const size = m[9] || "3x";
        const img = el("img", { class: "rt-img" + (size === "3x" ? "" : " sz-" + size), src, alt: "photo" });
        attachImagePreview(img, src, m[8], size, onResize);
        frag.appendChild(img);
      } else frag.appendChild(document.createTextNode(m[0]));
    }
    else {
      const r = el("span", {
        class: "redacted",
        onclick: ev => { ev.stopPropagation(); r.classList.toggle("revealed"); } // reveal without opening the composer
      }, m[7]);
      frag.appendChild(r);
    }
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

// line-level pass over renderRich: "- " at line start renders as a bullet row (hanging
// indent via flex), leading two-space units as indentation, a lone "---" as a divider,
// a "- [ ] "/"- [x] " bullet as a tappable checklist item. entries with none of these
// take the plain renderRich path untouched, so nothing existing changes appearance.
// a line of 3+ hyphens on its own = a horizontal rule (Notion/Obsidian's "---"). the space
// after the first hyphen is what tells it apart from a "- " bullet, so no space here.
const HR_LINE_RE = /^[ \t]*-{3,}[ \t]*$/;
const FOLD_LINE_RE = /^[ \t]*\+{3,}[ \t]*$/m;        // the "read more" cut — handled by the card
                                                     // (m flag: entryEl execs it against the whole entry)
const CHECK_RE = /^\[([ xX])\] ?([\s\S]*)$/;          // a bullet's body when it's a checklist item
const PHOTO_ONLY_LINE_RE = /^[ \t]*!\[photo:[a-z0-9]+(?:@(?:inline|1x|2x|3x))?\][ \t]*$/; // a line that is just a photo
// just the tick — the filled box is the .rt-box.on container itself, so no inner rect
// (that "box in a box" read cluttered). iOS-clean: white checkmark on a solid fill.
const CHECK_ICON = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19.5 7"/></svg>';
// onCheck(lineIndex, nextChecked) — supplied only where a toggle should persist (the card,
// the read-more modal). left out of read-only previews, where the box renders but is inert.
function renderRichBlocks(text, images, onResize, onCheck) {
  const needsBlocks = /^[ \t]*[-—] |^(?: {2,}|\t)|^[ \t]*[-+]{3,}[ \t]*$/m.test(text)
    || /!\[photo:[a-z0-9]+(?:@(?:inline|1x|2x|3x))?\][ \t]*\n[ \t]*!\[photo:/.test(text); // a photo run
  if (!needsBlocks) return renderRich(text, images, onResize);
  const frag = document.createDocumentFragment();
  const lines = text.split("\n");
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    if (FOLD_LINE_RE.test(line)) continue;                        // the fold marker itself never shows
    if (HR_LINE_RE.test(line)) { frag.appendChild(el("hr", { class: "rt-hr" })); continue; }
    // photos added back to back gather into one row of rounded cards rather than stacking
    // full-width. consume the whole run here so each image isn't its own block.
    if (PHOTO_ONLY_LINE_RE.test(line)) {
      const run = [];
      while (li < lines.length && PHOTO_ONLY_LINE_RE.test(lines[li])) {
        run.push(lines[li].trim()); li++;
      }
      li--; // the for-loop's own increment steps past the last one
      if (run.length > 1) {
        // keyed by the run's own markers, so a pinch survives the re-render that follows
        // ticking a checkbox elsewhere in the entry
        const key = run.join("|");
        const gal = el("div", { class: "rt-gallery" + (stackedRuns.has(key) ? " stacked" : "") });
        for (const r of run) gal.appendChild(renderRich(r, images, onResize));
        attachGalleryPinch(gal, key);
        // the fades hang off a wrapper so they don't scroll away with the images
        const galWrap = el("div", { class: "rt-gal-wrap" }, gal);
        attachGalleryFade(galWrap, gal);
        attachGalleryDrag(gal);
        frag.appendChild(galWrap);
        continue;
      }
      frag.appendChild(el("div", { class: "rt-line" }, renderRich(run[0], images, onResize)));
      continue;
    }
    const m = /^([ \t]*)([-—] )?(.*)$/.exec(line);
    const ind = Math.floor(m[1].replace(/\t/g, "  ").length / 2);
    const check = m[2] ? CHECK_RE.exec(m[3]) : null;              // "[ ] label" inside a bullet
    // an indented line (that isn't a bullet) reads as a blockquote — a quiet left bar.
    // it's driven purely by the leading indent, so backspacing the indent away removes it.
    const quote = ind >= 1 && !m[2];
    const row = el("div", { class: "rt-line" + (m[2] ? " rt-bullet" : "") + (quote ? " rt-quote" : "")
      + (check ? " rt-check" + (/[xX]/.test(check[1]) ? " done" : "") : "") });
    if (ind) row.style.setProperty("--ind", ind);
    if (check) {
      const on = /[xX]/.test(check[1]);
      const box = el("span", { class: "rt-box" + (on ? " on" : ""), role: "checkbox", "aria-checked": String(on) });
      if (on) box.innerHTML = CHECK_ICON;
      if (onCheck) {
        const idx = li; // captured per row so the right line toggles
        box.classList.add("live");
        box.addEventListener("click", ev => { ev.stopPropagation(); onCheck(idx, !on); });
      }
      row.appendChild(box);
      const body = el("span", { class: "rt-body" });
      body.appendChild(renderRich(check[2], images, onResize));
      row.appendChild(body);
    } else if (m[2]) {
      row.appendChild(el("span", { class: "rt-dot" }, "•"));
      const body = el("span", { class: "rt-body" });
      body.appendChild(renderRich(m[3], images, onResize));
      row.appendChild(body);
    } else {
      row.appendChild(renderRich(m[3], images, onResize));
    }
    frag.appendChild(row);
  }
  return frag;
}

// a shimmering gradient fighting with moving content just reads as noise, so the sweep holds
// still while anything is scrolling and picks up where it left off ~220ms after it settles.
// paused rather than cancelled, so it never visibly restarts.
function pauseShimmerOnScroll(target, scroller) {
  let idle = null;
  (scroller || window).addEventListener("scroll", () => {
    target.classList.add("paused");
    clearTimeout(idle);
    idle = setTimeout(() => target.classList.remove("paused"), 220);
  }, { passive: true });
}

// pinch a run of photos closed and they collapse into a fanned deck; spread it and they lay
// back out as a row. the state is remembered per run of markers, not stored on the entry, so
// it survives re-renders without becoming data.
const stackedRuns = new Set();
function attachGalleryPinch(gal, key) {
  let start = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  gal.addEventListener("touchstart", ev => {
    if (ev.touches.length !== 2) return;
    ev.stopPropagation(); // the list's own pinch-to-compact must not also fire
    start = dist(ev.touches);
  }, { passive: true });
  gal.addEventListener("touchmove", ev => {
    if (start == null || ev.touches.length !== 2) return;
    ev.stopPropagation();
    ev.preventDefault(); // no page zoom while shaping the deck
    const ratio = dist(ev.touches) / start;
    if (ratio < 0.82) { gal.classList.add("stacked"); stackedRuns.add(key); start = null; }
    else if (ratio > 1.22) { gal.classList.remove("stacked"); stackedRuns.delete(key); start = null; }
    if (start === null) gal.dispatchEvent(new Event("galchange")); // let the edge fades re-measure
  }, { passive: false });
  gal.addEventListener("touchend", () => { start = null; }, { passive: true });
}

// each end gets a fade, shown only when there's actually content hidden that way — so they
// answer "is there more?" honestly at both edges. overflow is measured, not inferred from the
// photo count: two images normally fill the row exactly, but not once one of them is portrait
// enough to widen it, and a stale one-shot measurement was why the cue came and went.
// also flags the gallery as "mid-drag" for a beat so a fast flick's tail can't register as
// the tap that opens the size rail — belt-and-braces alongside the browser's own
// click-cancel-on-scroll behaviour.
// Drag-to-scroll for the photo row, MOUSE ONLY. Touch keeps native momentum scrolling and,
// more importantly, keeps the two-finger pinch that fans the row into a deck — claiming
// touch pointers here would fight it. A drag past the threshold swallows the click that
// follows, so dragging across an image doesn't also open its preview.
function attachGalleryDrag(gal) {
  let id = null, startX = 0, startLeft = 0, moved = false;
  gal.addEventListener("pointerdown", ev => {
    if (ev.pointerType !== "mouse" || ev.button !== 0) return;
    if (gal.classList.contains("stacked")) return; // a fanned deck has nothing to scroll
    if (gal.scrollWidth - gal.clientWidth < 2) return;
    id = ev.pointerId; startX = ev.clientX; startLeft = gal.scrollLeft; moved = false;
  });
  gal.addEventListener("pointermove", ev => {
    if (ev.pointerId !== id) return;
    const dx = ev.clientX - startX;
    if (!moved && Math.abs(dx) < 4) return;
    if (!moved) {
      moved = true;
      gal.classList.add("dragging");
      // scroll-snap fights a live drag — it keeps yanking back to the nearest card
      gal.style.scrollSnapType = "none";
      gal.setPointerCapture(id);
    }
    ev.preventDefault();
    gal.scrollLeft = startLeft - dx;
  });
  const end = ev => {
    if (ev.pointerId !== id) return;
    if (moved) {
      gal.classList.add("swallow-click");
      setTimeout(() => gal.classList.remove("swallow-click"), 0);
    }
    id = null;
    gal.classList.remove("dragging");
    gal.style.scrollSnapType = "";
  };
  gal.addEventListener("pointerup", end);
  gal.addEventListener("pointercancel", end);
  // capture phase, so it lands before the image's own click handler opens the preview
  gal.addEventListener("click", ev => {
    if (gal.classList.contains("swallow-click")) { ev.stopPropagation(); ev.preventDefault(); }
  }, true);
}

function attachGalleryFade(wrap, gal) {
  const sync = () => {
    if (gal.classList.contains("stacked")) { // a fanned deck doesn't scroll — no edges to hint at
      wrap.classList.remove("show-left", "show-right");
      return;
    }
    const max = gal.scrollWidth - gal.clientWidth;
    wrap.classList.toggle("show-left", gal.scrollLeft > 2);
    wrap.classList.toggle("show-right", max > 2 && gal.scrollLeft < max - 2);
  };
  let dragTimer = null;
  gal.addEventListener("scroll", () => {
    sync();
    gal.dataset.scrolling = "1";
    clearTimeout(dragTimer);
    dragTimer = setTimeout(() => { delete gal.dataset.scrolling; }, 150);
  }, { passive: true });
  // images settle their width after decode, and pinching re-lays the whole row out — one
  // measurement at render time is not enough to stay correct through either.
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(sync);
    ro.observe(gal);
    for (const img of gal.querySelectorAll("img")) ro.observe(img);
  }
  for (const img of gal.querySelectorAll("img")) {
    if (!img.complete) img.addEventListener("load", sync, { once: true });
  }
  gal.addEventListener("transitionend", sync); // the pinch/spread relayout
  gal.addEventListener("galchange", sync);     // ...and the moment the pinch commits
  sync();
  requestAnimationFrame(sync);
}

// tap a rendered image to open the full-screen preview (and its size rail). this was a
// press-and-hold, which lost the race on the phone too often — finger jitter past the move
// threshold, or Safari's own image gesture, cancelled the timer and the size rail felt gone.
// a single tap can't miss; the composer is still one tap away on the entry's text. cursor
// is zoom-in, so the image already advertises it.
function attachImagePreview(img, src, id, size, onResize) {
  img.addEventListener("click", ev => {
    if (img.closest(".rt-gallery")?.dataset.scrolling === "1") return; // the tail of a drag, not a tap
    ev.stopPropagation(); // don't also open the composer
    ev.preventDefault();
    openImagePreview(src, id, size, onResize);
  });
  img.addEventListener("contextmenu", ev => ev.preventDefault()); // no iOS/desktop image callout on hold
}

let imgPreviewClose = null;
function openImagePreview(src, id, size, onResize) {
  if (imgPreviewClose) imgPreviewClose();
  const back = el("div", { class: "img-preview-back" });
  const stage = el("div", { class: "img-preview-stage" });
  const frame = el("div", { class: "img-preview-frame" }); // gives the photo a shrinkable box
  frame.appendChild(el("img", { class: "img-preview-img", src, alt: "photo" }));
  stage.appendChild(frame);
  back.appendChild(stage);

  // size rail — only when the caller can persist a change (i.e. a real entry, not a preview view)
  if (onResize) {
    let current = size;
    const rail = el("div", { class: "img-size-rail" });
    rail.appendChild(el("div", { class: "img-size-title" }, "size"));
    const labels = { inline: "Inline", "1x": "1×", "2x": "2×", "3x": "3×" };
    const btns = {};
    for (const s of IMG_SIZES) {
      const b = el("button", { class: "img-size-btn" + (s === current ? " active" : ""),
        onclick: ev => {
          ev.stopPropagation();
          current = s;
          for (const k in btns) btns[k].classList.toggle("active", k === s);
          onResize(id, s); // rewrites the marker + re-renders the list underneath
        } }, labels[s]);
      btns[s] = b;
      rail.appendChild(b);
    }
    stage.appendChild(rail);
  }

  const close = () => {
    back.classList.remove("show");
    document.removeEventListener("keydown", onKey);
    imgPreviewClose = null;
    setTimeout(() => back.remove(), 220);
  };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  // short guard so the tap that opened the preview can't also dismiss it. it used to be 260ms,
  // to outlast the finger-up of a long-press; a tap is over by the time we get here.
  let armed = false;
  setTimeout(() => { armed = true; }, 100);
  back.addEventListener("click", ev => {
    if (armed && (ev.target === back || ev.target === stage || ev.target === frame)) close(); // tapping beside the photo
  });
  document.addEventListener("keydown", onKey);
  imgPreviewClose = close;
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add("show"));
}

// persist a chosen display size by rewriting the marker in the owning entry's text
// (size travels in the text, so it syncs with no extra column). 3x is the default -> no suffix.
function setImageSize(entryId, imgId, size) {
  const re = new RegExp("!\\[photo:" + imgId + "(?:@(?:inline|1x|2x|3x))?\\]", "g");
  const mark = size === "3x" ? "![photo:" + imgId + "]" : "![photo:" + imgId + "@" + size + "]";

    lines[lineIndex] = lines[lineIndex].replace(/^(\s*[-—] )\[[ xX]\]/, "$1[" + (checked ? "x" : " ") + "]");

// pull remote rows and merge into local state (last-write-wins). returns true if local changed.
async function syncPull() {
  if (!syncActive()) return false;
  let changed = false;
  try {
    const { data: rows, error } = await sb.from("deposits_entries").select("*");
    if (error) throw error;
    const byId = new Map(entries.map(e => [e.id, e]));
    for (const r of rows) {
      if (r.deleted_at) {
        if (byId.delete(r.id)) changed = true;
        tombstones[r.id] = r.deleted_at;
        continue;
      }
      if (tombstones[r.id] && new Date(tombstones[r.id]) >= new Date(r.updated_at)) continue; // local delete wins
      const local = byId.get(r.id);
      if (!local || new Date(r.updated_at) >= new Date(local.updatedAt || local.createdAt)) {
        const ne = rowToEntry(r);
        // the cloud row carries no images until the `images jsonb` migration is run (push
        // strips them). don't let that image-less copy clobber images we still hold locally
        // for markers the text references — otherwise a synced upload renders as raw ![photo:id].
        if (!ne.images && local && local.images) {
          const keep = imagesUsedIn(ne.text, local.images);
          if (Object.keys(keep).length) ne.images = keep;
        }
        byId.set(r.id, ne); changed = true;
      }
    }
    entries = [...byId.values()];
  } catch (e) { console.warn("sync pull entries failed", e); }

  try {
    const { data: rows, error } = await sb.from("deposits_week_summaries").select("*");
    if (error) throw error;
    for (const r of rows) {
      const k = r.week_key;
      if (r.deleted_at) {
        if (weekSummaries[k]) { delete weekSummaries[k]; changed = true; }
        if (weekSummaryVersions[k]) { delete weekSummaryVersions[k]; saveWeekSummaryVersions(); } // remote clear = start over
        summaryTombstones[k] = r.deleted_at;
        continue;
      }
      if (summaryTombstones[k] && new Date(summaryTombstones[k]) >= new Date(r.updated_at)) continue;
      const local = weekSummaries[k];
      if (!local || new Date(r.updated_at) >= new Date(summaryUpdatedAt(local))) {
        weekSummaries[k] = { text: r.text, origin: r.origin, version: r.version,
          edited: r.edited, createdAt: r.created_at, updatedAt: r.updated_at };
        changed = true;
      }
    }
  } catch (e) { console.warn("sync pull summaries failed", e); }

  saveTombstones();
  if (changed) { saveEntries(entries); saveWeekSummaries(); } // persists + schedules push of any local-only rows
  return changed;
}

// ---------- anthropic ----------
// one call shape for all three AI features. returns the assistant's text.
// note: find the text block rather than indexing content[0] — models that think before
// writing put thinking blocks first, so [0] is not the reply.
async function anthropic(body) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("api " + r.status);
  const data = await r.json();
  const block = (data.content || []).find(b => b.type === "text");
  return ((block && block.text) || "").trim();
}
// for the features that want JSON back — tolerates a model that wraps its reply in a
// ```json fence despite being told not to.
async function anthropicJSON(body) {
  const raw = await anthropic(body);
  return JSON.parse(raw.replace(/^```(json)?\s*/i, "").replace(/```\s*$/, "").trim());
}

// ---------- ramble segmentation ----------
// breaks one long entry into several deposits. the model never writes anything: it only
// returns the verbatim first words of each proposed segment (plus a topic guess), and the
// app cuts the original string itself — so every deposit is exactly her words. anchors
// that can't be found verbatim simply dissolve into the previous segment.
function segmentAnchorsToRanges(text, items) {
  // whitespace/case-insensitive verbatim search: normalize the haystack once,
  // keeping a map from each normalized char back to its original index
  const map = []; let norm = "";
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (/\s/.test(c)) {
      if (!norm || norm.endsWith(" ")) continue;
      norm += " "; map.push(i);
    } else {
      norm += c.toLowerCase(); map.push(i);
    }
  }
  const starts = [{ at: 0, topic: null }]; // segment 1 always starts at the very beginning
  let from = 0;
  items.forEach((it, i) => {
    const topic = topicById[it.topic] ? it.topic : null;
    const nq = String(it.first_words || "").toLowerCase().replace(/\s+/g, " ").trim();
    if (!nq) return;
    const at = norm.indexOf(nq, from);
    if (at === -1) return;
    from = at + nq.length;
    const last = starts[starts.length - 1];
    if (i === 0 || map[at] <= last.at) {
      if (!last.topic) last.topic = topic; // seam collapses into the previous segment
      return;
    }
    starts.push({ at: map[at], topic });
  });
  return starts
    .map((s, i) => ({ start: s.at, end: i + 1 < starts.length ? starts[i + 1].at : text.length, topic: s.topic }))
    .filter(rg => text.slice(rg.start, rg.end).trim());
}

async function segmentRamble(text) {
  const topicList = TOPICS.map(t => t.id + " (" + t.label + ")").join(", ");
  const parsed = await anthropicJSON({
    model: "claude-haiku-4-5-20251001",
    max_tokens: 600,
    system: "You segment one long journal ramble into 2-6 self-contained deposits. Never rewrite, reorder, summarize or add words — you only decide where one thought ends and the next begins. Cut at genuine shifts of subject; prefer fewer, meatier segments over many tiny ones. Reply with only strict JSON, no code fences: {\"segments\":[{\"first_words\":string,\"topic\":string|null}]}. first_words is the exact first 4-8 words of that segment, copied verbatim from the input including punctuation and markdown markers. The first segment starts at the very beginning of the input. topic is the single best-fitting id from [" + topicList + "], or null if none fits.",
    messages: [{ role: "user", content: text }]
  });
  const list = Array.isArray(parsed) ? parsed : parsed.segments;
  if (!Array.isArray(list) || !list.length) throw new Error("bad segments payload");
  return segmentAnchorsToRanges(text, list);
}

// ---------- grouping + markdown ----------
function activeEntries() {
  if (view === "week") {
    const list = entries.filter(e => !e.segmented && e.year === wk.year && e.week === wk.week);
    // NOTE the two different day comparators. Ascending uses dayAsc, whose 99 sentinel sends
    // no-day entries to the END; descending uses daySortKey, whose -1 sentinel does the same
    // once the order is flipped. Swapping one for the other floats "anytime" to the top.
    return oldestFirst
      ? list.sort((a, b) => (dayAsc(a) - dayAsc(b)) || a.createdAt.localeCompare(b.createdAt))
      : list.sort((a, b) => (daySortKey(b) - daySortKey(a)) || b.createdAt.localeCompare(a.createdAt));
  }
  return entriesForMonth(mo.year, mo.month);
}
function entriesForMonth(year, month) {
  return entries
    .filter(e => {
      if (e.segmented) return false; // ramble originals live behind their segments, not in views
      if (e.week == null) return e.year === year && e.month === month; // month-scoped entry
      const mon = mondayOfISOWeek(e.year, e.week);
      const thu = new Date(mon);
      thu.setUTCDate(mon.getUTCDate() + 3); // week belongs to the month its Thursday is in
      return thu.getUTCFullYear() === year && thu.getUTCMonth() === month;
    })
    .sort(oldestFirst
      ? (a, b) => (weekAsc(a) - weekAsc(b)) || (dayAsc(a) - dayAsc(b)) || a.createdAt.localeCompare(b.createdAt)
      : (a, b) => (weekSortKey(b) - weekSortKey(a)) || (daySortKey(b) - daySortKey(a)) || b.createdAt.localeCompare(a.createdAt));
}
// week-less (month-scoped) entries belong at the END in either direction, so ascending needs
// a HIGH sentinel where descending's weekSortKey uses -1. Reusing -1 here floats them to the top.
function weekAsc(e) { return e.week == null ? 999 : e.week; }
function weekSortKey(e) { return e.week == null ? -1 : e.week; } // month-scoped entries land last, like no-day ones
function groupByTopic(list) {
  const groups = {};
  const order = [...TOPICS.map(t => t.id), ...MODES.map(m => m.id), "untagged"];
  for (const e of list) {
    const key = e.tags.find(t => topicById[t]) || e.tags.find(t => modeById[t]) || "untagged";
    (groups[key] = groups[key] || []).push(e);
  }
  return order.filter(k => groups[k]).map(k => ({ key: k, entries: groups[k] }));
}
function groupLabel(key) {
  return (topicById[key] && topicById[key].label) || (modeById[key] && modeById[key].label) || "untagged";
}
function exportHeading() {
  return view === "week"
    ? "Week " + wk.week + " \u00B7 " + weekRangeLabel(wk.year, wk.week) + " " + wk.year
    : monthLabel(mo.year, mo.month);
}
function toMarkdown(list, heading) {
  let md = "# " + heading + "\n\n";
  for (const g of groupByTopic(list)) {
    md += "## " + groupLabel(g.key) + "\n\n";
    for (const e of g.entries) {
      const modes = e.tags.filter(t => modeById[t]).map(t => modeById[t].label);
      const d = entryDay(e);
      md += "- " + e.text
        + (modes.length ? " _(" + modes.join(", ") + ")_" : "")
        + " \u2014 " + (e.week == null
          ? monthLabel(e.year, e.month)
          : (d == null ? "" : DAY_TOKENS[d] + ", ") + "W" + pad2(e.week)) + "\n";
    }
    md += "\n";
  }
  return md;
}

// ---------- DOM helpers ----------
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "style") Object.assign(node.style, v);
      else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

// ---------- layout ----------
// the experiment settled (29 Jul 2026): "topic" is the baseline and the default on every
// open — full header on every group. "day" is the one alternative worth keeping: day headers
// in week view, week headers in month view. mix and dense are gone.
// tapping the active toggle returns to the baseline, so "nothing selected" is a real state.
const LAYOUT_OPTIONS = ["day"];
// Day view survives a kill, the same way the reading order already did — it's a way of looking at
// the week, not a per-visit mode, and having to switch it back on every launch made it feel like
// a toy. Only "day" is remembered as such; anything else in storage falls back to topic, so a
// junk value can't leave the app in a layout it can't render.
const LAYOUT_KEY = "weekly-deposits-layout";
let layout = "topic";
try { if (localStorage.getItem(LAYOUT_KEY) === "day") layout = "day"; } catch (e) {}
function setLayout(v) {
  layout = v === "day" ? "day" : "topic";
  try { localStorage.setItem(LAYOUT_KEY, layout); } catch (e) {}
  render();
}

// Reading order WITHIN a group. Default newest first — the thing you just wrote is the thing
// you want to see, and it matches the way the topic groups themselves are ordered
// (latest-touched at the top). Flipping to oldest-first replays the week as it actually ran.
const ORDER_KEY = "weekly-deposits-oldest-first";
let oldestFirst = false;
try { oldestFirst = localStorage.getItem(ORDER_KEY) === "1"; } catch (e) {}
function setOldestFirst(v) {
  oldestFirst = !!v;
  try { localStorage.setItem(ORDER_KEY, oldestFirst ? "1" : "0"); } catch (e) {}
  render();
}

// ---------- composer unfold speed ----------
// Four levels, as one multiplier over every duration in the unfold (--unfold-k, see :root).
// The ladder was rebuilt on 31 Jul around the old level 4: it became level 2 and the default,
// because nothing slower than the old default was ever wanted. So 1 is the old default (620ms),
// 2 is the old level 4 (440ms), 3 is only slightly quicker again (372ms — a nudge, not a step,
// which is what was asked for), and 4 is 0. The two slowest rungs of the old scale are gone.
// Level 4 is not just 0s durations: unfoldStill() sends the JS down the same path
// prefers-reduced-motion takes, so the sheet doesn't run a zero-length clip dance, it appears.
// The key is versioned because the INDICES changed meaning — a stored 3 used to be 440ms and
// would now be no-motion, so the old value has to be dropped rather than reinterpreted.
const UNFOLD_KEY = "weekly-deposits-unfold-v2";
const UNFOLD_STEPS = [1, 0.71, 0.6, 0];
const UNFOLD_DEFAULT = 1;
let unfoldLevel = UNFOLD_DEFAULT;
try {
  const raw = parseInt(localStorage.getItem(UNFOLD_KEY), 10);
  if (raw >= 0 && raw < UNFOLD_STEPS.length) unfoldLevel = raw; // rejects NaN and junk in one test
} catch (e) {}
function unfoldK() { return UNFOLD_STEPS[unfoldLevel]; }
// no animation at all, either because she asked for it or because the OS did
function unfoldStill() {
  return unfoldK() === 0 || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function applyUnfoldSpeed() {
  document.documentElement.style.setProperty("--unfold-k", String(unfoldK()));
}
// the note under the scale states the real duration rather than a vague word — the whole point
// of the setting is that she can feel the difference, so name the thing she's changing
function unfoldNote() {
  if (unfoldK() === 0) {
    return "no animation — the composer appears at once and the keyboard comes straight up.";
  }
  const ms = Math.round(620 * unfoldK());
  return "how long the composer takes to unfold out of the compose bar: " + ms + "ms"
    + (unfoldLevel === UNFOLD_DEFAULT ? ", the tuned default." : ".");
}
function setUnfoldLevel(i) {
  unfoldLevel = Math.max(0, Math.min(UNFOLD_STEPS.length - 1, i));
  try { localStorage.setItem(UNFOLD_KEY, String(unfoldLevel)); } catch (e) {}
  applyUnfoldSpeed();
}
applyUnfoldSpeed();

// topic group display order: latest-updated first
function orderGroupsForDisplay(groups) {
  const stamp = g => Math.max(...g.entries.map(entryStamp));
  return [...groups].sort((a, b) => stamp(b) - stamp(a));
}

// ---------- confirm dialog ----------
function confirmAction(message, okLabel, onConfirm) {
  const ov = el("div", { class: "confirm-overlay", onclick: () => ov.remove() });
  ov.appendChild(el("div", { class: "confirm-box", onclick: e => e.stopPropagation() },
    el("p", null, message),
    el("div", { class: "confirm-actions" },
      el("button", { class: "confirm-cancel", onclick: () => ov.remove() }, "Cancel"),
      el("button", { class: "confirm-ok", onclick: () => { ov.remove(); onConfirm(); } }, okLabel)
    )));
