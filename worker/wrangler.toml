name = "deposits"
main = "src/worker.js"
compatibility_date = "2026-01-15"

# The private bucket holding entries.json and images/<id>. Create it once:
#   npx wrangler r2 bucket create deposits
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "deposits"

[vars]
# The page allowed to call this Worker. Set it to wherever the app is served from —
# "*" works but means the secret is the only thing standing in the way.
ALLOWED_ORIGIN = "https://nnnephirale.github.io"

# SSaved's /s/… routes are moving to their own Worker (../worker-ssaved) so that one app's
# traffic can no longer spend the other's daily request budget. They keep answering here until
# SSaved's client points at the new URL; set this to "off" and redeploy once it does.
SSAVED_ROUTES = "on"

# No [triggers] here any more. The Supabase keep-alive went with the routes it serves — it was
# always SSaved's uptime, not this Worker's — and what watches *this* Worker deliberately runs
# somewhere else: ../worker-ssaved's cron, and .github/workflows/health.yml, which is outside
# Cloudflare altogether and so still fires when the account is over its daily limit.

# DEPOSITS_SECRET is NOT here — it is the key to everything in the bucket and this file is
# committed. Set it once, and it stays encrypted at Cloudflare:
#   npx wrangler secret put DEPOSITS_SECRET
